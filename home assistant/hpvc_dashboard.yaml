              Not used for import restore.


              **Night restore**: restores full inverter limits after PV stays at
              or below the configured threshold for a while.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.hpvc_export_threshold_range_invalid
                    state: 'on'
                card:
                  type: markdown
                  text_only: true
                  content: >-
                    <ha-alert alert-type="warning">Export start must be lower
                    than Target export, and Target export must be lower than
                    Import restore.</ha-alert>
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: input_number.hpvc_export_start_threshold
                    name: Export start
                  - entity: input_number.hpvc_export_stop_threshold
                    name: Target export
                  - entity: input_number.hpvc_import_restore_threshold
                    name: Import restore
                  - entity: input_number.hpvc_pv_min_power_for_control
                    name: Min PV for control
                  - entity: input_number.hpvc_pv_night_restore_power
                    name: Night restore
        grid_options:
          columns: 5
          rows: auto
      - type: grid
        cards:
          - type: markdown
            content: |
              ### 🎚️ Control Tuning
          - type: markdown
            text_only: true
            content: >-
              **Cooldown**: minimum time between PV limit changes (10 to 60
              sec).


              **Deadband**: ignores small differences around Target export so
              Home PV Control does not react to tiny changes.
          - type: entities
            entities:
              - entity: input_number.hpvc_cooldown_seconds
                name: Cooldown
              - entity: input_number.hpvc_pv_adjust_deadband
                name: Deadband
            show_header_toggle: false
        grid_options:
          columns: 3
          rows: auto
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  ### 🧩 Optional HBC Setup

                  {% if is_state('binary_sensor.hpvc_hbc_available', 'on') %}
                  <ha-alert title="HBC detected" alert-type="success"> HBC
                  strategy control is available. Enable or disable it in <b>PV
                  Master Control</b> when HPVC is enabled. </ha-alert> {% else
                  %} <ha-alert title="Standalone mode" alert-type="warning"> No
                  compatible HBC runtime was detected.

                  HPVC requires both
                  <code>input_select.house_battery_strategy</code> and
                  <code>input_text.house_battery_strategy_active_sub_strategy</code>.
                  </ha-alert> {% endif %}
              - type: conditional
                conditions:
                  - entity: binary_sensor.hpvc_hbc_available
                    state: 'on'
                  - entity: input_boolean.hpvc_control_hbc_strategy
                    state: 'on'
                card:
                  type: entities
                  show_header_toggle: false
                  entities:
                    - entity: input_select.house_battery_strategy
                      name: HBC strategy to run
                      icon: mdi:home-battery
                    - type: section
                    - entity: input_boolean.hpvc_negative_price_hbc_charge
                      name: Force charge at negative price
                      icon: mdi:battery-charging
        grid_options:
          columns: 12
          rows: auto
    cards: []
