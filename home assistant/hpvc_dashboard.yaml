            show: true
        yaxis:
          lines:
            show: true
      legend:
        show: false
      xaxis:
        type: datetime
        labels:
          datetimeUTC: false
          format: HH:mm
          rotate: -45
          rotateAlways: true
          maxHeight: 70
          offsetY: -3
        tooltip:
          enabled: true
          formatter: "EVAL:function(value) {\n  const date = new Date(value);\n\n  const pad = number =>\n    String(number).padStart(2, '0');\n\n  return (\n    pad(date.getHours()) +\n    ':' +\n    pad(date.getMinutes())\n  );\n}\n"
        crosshairs:
          show: true
          stroke:
            width: 1
            dashArray: 3
      yaxis:
        decimalsInFloat: 0
        title:
          text: cent / kWh
      tooltip:
        enabled: true
        shared: true
        intersect: false
        followCursor: true
        theme: false
        custom: "EVAL:function({ series, seriesIndex, dataPointIndex, w }) {\n\n  const priceSeriesIndex =\n    w &&\n    w.config &&\n    w.config.series\n      ? w.config.series.findIndex(s => s.name === 'Price')\n      : -1;\n\n  const index =\n    priceSeriesIndex >= 0\n      ? priceSeriesIndex\n      : seriesIndex;\n\n  const value =\n    series[index] &&\n    dataPointIndex >= 0 &&\n    dataPointIndex < series[index].length\n      ? Number(series[index][dataPointIndex])\n      : NaN;\n\n  const point =\n    w &&\n    w.config &&\n    w.config.series &&\n    w.config.series[index] &&\n    w.config.series[index].data &&\n    dataPointIndex >= 0\n      ? w.config.series[index].data[dataPointIndex]\n      : null;\n\n  const colour =\n    point && point.fillColor\n      ? point.fillColor\n      : '#9e9e9e';\n\n  const display =\n    Number.isFinite(value)\n      ? value.toFixed(1) + ' ct/kWh'\n      : '—';\n\n  return (\n    '<div style=\"display:flex;align-items:center;gap:7px;padding:7px 9px;font-size:10px;width:max-content;box-sizing:border-box;background:color-mix(in srgb,var(--ha-card-background,var(--card-background-color)) 35%,transparent);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);border-radius:6px;border:1px solid var(--divider-color);color:var(--primary-text-color);font-family:inherit;box-shadow:none;font-weight:700;\">' +\n      '<span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:' +\n      colour +\n      ';flex-shrink:0;\"></span>' +\n      '<span style=\"color:var(--secondary-text-color);\">Price</span>' +\n      '<span>' +\n      display +\n      '</span>' +\n    '</div>'\n  );\n}\n"
    series:
    - entity: sensor.hbc_energy_prices_data
      name: Current high price
      color: '#ff9800'
      unit: ' ct/kWh'
      float_precision: 1
      extend_to: false
      show:
        in_chart: false
        in_header: true
        name_in_header: false
        null_in_header: false
        legend_value: false
      data_generator: "const marks = entity.attributes.marks || [];\nconst now = Date.now();\n\nconst current =\n  marks.find(interval => interval.is_now) ||\n  marks.find((interval, index) => {\n    const start =\n      new Date(interval.start).getTime();\n\n    const nextStart =\n      index < marks.length - 1\n        ? new Date(marks[index + 1].start).getTime()\n        : start + (15 * 60 * 1000);\n\n    return now >= start && now < nextStart;\n  });\n\nif (\n  !current ||\n  current.mark !== 'high' ||\n  !Number.isFinite(Number(current.price))\n) {\n  return [];\n}\n\nreturn [[now, Number(current.price)]];\n"
    - entity: sensor.hbc_energy_prices_data
      name: Current low price
      color: '#4caf50'
      unit: ' ct/kWh'
      float_precision: 1
      extend_to: false
      show:
        in_chart: false
        in_header: true
        name_in_header: false
        null_in_header: false
        legend_value: false
      data_generator: "const marks = entity.attributes.marks || [];\nconst now = Date.now();\n\nconst current =\n  marks.find(interval => interval.is_now) ||\n  marks.find((interval, index) => {\n    const start =\n      new Date(interval.start).getTime();\n\n    const nextStart =\n      index < marks.length - 1\n        ? new Date(marks[index + 1].start).getTime()\n        : start + (15 * 60 * 1000);\n\n    return now >= start && now < nextStart;\n  });\n\nif (\n  !current ||\n  current.mark !== 'low' ||\n  !Number.isFinite(Number(current.price))\n) {\n  return [];\n}\n\nreturn [[now, Number(current.price)]];\n"
    - entity: sensor.hbc_energy_prices_data
      name: Current normal price
      color: '#9e9e9e'
      unit: ' ct/kWh'
      float_precision: 1
      extend_to: false
      show:
        in_chart: false
        in_header: true
        name_in_header: false
        null_in_header: false
        legend_value: false
      data_generator: "const marks = entity.attributes.marks || [];\nconst now = Date.now();\n\nconst current =\n  marks.find(interval => interval.is_now) ||\n  marks.find((interval, index) => {\n    const start =\n      new Date(interval.start).getTime();\n\n    const nextStart =\n      index < marks.length - 1\n        ? new Date(marks[index + 1].start).getTime()\n        : start + (15 * 60 * 1000);\n\n    return now >= start && now < nextStart;\n  });\n\nif (\n  !current ||\n  current.mark === 'high' ||\n  current.mark === 'low' ||\n  !Number.isFinite(Number(current.price))\n) {\n  return [];\n}\n\nreturn [[now, Number(current.price)]];\n"
    - entity: sensor.hbc_energy_prices_data
      name: Price
      type: column
      float_precision: 1
      show:
        in_header: false
        legend_value: false
      data_generator: "const marks = entity.attributes.marks || [];\n\nconst colours = {\n  high: '#ff9800',\n  low: '#4caf50'\n};\n\nconst startOfTomorrow = new Date();\nstartOfTomorrow.setHours(24, 0, 0, 0);\n\nconst tomorrowTimestamp =\n  startOfTomorrow.getTime();\n\nconst withOpacity = (hex, opacity) => {\n  const value = hex.replace('#', '');\n\n  const red =\n    parseInt(value.slice(0, 2), 16);\n\n  const green =\n    parseInt(value.slice(2, 4), 16);\n\n  const blue =\n    parseInt(value.slice(4, 6), 16);\n\n  return `rgba(${red}, ${green}, ${blue}, ${opacity})`;\n};\n\nreturn marks.map(interval => {\n  const timestamp =\n    new Date(interval.start).getTime();\n\n  const colour =\n    interval.is_now\n      ? '#009ac7'\n      : (colours[interval.mark] || '#9e9e9e');\n\n  return {\n    x: timestamp,\n    y: Number(interval.price),\n    fillColor:\n      timestamp >= tomorrowTimestamp &&\n      !interval.is_now\n        ? withOpacity(colour, 0.55)\n        : colour\n  };\n});\n"
