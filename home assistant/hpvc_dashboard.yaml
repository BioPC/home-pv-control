                entity: input_boolean.hpvc_config
                state: "on"
            card:
              type: markdown
              text_only: true
              content: >-
                **Export start**: start limiting when export is stronger than
                this value.


                **Target export**: export level Home PV Control tries to
                maintain while limiting and revealing. Must be higher (less
                negative) than Export start.


                **Import restore**: raise PV again if the house imports too much
                while limited.


                **Min PV for control**: prevents export limiting when PV is low.
                Not used for import restore.


                **Night restore**: automatically restores full inverter limits
                after sunset. Otherwise, the PV threshold is used instead.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.hpvc_config
                state: "on"
            card:
