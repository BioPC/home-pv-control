title: Home PV Control
views:
- type: sections
  title: Main
  path: home-pv-control
  icon: mdi:solar-power-variant
  max_columns: 3
  header:
    layout: center
    badges_position: top
    badges_wrap: wrap
    card:
      type: vertical-stack
      cards:
      - type: markdown
        text_only: true
        content: '<div align="center">


          ## Home PV Control (v1.4.0)

          #### Standalone PV optimization for dynamic energy contracts. Optional HBC integration.

          </div>

          '
      - type: markdown
        text_only: true
        content: "<div align=\"center\">\n  <sup>\n    <font color=\"#888888\">\n      ☆ &nbsp; Like this project? Consider giving a star! &nbsp; ›\n    </font>\n  </sup>\n  &nbsp;\n  <a href=\"https://github.com/BioPC/home-pv-control\">\n    <img src=\"https://img.shields.io/github/stars/BioPC/home-pv-control?style=flat&logo=github&label=Stars&logoColor=white&color=3a3a3a&labelColor=242424\">\n  </a>\n</div>\n"
        tap_action:
          action: url
          url_path: https://github.com/BioPC/home-pv-control
  badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: input_text.hpvc_status
    name: HPVC Status
    visibility:
    - condition: state
      entity: input_boolean.hpvc_onboarding_complete
      state: 'on'
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.hpvc_negative_price_mode
    name: Negative Price
    visibility:
    - condition: state
      entity: binary_sensor.hpvc_negative_price_mode
      state_not: 'off'
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: input_number.hpvc_inverter_count
    name: Inverters
    visibility:
    - condition: state
      entity: input_boolean.hpvc_onboarding_complete
      state: 'on'
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: input_number.house_battery_count
    name: Batteries
    visibility:
    - condition: state
      entity: input_boolean.hpvc_onboarding_complete
      state: 'on'
    - condition: state
      entity: input_boolean.hpvc_control_hbc_strategy
      state: 'on'
    - condition: state
      entity: binary_sensor.hpvc_hbc_available
      state: 'on'
  - type: entity
    entity: input_select.house_battery_strategy
    show_name: true
    name: HBC Strategy
    visibility:
    - condition: state
      entity: input_boolean.hpvc_control_hbc_strategy
      state: 'on'
    - condition: state
      entity: binary_sensor.hpvc_hbc_available
      state: 'on'
  - type: entity
    entity: input_text.house_battery_strategy_active_sub_strategy
    show_name: true
    name: HBC Executing
    visibility:
    - condition: state
      entity: input_boolean.hpvc_control_hbc_strategy
      state: 'on'
    - condition: state
      entity: binary_sensor.hpvc_hbc_available
      state: 'on'
    - condition: or
      conditions:
      - condition: state
        entity: input_select.house_battery_strategy
        state: Dynamic
      - condition: state
        entity: input_select.house_battery_strategy
        state: Timed
  sections:
  - type: grid
    columns: 1
    square: false
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: input_boolean.hpvc_onboarding_complete
        state: 'off'
      card:
        type: markdown
        content: "{% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}\n{% set core = [\n  ('Grid sensor', states('input_text.hpvc_grid_power_sensor')),\n  ('Market/export price', states('input_text.hpvc_market_price_sensor')),\n  ('All-in price', states('input_text.hpvc_all_in_price_sensor')),\n  ('Solar power', states('input_text.hpvc_pv_power_sensor'))\n] %}\n{% set ns = namespace(done=0, total=4) %}\n<ha-alert title=\"Welcome to Home PV Control\" alert-type=\"warning\">\nOpen the <b>Settings</b> tab using the <b>⚙️ Settings</b> button in the navigation bar and complete the required configuration. Once setup and all required live inputs are valid, HPVC switches on automatically. </ha-alert>\n<p><b>Setup progress:</b></p>\n{% for label, ent in core %}\n{% set normalized = ent | trim | lower %}\n{% set configured = normalized not in bad and (normalized | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) %}\n{% set valid = configured and states(normalized) not in bad and is_number(states(normalized)) %}\n{% if valid %}{% set ns.done = ns.done + 1 %}✅{% else %}❌{% endif %} **{{ label }}**\n{% endfor %}\n{% set count = states('input_number.hpvc_inverter_count') | int(0) %}\n{% set inv = namespace(valid=count > 0, entities=[]) %}\n{% for i in range(1, count + 1) %}\n  {% set ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') %}\n  {% set normalized = ent | trim | lower %}\n  {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit') | float(0) %}\n  {% set low = states('input_number.hpvc_pv' ~ i ~ '_low_limit') | float(-1) %}\n  {% set configured = normalized not in bad and (normalized | regex_match('^number[.][a-z0-9_]+$')) and normalized not in inv.entities and full > 0 and low >= 0 and low < full %}\n  {% set live = configured and states(normalized) not in bad and is_number(states(normalized)) %}\n  {% if not live %}\n    {% set inv.valid = false %}\n  {% else %}\n    {% set inv.entities = inv.entities + [normalized] %}\n  {% endif %}\n{% endfor %}\n{% set ns.total = ns.total + 1 %}\n{% if inv.valid %}{% set ns.done = ns.done + 1 %}✅{% else %}❌{% endif %} **Inverter setup**\n  \n\n{% set ns.total = ns.total + 1 %} {% set setup_ready =\n  is_state('input_boolean.hpvc_defaults_applied', 'on')\n  and is_state('binary_sensor.hpvc_configuration_valid', 'on')\n%} {% if setup_ready %}{% set ns.done = ns.done + 1 %}✅{% else %}❌{% endif %} **Control settings**\n<p><b>{{ ns.done }}/{{ ns.total }} complete</b></p>"
    - type: conditional
      conditions:
      - condition: state
        entity: input_boolean.hpvc_onboarding_complete
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.hpvc_configuration_valid
          state: 'off'
        - condition: state
          entity: binary_sensor.hpvc_required_inputs_ready
          state: 'off'
      card:
        type: markdown
        content: "{% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}\n{% set config_ok =\n  is_state('binary_sensor.hpvc_configuration_valid', 'on')\n%}\n{% set inputs_ok =\n  is_state('binary_sensor.hpvc_required_inputs_ready', 'on')\n%}\n{% set core = [\n  ('Grid power', states('input_text.hpvc_grid_power_sensor')),\n  ('Market/export price', states('input_text.hpvc_market_price_sensor')),\n  ('All-in price', states('input_text.hpvc_all_in_price_sensor')),\n  ('Solar power', states('input_text.hpvc_pv_power_sensor'))\n] %}\n<ha-alert title=\"Home PV Control unavailable\" alert-type=\"warning\"> {% if not config_ok and not inputs_ok %} One or more required configuration values or live inputs are missing, invalid, unavailable, or unknown. Open <b>Settings</b> and correct the items marked with ❌. HPVC remains off until the configuration and all required inputs are healthy. {% elif not config_ok %} One or more required configuration values are missing or invalid. Open <b>Settings</b> and correct the items marked with ❌. {% elif is_state('input_boolean.hpvc_auto_resume_pending', 'on') %} A required live input is unavailable, unknown, or invalid. HPVC was switched off automatically and will switch on again after the configuration and all required inputs have remained healthy for 5 seconds. {% elif is_state('input_boolean.hpvc_enabled', 'on') %} A required live input is unavailable, unknown, or invalid. HPVC is being switched off automatically for safety. {% else %} A required live input is unavailable, unknown, or invalid. HPVC is off. It will resume automatically only if it was running before the problem. A manual switch-off remains off. {% endif %} </ha-alert>\n<p><b>Configuration and required inputs:</b></p>\n{% for label, ent in core %}\n  {% set normalized = ent | trim | lower %}\n  {% set configured =\n    normalized not in bad\n    and (normalized | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$'))\n  %}\n  {% set live =\n    configured\n    and states(normalized) not in bad\n    and is_number(states(normalized))\n  %}\n  {% set valid = configured and live %}\n\n  {% if valid %}✅{% else %}❌{% endif %} **{{ label }}**\n  {% if configured %} — `{{ normalized }}`{% endif %}\n{% endfor %}\n{% set count =\n  states('input_number.hpvc_inverter_count') | int(0)\n%}\n{% set inv = namespace(entities=[]) %}\n{% for i in range(1, count + 1) %}\n  {% set ent =\n    states('input_text.hpvc_pv' ~ i ~ '_limit_number') | trim\n  %}\n  {% set normalized = ent | lower %}\n  {% set full =\n    states('input_number.hpvc_pv' ~ i ~ '_full_limit') | float(0)\n  %}\n  {% set low =\n    states('input_number.hpvc_pv' ~ i ~ '_low_limit') | float(-1)\n  %}\n\n  {% set configured =\n    normalized not in bad\n    and (normalized | regex_match('^number[.][a-z0-9_]+$'))\n    and normalized not in inv.entities\n    and full > 0\n    and low >= 0\n    and low < full\n  %}\n\n  {% set live =\n    configured\n    and states(normalized) not in bad\n    and is_number(states(normalized))\n  %}\n\n  {% set valid = configured and live %}\n\n  {% if configured %}\n    {% set inv.entities = inv.entities + [normalized] %}\n  {% endif %}\n\n  {% if valid %}✅{% else %}❌{% endif %} **PV{{ i }} limit**\n  {% if normalized not in bad %} — `{{ normalized }}`{% endif %}\n{% endfor %}\n{% set export_start =\n  states('input_number.hpvc_export_start_threshold') | float(999999)\n%}\n{% set target_export =\n  states('input_number.hpvc_export_stop_threshold') | float(999999)\n%}\n{% set import_restore =\n  states('input_number.hpvc_import_restore_threshold') | float(-1)\n%}\n{% set thresholds_valid =\n  export_start < target_export\n  and target_export < import_restore\n  and import_restore >= 0\n%}\n{% if thresholds_valid %}✅{% else %}❌{% endif %} **Power control settings**"
      grid_options:
        columns: 12
        rows: auto
    grid_options:
      columns: 12
      rows: auto
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: '### 🎛️ PV Master Control

        '
      grid_options:
        columns: 12
    - type: markdown
      text_only: true
      content: "<ha-alert title=\"Standalone module\" alert-type=\"info\">\n  Home PV Control works as PV-only export control.\n  HBC is optional and can be enabled when a valid HBC is detected.\n</ha-alert>\n"
      visibility:
      - condition: state
        entity: input_boolean.hpvc_onboarding_complete
        state: 'off'
      - condition: state
        entity: binary_sensor.hpvc_hbc_available
        state: 'off'
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: input_boolean.hpvc_onboarding_complete
        state: 'on'
      - condition: state
        entity: input_boolean.hpvc_enabled
        state: 'off'
      - condition: state
        entity: binary_sensor.hpvc_required_inputs_ready
        state: 'on'
      - condition: state
        entity: input_boolean.hpvc_auto_resume_pending
        state: 'off'
      card:
        type: markdown
        text_only: true
        content: <ha-alert title="HPVC manually disabled" alert-type="info"> All required inputs are ready, but HPVC is off because it was switched off manually. Press <b>Enable HPVC</b> to start Home PV Control. </ha-alert>
      grid_options:
        columns: 12
        rows: auto
    - type: tile
      entity: input_boolean.hpvc_enabled
      name: Enable HPVC
      icon: mdi:solar-power-variant
      hide_state: true
      vertical: false
      features_position: inline
      features:
      - type: toggle
    - type: conditional
      conditions:
      - condition: state
        entity: input_boolean.hpvc_enabled
        state: 'on'
      - condition: state
        entity: binary_sensor.hpvc_hbc_available
        state: 'on'
      card:
        type: tile
        entity: input_boolean.hpvc_control_hbc_strategy
        name: Enable HBC
        icon: mdi:battery-sync
        hide_state: true
        vertical: false
        features_position: inline
        features:
        - type: toggle
      grid_options:
        columns: 12
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.hpvc_hbc_available
        state: 'off'
      card:
        type: tile
        entity: input_boolean.hpvc_control_hbc_strategy
        name: HBC unavailable
        icon: mdi:battery-off-outline
        color: disabled
        hide_state: true
        tap_action:
          action: none
        icon_tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
      grid_options:
        columns: 12
        rows: auto
    - type: tile
      entity: input_boolean.hpvc_notifications
      name: Notifications
      icon: mdi:bell-outline
      hide_state: true
      vertical: false
      features_position: inline
      features:
      - type: toggle
    - type: conditional
      conditions:
      - entity: input_boolean.hpvc_report_ready
        state: 'off'
      - entity: input_boolean.hpvc_report_generating
        state: 'off'
      card:
        type: tile
        entity: input_button.hpvc_export_report
        name: Generate report
        icon: mdi:file-document-plus-outline
        color: blue
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.hpvc_export_report
        icon_tap_action:
          action: perform-action
          perform_action: input_button.press
          target:
            entity_id: input_button.hpvc_export_report
        hold_action:
          action: none
        icon_hold_action:
          action: none
        double_tap_action:
          action: none
        icon_double_tap_action:
          action: none
      grid_options:
        columns: 6
        rows: 1
    - type: conditional
      conditions:
      - entity: input_boolean.hpvc_report_generating
        state: 'on'
      card:
        type: tile
        entity: input_boolean.hpvc_report_generating
        name: Generating…
        icon: mdi:progress-clock
        color: orange
        hide_state: true
        tap_action:
          action: none
        icon_tap_action:
          action: none
        hold_action:
          action: none
        icon_hold_action:
          action: none
        double_tap_action:
          action: none
        icon_double_tap_action:
          action: none
      grid_options:
        columns: 6
        rows: 1
    - type: conditional
      conditions:
      - entity: input_boolean.hpvc_report_ready
        state: 'on'
      - entity: input_boolean.hpvc_report_generating
        state: 'off'
      card:
        type: tile
        entity: input_boolean.hpvc_report_ready
        name: View report
        icon: mdi:file-document-check-outline
        color: green
        hide_state: true
        tap_action:
          action: url
          url_path: /local/hpvc/support-report.html?v=140-mobile-fresh-report
        icon_tap_action:
          action: url
          url_path: /local/hpvc/support-report.html?v=140-mobile-fresh-report
        hold_action:
          action: none
        icon_hold_action:
          action: none
        double_tap_action:
          action: none
        icon_double_tap_action:
          action: none
      grid_options:
        columns: 6
        rows: 1
    - type: conditional
      conditions:
      - entity: script.hpvc_restore_defaults
        state: 'off'
      card:
        type: tile
        entity: script.hpvc_restore_defaults
        name: Restore defaults
        icon: mdi:backup-restore
        color: blue
        hide_state: true
        state_content: []
        features_position: inline
        tap_action:
          action: toggle
          confirmation:
            text: 'This will restore all recommended HPVC settings.

              Press OK and wait until complete.

              '
      grid_options:
        columns: 6
        rows: auto
    - type: conditional
      conditions:
      - entity: script.hpvc_restore_defaults
        state: 'on'
      card:
        type: tile
        entity: script.hpvc_restore_defaults
        name: Restoring…
        icon: mdi:progress-clock
        color: orange
        hide_state: true
        tap_action:
          action: none
        icon_tap_action:
          action: none
        hold_action:
          action: none
        icon_hold_action:
          action: none
        double_tap_action:
          action: none
        icon_double_tap_action:
          action: none
      grid_options:
        columns: 6
        rows: auto
    visibility:
    - condition: state
      entity: input_boolean.hpvc_onboarding_complete
      state: 'on'
  - type: grid
    columns: 1
    square: false
    visibility:
    - condition: state
      entity: input_boolean.hpvc_onboarding_complete
      state: 'on'
    cards:
    - type: grid
      columns: 1
      square: false
      visibility:
      - condition: state
        entity: input_boolean.hpvc_onboarding_complete
        state: 'on'
      cards:
      - type: markdown
        title: 💡 Decision Details
        content: "ℹ️ **Status**  \n{{ states('input_text.hpvc_status') }}\n\n\U0001F4AC **Reason**  \n{{ states('input_text.hpvc_reason') }}\n\n\U0001F552 **Status since**  \n{{ states('input_text.hpvc_last_action') }}\n"
  - type: grid
    cards:
    - type: entities
      title: 📡 Live Inputs
      entities:
      - entity: sensor.hpvc_diag_market_export_price
        name: Market/export price
      - entity: sensor.hpvc_diag_all_in_price
        name: All-in price
      - entity: sensor.hpvc_diag_grid_power
        name: Grid power
      - entity: sensor.hpvc_diag_pv_power
        name: Total solar power
      - entity: sensor.hpvc_pv1_actual_limit
        name: PV1 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 1
        row:
          entity: sensor.hpvc_pv2_actual_limit
          name: PV2 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 2
        row:
          entity: sensor.hpvc_pv3_actual_limit
          name: PV3 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 3
        row:
          entity: sensor.hpvc_pv4_actual_limit
          name: PV4 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 4
        row:
          entity: sensor.hpvc_pv5_actual_limit
          name: PV5 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 5
        row:
          entity: sensor.hpvc_pv6_actual_limit
          name: PV6 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 6
        row:
          entity: sensor.hpvc_pv7_actual_limit
          name: PV7 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 7
        row:
          entity: sensor.hpvc_pv8_actual_limit
          name: PV8 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 8
        row:
          entity: sensor.hpvc_pv9_actual_limit
          name: PV9 actual limit
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: input_number.hpvc_inverter_count
          above: 9
        row:
          entity: sensor.hpvc_pv10_actual_limit
          name: PV10 actual limit
      show_header_toggle: false
    visibility:
    - condition: state
      entity: input_boolean.hpvc_onboarding_complete
      state: 'on'
  - type: grid
    columns: 1
    square: false
    cards:
    - type: entities
      title: 📊 Control States
      show_header_toggle: false
      entities:
      - entity: binary_sensor.hpvc_pv_limited
        name: PV limited
      - entity: binary_sensor.hpvc_cooldown_active
        name: Cooldown
      - type: conditional
        conditions:
        - entity: input_boolean.hpvc_control_hbc_strategy
          state: 'on'
        row:
          entity: binary_sensor.hpvc_charge_priority_active
          name: Charge priority
      - entity: binary_sensor.hpvc_at_minimum_pv
        name: At minimum PV
      - entity: binary_sensor.hpvc_negative_price_mode
        name: Negative price
    - type: conditional
      conditions:
      - entity: input_boolean.hpvc_control_hbc_strategy
        state: 'off'
      card:
        type: history-graph
        hours_to_show: 6
        entities:
        - entity: binary_sensor.hpvc_pv_limited
          name: PV limited
        - entity: binary_sensor.hpvc_cooldown_active
          name: Cooldown
        - entity: binary_sensor.hpvc_at_minimum_pv
          name: At minimum PV
        - entity: binary_sensor.hpvc_negative_price_mode
          name: Negative price
    - type: conditional
      conditions:
      - entity: input_boolean.hpvc_control_hbc_strategy
        state: 'on'
      card:
        type: history-graph
        entities:
        - entity: binary_sensor.hpvc_pv_limited
          name: PV limited
        - entity: binary_sensor.hpvc_cooldown_active
          name: Cooldown
        - entity: binary_sensor.hpvc_charge_priority_active
          name: Charge priority
        - entity: binary_sensor.hpvc_at_minimum_pv
          name: At minimum PV
        - entity: binary_sensor.hpvc_negative_price_mode
          name: Negative price
        hours_to_show: 6
    visibility:
    - condition: state
      entity: input_boolean.hpvc_onboarding_complete
      state: 'on'
  - type: grid
    columns: 2
    square: false
    cards:
    - type: vertical-stack
      cards:
      - type: markdown
        content: "{% set raw = states('sensor.hpvc_daily_target_accuracy') %}\n{% set has_data = raw not in ['unknown', 'unavailable', 'none', ''] %}\n{% set value = raw if has_data else 'No data collected today' %}\n{% set unit = (state_attr('sensor.hpvc_daily_target_accuracy', 'unit_of_measurement') or '%') if has_data else '' %}\n\n<center>\n\n<span style=\"font-size:18px;\">\n  <ha-icon icon=\"mdi:bullseye-arrow\"></ha-icon>&nbsp;&nbsp;&nbsp;\n  <b>Daily Control Accuracy</b>\n</span>\n\n\n<h1><b>{{ value }}{{ unit }}</b></h1>\n{% set sample_raw = states('sensor.hpvc_daily_target_accuracy_samples') %} {% if sample_raw not in ['unknown', 'unavailable', 'none', ''] %} <div style=\"opacity:.72; margin-top:-8px;\">{{ sample_raw | int(0) }} eligible samples today</div> {% endif %}\n\n</center>\n"
      - type: markdown
        text_only: true
        content: '{% set raw = states(''sensor.hpvc_daily_target_accuracy'') %}

          {% set has_data = raw not in [''unknown'', ''unavailable'', ''none'', ''''] %}

          {% set value = raw | float(0) %}


          {% if not has_data %}

          <ha-alert title="No data collected today" alert-type="info">

          No eligible control-accuracy samples have been collected today.

          </ha-alert>

          {% elif value >= 90 %}

          <ha-alert title="Excellent" alert-type="success">

          Target control is performing very accurately today.

          </ha-alert>

          {% elif value >= 80 %}

          <ha-alert title="Great" alert-type="success">

          Target control is performing well today.

          </ha-alert>

          {% elif value >= 65 %}

          <ha-alert title="Good" alert-type="info">

          Target control is generally accurate, with some losses.

          </ha-alert>

          {% elif value >= 50 %}

          <ha-alert title="Fair" alert-type="warning">

          Target accuracy is lower than normal today.

          </ha-alert>

          {% else %}

          <ha-alert title="Needs attention" alert-type="error">

          Accuracy is low. Review the estimated factors below to see what affected performance today.

          </ha-alert>

          {% endif %}

          '
      - type: heading
        heading: Estimated accuracy-loss factors
      - type: grid
        columns: 2
        square: false
        cards:
        - type: tile
          entity: sensor.hpvc_target_control_response_impact
          name: Control response
          icon: mdi:sine-wave
        - type: tile
          entity: sensor.hpvc_target_house_load_changes_impact
