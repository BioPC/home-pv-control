                entity: input_boolean.hpvc_config
                state: "on"
            card:
              type: entities
              entities:
                - entity: input_number.hpvc_cooldown_seconds
                  name: Cooldown
                - entity: input_number.hpvc_pv_adjust_deadband
                  name: Deadband
