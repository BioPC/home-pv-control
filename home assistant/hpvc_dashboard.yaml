      title: 📋 Insights
      content: "<ha-alert alert-type=\"info\">\n  For complete current-day history, press <b>Generate report</b>\n  in <b>PV Master Control</b>.\n</ha-alert>\n<br>\n{% set entities = [\n  'input_text.hpvc_insight_1',\n  'input_text.hpvc_insight_2',\n  'input_text.hpvc_insight_3',\n  'input_text.hpvc_insight_4',\n  'input_text.hpvc_insight_5',\n  'input_text.hpvc_insight_6',\n  'input_text.hpvc_insight_7',\n  'input_text.hpvc_insight_8',\n  'input_text.hpvc_insight_9',\n  'input_text.hpvc_insight_10',\n  'input_text.hpvc_insight_11',\n  'input_text.hpvc_insight_12',\n  'input_text.hpvc_insight_13',\n  'input_text.hpvc_insight_14',\n  'input_text.hpvc_insight_15',\n  'input_text.hpvc_insight_16',\n  'input_text.hpvc_insight_17',\n  'input_text.hpvc_insight_18',\n  'input_text.hpvc_insight_19',\n  'input_text.hpvc_insight_20'\n] %} {% set ns = namespace(items=[]) %} {% for entity in entities %}\n  {% set value = states(entity) %}\n  {% if value not in ['unknown', 'unavailable', '', none] %}\n    {% set parts = value.split('|') %}\n    {% if parts | length >= 7 and parts[0] | trim == 'v2' %}\n      {% set severity_code = parts[3] | trim %}\n      {% set item = {\n        'time': parts[2] | trim,\n        'severity': 'critical' if severity_code == 'c' else ('warning' if severity_code == 'w' else 'info'),\n        'count': parts[4] | trim | int(1),\n        'node': parts[5] | trim,\n        'explanation': parts[6:] | join('|') | trim\n      } %}\n    {% elif parts | length >= 6 and parts[1] | trim in ['critical', 'warning', 'info'] %}\n      {% set item = {\n        'time': parts[0] | trim,\n        'severity': parts[1] | trim,\n        'count': parts[2] | trim | int(1),\n        'node': parts[4] | trim,\n        'explanation': parts[5:] | join('|') | trim\n      } %}\n    {% elif parts | length >= 4 %}\n      {% set explanation = parts[3:] | join('|') | trim %}\n      {% set lower = (parts[2] ~ ' ' ~ explanation) | lower %}\n      {% set critical =\n        'control paused' in lower or 'no inverter writes' in lower or\n        'invalid configuration' in lower or ('core ' in lower and ' unavailable' in lower) or\n        ('command' in lower and 'fail' in lower) or ('report' in lower and 'fail' in lower) or\n        'all battery telemetry' in lower or 'runtime unavailable' in lower %}\n      {% set warning = not critical and (\n        'warning' in lower or 'unavailable' in lower or 'stale' in lower or\n        'excluded' in lower or 'blocked' in lower or 'ineffective' in lower or\n        'not confirmed' in lower or 'fault' in lower) %}\n      {% set item = {\n        'time': parts[0] | trim,\n        'severity': 'critical' if critical else ('warning' if warning else 'info'),\n        'count': 1,\n        'node': parts[2] | trim,\n        'explanation': explanation\n      } %}\n    {% else %}\n      {% set item = none %}\n    {% endif %}\n    {% if item %}{% set ns.items = ns.items + [item] %}{% endif %}\n  {% endif %}\n{% endfor %}\n{% if ns.items | length == 0 %} <p><em>No Insights recorded yet today.</em></p> {% else %}\n  {# Node-RED publishes helpers 1..20 already normalized and newest-first. #}\n  {% for item in ns.items %}\n    {% set node = (item.node | lower) %}\n    {% set explanation = (item.explanation | lower) %}\n    {% set insight_text = node ~ ' ' ~ explanation %}\n    {# Dashboard-only colour policy: red is reserved for an actual fault,\n       failed action, safety pause, or control-blocking condition. #}\n    {% set red_fault =\n      ('hbc safety' in node and ('paused' in explanation or 'fault' in explanation or 'failed' in explanation)) or\n      ('sensor health' in node and ('control paused' in explanation or 'invalid' in explanation or 'unavailable' in explanation)) or\n      (('configuration' in node or node == 'inputs') and\n        ('control paused' in explanation or 'configuration error' in explanation or 'invalid' in explanation or 'unavailable' in explanation or 'no valid pv inverter' in explanation)) or\n      ('inverter group' in node and ('paused' in explanation or 'fault' in explanation or 'failed' in explanation or 'unavailable' in explanation)) or\n      ('write warning' in node and ('failed' in explanation or 'failure' in explanation or 'error' in explanation or 'could not' in explanation)) or\n      ('runtime warning' in node and ('error' in explanation or 'exception' in explanation or 'failed' in explanation or 'failure' in explanation)) or\n      ('support report' in node and ('failed' in explanation or 'failure' in explanation or 'error' in explanation)) %}\n    {% if 'battery' in node or 'charge priority' in node or 'taper' in node %}\n    {% set icon = '\U0001F7E3' %}\n    {% elif red_fault or item.severity == 'critical' %}\n    {% set icon = '\U0001F534' %}\n    {% elif 'pv' in node or 'inverter' in node or 'limit' in node or 'restore' in node %}\n    {% set icon = '\U0001F7E1' %}\n    {% elif 'price' in node %}\n    {% set icon = '\U0001F7E2' %}\n    {% else %}\n    {% set icon = '⚪' %}\n    {% endif %}\n<div style=\"padding:8px 0; border-bottom:1px solid rgba(128,128,128,.24); overflow:hidden;\">\n  <div style=\"display:flex; align-items:flex-start; gap:6px; min-width:0;\">\n    <span style=\"flex:0 0 auto;\">{{ icon }}</span>\n    <strong style=\"min-width:0; overflow-wrap:anywhere; word-break:break-word; white-space:normal;\">{{ item.time }} · {{ item.node }}{% if item.count > 1 %} · ×{{ item.count }}{% endif %}</strong>\n  </div>\n  <div style=\"margin-top:5px; overflow-wrap:anywhere; word-break:break-word; white-space:normal; line-height:1.45;\">{{ item.explanation }}</div>\n</div>\n  {% endfor %}\n{% endif %}"
