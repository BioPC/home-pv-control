                    float(0.35) | round(3) }}/kWh |

                    | 🔴 **Expensive** ({{
                    states('input_select.hpvc_expensive_strategy') }}) | ≥ €{{
                    states('input_number.hpvc_battery_expensive_price') |
                    float(0.35) | round(3) }}/kWh |
