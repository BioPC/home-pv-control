title: Home PV Control
views:
  - type: sections
    title: Main
    path: home-pv-control
    icon: mdi:solar-power
    max_columns: 3
    header:
      layout: center
      badges_position: top
      badges_wrap: wrap
      card:
        type: markdown
        text_only: true
        content: >-
          ## Home PV Control (v1.3.0)

          #### Standalone PV optimization for dynamic energy contracts. Optional
          HBC integration.
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_text.hpvc_status
        name: Status
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hpvc_diag_hbc_strategy
        name: HBC strategy
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
          - condition: state
            entity: input_boolean.hpvc_control_hbc_strategy
            state: "on"
          - condition: state
            entity: sensor.hpvc_diag_hbc_strategy
            state_not:
              - unknown
              - unavailable
              - ""
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_number.hpvc_inverter_count
        name: Inverters
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_number.house_battery_count
        name: Batteries
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
          - condition: state
            entity: input_boolean.hpvc_control_hbc_strategy
            state: "on"
    sections:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.hpvc_onboarding_complete
                state: "off"
            card:
              type: markdown
              content: >-
                {% set bad = ['unknown', 'unavailable', 'none',
                'select_entity_first', ''] %}

                {% set core = [
                  ('Grid sensor', states('input_text.hpvc_grid_power_sensor')),
                  ('Market/export price', states('input_text.hpvc_market_price_sensor')),
                  ('All-in price', states('input_text.hpvc_all_in_price_sensor')),
                  ('Solar power', states('input_text.hpvc_pv_power_sensor'))
                ] %}

                {% set ns = namespace(done=0, total=4) %}

                <ha-alert title="Welcome to Home PV Control"
                alert-type="warning">

                Open the <b>Settings</b> tab using the <b>⚙️ Settings</b> button
                in the navigation bar and complete the required configuration.
                Once setup is complete, return to the <b>Main</b> tab and press
                <b>Enable HPVC</b> to start Home PV Control.

                </ha-alert>

                <p><b>Setup progress:</b></p>

                {% for label, ent in core %}

                {% set valid = ent not in bad and '.' in ent and states(ent) not
                in bad %}

                {% if valid %}{% set ns.done = ns.done + 1 %}✅{% else %}❌{%
                endif %} **{{ label }}**

                {% endfor %}

                {% set count = states('input_number.hpvc_inverter_count') |
                int(0) %}

                {% set inv = namespace(valid=count > 0) %}

                {% for i in range(1, count + 1) %}
                  {% set ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') %}
                  {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit') | float(0) %}
                  {% set low = states('input_number.hpvc_pv' ~ i ~ '_low_limit') | float(-1) %}
                  {% if ent in bad or '.' not in ent or states(ent) in bad or full <= 0 or low < 0 or low >= full %}{% set inv.valid = false %}{% endif %}
                {% endfor %}

                {% set ns.total = ns.total + 1 %}

                {% if inv.valid %}{% set ns.done = ns.done + 1 %}✅{% else %}❌{%
                endif %} **Inverter setup**

                <p><b>{{ ns.done }}/{{ ns.total }} complete</b></p>
            grid_options:
              columns: 12
              rows: auto
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "off"
      - type: grid
        columns: 2
        square: false
        cards:
          - type: markdown
            content: |
              ### 🎛️ PV Master Control
            grid_options:
              columns: 12
          - type: markdown
            text_only: true
            content: >
              <ha-alert title="Standalone module" alert-type="info"> Home PV
              Control works as PV-only export control. HBC is optional and can
              be enabled when a valid HBC is detected. </ha-alert>
            grid_options:
              columns: 12
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.hpvc_onboarding_complete
                state: "on"
              - condition: state
                entity: input_boolean.hpvc_config
                state: "off"
              - condition: state
                entity: input_boolean.hpvc_enabled
                state: "off"
            card:
              type: markdown
              text_only: true
              content: >-
                <ha-alert title="Setup complete" alert-type="success"> Press
                <b>Enable HPVC</b> in <b>PV Master Control</b> to start Home PV
                Control. Press <b>Settings</b> whenever you need to change the
                configuration. </ha-alert>
            grid_options:
              columns: 12
              rows: auto
          - type: tile
            entity: input_boolean.hpvc_enabled
            name: Enable HPVC
            icon: mdi:solar-power
            hide_state: true
          - type: tile
            entity: input_boolean.hpvc_notifications
            name: Notifications
            icon: mdi:bell-outline
            hide_state: true
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.hpvc_enabled
                state: "on"
              - condition: state
                entity: binary_sensor.hpvc_hbc_available
                state: "on"
            card:
              type: tile
              entity: input_boolean.hpvc_control_hbc_strategy
              name: Enable HBC
              icon: mdi:battery-sync
              hide_state: true
            grid_options:
              columns: 6
              rows: auto
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.hpvc_hbc_available
                state: "off"
            card:
              type: tile
              entity: input_boolean.hpvc_control_hbc_strategy
              name: HBC unavailable
              icon: mdi:battery-off-outline
              color: disabled
              hide_state: true
              tap_action:
                action: none
              icon_tap_action:
                action: none
              hold_action:
                action: none
              double_tap_action:
                action: none
            grid_options:
              columns: 6
              rows: auto
          - type: tile
            entity: input_boolean.hpvc_config
            name: Settings
            icon: mdi:cog
            hide_state: true
          - type: conditional
            conditions:
              - entity: input_boolean.hpvc_report_ready
                state: "off"
              - entity: input_boolean.hpvc_report_generating
                state: "off"
            card:
              type: tile
              entity: input_button.hpvc_export_report
              name: Generate report
              icon: mdi:file-document-plus-outline
              color: blue
              hide_state: true
              tap_action:
                action: perform-action
                perform_action: input_button.press
                target:
                  entity_id: input_button.hpvc_export_report
              icon_tap_action:
                action: perform-action
                perform_action: input_button.press
                target:
                  entity_id: input_button.hpvc_export_report
              hold_action:
                action: none
              icon_hold_action:
                action: none
              double_tap_action:
                action: none
              icon_double_tap_action:
                action: none
            grid_options:
              columns: 6
              rows: 1
          - type: conditional
            conditions:
              - entity: input_boolean.hpvc_report_generating
                state: "on"
            card:
              type: tile
              entity: input_boolean.hpvc_report_generating
              name: Generating…
              icon: mdi:progress-clock
              color: orange
              hide_state: true
              tap_action:
                action: none
              icon_tap_action:
                action: none
              hold_action:
                action: none
              icon_hold_action:
                action: none
              double_tap_action:
                action: none
              icon_double_tap_action:
                action: none
            grid_options:
              columns: 6
              rows: 1
          - type: conditional
            conditions:
              - entity: input_boolean.hpvc_report_ready
                state: "on"
              - entity: input_boolean.hpvc_report_generating
                state: "off"
            card:
              type: tile
              entity: input_boolean.hpvc_report_ready
              name: View report
              icon: mdi:file-document-check-outline
              color: green
              hide_state: true
              tap_action:
                action: url
                url_path: /local/hpvc/support-report.html?v=130-on-demand-auto-reset
              icon_tap_action:
                action: url
                url_path: /local/hpvc/support-report.html?v=130-on-demand-auto-reset
              hold_action:
                action: none
              icon_hold_action:
                action: none
              double_tap_action:
                action: none
              icon_double_tap_action:
                action: none
            grid_options:
              columns: 6
              rows: 1
          - type: conditional
            conditions:
              - entity: script.hpvc_restore_defaults
                state: "off"
            card:
              type: tile
              entity: script.hpvc_restore_defaults
              name: Restore defaults
              icon: mdi:backup-restore
              color: blue
              hide_state: true
              state_content: []
              features_position: inline
              tap_action:
                action: toggle
                confirmation:
                  text: |
                    This will restore all recommended HPVC settings.
                    Press OK and wait until complete.
            grid_options:
              columns: 6
              rows: auto
          - type: conditional
            conditions:
              - entity: script.hpvc_restore_defaults
                state: "on"
            card:
              type: tile
              entity: script.hpvc_restore_defaults
              name: Restoring…
              icon: mdi:progress-clock
              color: orange
              hide_state: true
              tap_action:
                action: none
              icon_tap_action:
                action: none
              hold_action:
                action: none
              icon_hold_action:
                action: none
              double_tap_action:
                action: none
              icon_double_tap_action:
                action: none
            grid_options:
              columns: 6
              rows: auto
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
      - type: grid
        cards:
          - type: entities
            title: 💡 Decision Details
            entities:
              - entity: input_text.hpvc_status
                name: Status
              - entity: input_text.hpvc_reason
                name: Reason
              - entity: input_text.hpvc_last_action
                name: Last action
              - entity: sensor.hpvc_last_calculation
                name: Last calculation
            show_header_toggle: false
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
      - type: grid
        cards:
          - type: entities
            title: 📡 Live Inputs
            entities:
              - entity: sensor.hpvc_diag_market_export_price
                name: Market/export price
              - entity: sensor.hpvc_diag_all_in_price
                name: All-in price
              - entity: sensor.hpvc_diag_grid_power
                name: Grid power
              - entity: sensor.hpvc_diag_pv_power
                name: Total solar power
              - entity: sensor.hpvc_pv1_actual_limit
                name: PV1 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 1
                row:
                  entity: sensor.hpvc_pv2_actual_limit
                  name: PV2 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 2
                row:
                  entity: sensor.hpvc_pv3_actual_limit
                  name: PV3 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 3
                row:
                  entity: sensor.hpvc_pv4_actual_limit
                  name: PV4 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 4
                row:
                  entity: sensor.hpvc_pv5_actual_limit
                  name: PV5 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 5
                row:
                  entity: sensor.hpvc_pv6_actual_limit
                  name: PV6 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 6
                row:
                  entity: sensor.hpvc_pv7_actual_limit
                  name: PV7 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 7
                row:
                  entity: sensor.hpvc_pv8_actual_limit
                  name: PV8 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 8
                row:
                  entity: sensor.hpvc_pv9_actual_limit
                  name: PV9 actual limit
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: input_number.hpvc_inverter_count
                    above: 9
                row:
                  entity: sensor.hpvc_pv10_actual_limit
                  name: PV10 actual limit
            show_header_toggle: false
          - type: conditional
            conditions:
              - entity: input_boolean.hpvc_enabled
                state: "on"
              - entity: input_boolean.hpvc_control_hbc_strategy
                state: "on"
              - condition: state
                entity: sensor.hpvc_diag_hbc_strategy
                state_not:
                  - unknown
                  - unavailable
                  - ""
            card:
              type: entities
              title: 🔋 HBC Live Status
              entities:
                - entity: sensor.hpvc_diag_hbc_strategy
                  name: HBC strategy
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 0
                  row:
                    entity: sensor.marstek_m1_battery_state_of_charge
                    name: Battery M1 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 0
                  row:
                    entity: sensor.marstek_m1_ac_power
                    name: Battery M1 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 1
                  row:
                    entity: sensor.marstek_m2_battery_state_of_charge
                    name: Battery M2 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 1
                  row:
                    entity: sensor.marstek_m2_ac_power
                    name: Battery M2 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 2
                  row:
                    entity: sensor.marstek_m3_battery_state_of_charge
                    name: Battery M3 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 2
                  row:
                    entity: sensor.marstek_m3_ac_power
                    name: Battery M3 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 3
                  row:
                    entity: sensor.marstek_m4_battery_state_of_charge
                    name: Battery M4 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 3
                  row:
                    entity: sensor.marstek_m4_ac_power
                    name: Battery M4 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 4
                  row:
                    entity: sensor.marstek_m5_battery_state_of_charge
                    name: Battery M5 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 4
                  row:
                    entity: sensor.marstek_m5_ac_power
                    name: Battery M5 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 5
                  row:
                    entity: sensor.marstek_m6_battery_state_of_charge
                    name: Battery M6 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 5
                  row:
                    entity: sensor.marstek_m6_ac_power
                    name: Battery M6 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 6
                  row:
                    entity: sensor.marstek_m7_battery_state_of_charge
                    name: Battery M7 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 6
                  row:
                    entity: sensor.marstek_m7_ac_power
                    name: Battery M7 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 7
                  row:
                    entity: sensor.marstek_m8_battery_state_of_charge
                    name: Battery M8 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 7
                  row:
                    entity: sensor.marstek_m8_ac_power
                    name: Battery M8 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 8
                  row:
                    entity: sensor.marstek_m9_battery_state_of_charge
                    name: Battery M9 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 8
                  row:
                    entity: sensor.marstek_m9_ac_power
                    name: Battery M9 power
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 9
                  row:
                    entity: sensor.marstek_m10_battery_state_of_charge
                    name: Battery M10 SOC
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: input_number.house_battery_count
                      above: 9
                  row:
                    entity: sensor.marstek_m10_ac_power
                    name: Battery M10 power
              show_header_toggle: false
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: entities
                title: 📊 Control states
                show_header_toggle: false
                entities:
                  - entity: binary_sensor.hpvc_pv_limited
                    name: PV limited
                  - type: conditional
                    conditions:
                      - entity: input_boolean.hpvc_control_hbc_strategy
                        state: "on"
                    row:
                      entity: binary_sensor.hpvc_pv_reveal_active
                      name: PV revealed
                  - entity: binary_sensor.hpvc_cooldown_active
                    name: Cooldown
                  - entity: binary_sensor.hpvc_at_minimum_pv
                    name: At minimum PV
                  - entity: binary_sensor.hpvc_negative_price_mode
                    name: Negative price
              - type: conditional
                conditions:
                  - entity: input_boolean.hpvc_control_hbc_strategy
                    state: "on"
                card:
                  type: history-graph
                  hours_to_show: 6
                  entities:
                    - entity: binary_sensor.hpvc_pv_limited
                      name: PV limited
                    - entity: binary_sensor.hpvc_pv_reveal_active
                      name: PV revealed
                    - entity: binary_sensor.hpvc_cooldown_active
                      name: Cooldown
                    - entity: binary_sensor.hpvc_at_minimum_pv
                      name: At minimum PV
                    - entity: binary_sensor.hpvc_negative_price_mode
                      name: Negative price
              - type: conditional
                conditions:
                  - entity: input_boolean.hpvc_control_hbc_strategy
                    state: "off"
                card:
                  type: history-graph
                  hours_to_show: 6
                  entities:
                    - entity: binary_sensor.hpvc_pv_limited
                      name: PV limited
                    - entity: binary_sensor.hpvc_cooldown_active
                      name: Cooldown
                    - entity: binary_sensor.hpvc_at_minimum_pv
                      name: At minimum PV
                    - entity: binary_sensor.hpvc_negative_price_mode
                      name: Negative price
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
      - type: grid
        columns: 2
        square: false
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  {% set raw = states('sensor.hpvc_daily_target_accuracy') %}

                  {% set has_data = raw not in ['unknown', 'unavailable',
                  'none', ''] %}

                  {% set value = raw if has_data else 'No data collected today'
                  %}

                  {% set unit = (state_attr('sensor.hpvc_daily_target_accuracy',
                  'unit_of_measurement') or '%') if has_data else '' %}


                  <center>


                  <span style="font-size:18px;">
                    <ha-icon icon="mdi:bullseye-arrow"></ha-icon>&nbsp;&nbsp;&nbsp;
                    <b>Daily Target Accuracy</b>
                  </span>



                  <h1><b>{{ value }}{{ unit }}</b></h1>


                  </center>
              - type: markdown
                text_only: true
                content: >
                  {% set raw = states('sensor.hpvc_daily_target_accuracy') %}

                  {% set has_data = raw not in ['unknown', 'unavailable',
                  'none', ''] %}

                  {% set value = raw | float(0) %}


                  {% if not has_data %}

                  <ha-alert title="No data collected today" alert-type="info">

                  No valid Target Accuracy samples have been collected today.

                  </ha-alert>

                  {% elif value >= 90 %}

                  <ha-alert title="Excellent" alert-type="success">

                  Target control is performing very accurately today.

                  </ha-alert>

                  {% elif value >= 80 %}

                  <ha-alert title="Great" alert-type="success">

                  Target control is performing well today.

                  </ha-alert>

                  {% elif value >= 65 %}

                  <ha-alert title="Good" alert-type="info">

                  Target control is generally accurate, with some losses.

                  </ha-alert>

                  {% elif value >= 50 %}

                  <ha-alert title="Fair" alert-type="warning">

                  Target accuracy is lower than normal today.

                  </ha-alert>

                  {% else %}

                  <ha-alert title="Needs attention" alert-type="error">

                  Accuracy is low. Review the estimated factors below to see
                  what affected performance today.

                  </ha-alert>

                  {% endif %}
              - type: heading
                heading: Estimated accuracy-loss factors
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: sensor.hpvc_target_control_response_impact
                    name: Control response
                    icon: mdi:sine-wave
                  - type: tile
                    entity: sensor.hpvc_target_house_load_changes_impact
                    name: House load changes
                    icon: mdi:home-lightning-bolt-outline
                  - type: tile
                    entity: sensor.hpvc_target_pv_availability_impact
                    name: PV availability
                    icon: mdi:solar-power-variant-outline
                  - type: tile
                    entity: sensor.hpvc_target_other_impact
                    name: Other
                    icon: mdi:dots-horizontal-circle-outline
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: "on"
      - type: grid
        cards:
          - type: conditional
            conditions:
              - entity: input_boolean.hpvc_control_hbc_strategy
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: >
                    {% set raw = states('sensor.hpvc_daily_reveal_accuracy') %}

                    {% set has_data = raw not in ['unknown', 'unavailable',
                    'none', ''] %}

                    {% set value = raw if has_data else 'No data collected
                    today' %}

                    {% set unit =
                    (state_attr('sensor.hpvc_daily_reveal_accuracy',
                    'unit_of_measurement') or '%') if has_data else '' %}


                    <center>


                    <span style="font-size:18px;">
                      <ha-icon icon="mdi:bullseye-arrow"></ha-icon>&nbsp;&nbsp;&nbsp;
                      <b>Daily Reveal Accuracy</b>
                    </span>


                    <h1><b>{{ value }}{{ unit }}</b></h1>


                    </center>
                - type: markdown
                  text_only: true
                  content: >
                    {% set raw = states('sensor.hpvc_daily_reveal_accuracy') %}

                    {% set has_data = raw not in ['unknown', 'unavailable',
                    'none', ''] %}

                    {% set value = raw | float(0) %}


                    {% if not has_data %}

                    <ha-alert title="No data collected today" alert-type="info">

                    No valid Reveal Accuracy samples have been collected today.

                    </ha-alert>

