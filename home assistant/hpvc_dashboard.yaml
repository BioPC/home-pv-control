                market/export price. HBC Charge takes priority while batteries
                still have useful charge headroom.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.hpvc_config
                state: "on"
              - entity: input_boolean.hpvc_enabled
                state: "on"
