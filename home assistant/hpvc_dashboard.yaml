                entity: sensor.hpvc_diag_hbc_strategy
                state_not:
                  - unknown
                  - unavailable
                  - ""
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: >-
                    {% set prices = state_attr('sensor.hbc_energy_prices_data',
                    'prices') %} {% set marks =
                    state_attr('sensor.hbc_energy_prices_data', 'marks') %} {%
                    set today_prices =
                    state_attr('sensor.hbc_energy_prices_data', 'today') %} {%
                    set tomorrow_prices =
                    state_attr('sensor.hbc_energy_prices_data', 'tomorrow') %}
                    {% set forecast =
                    state_attr('sensor.hbc_energy_prices_data', 'forecast') %}
                    {% set start = state_attr('sensor.hbc_energy_prices_data',
                    'start') %} {% set pph =
                    state_attr('sensor.hbc_energy_prices_data',
                    'datapoints_per_hour') | float(0) %} {% set fallback_seconds
                    = 3600 / pph if pph > 0 else 900 %} {% set market_entity =
                    states('input_text.hpvc_market_price_sensor') %} {% set
                    all_in_entity =
                    states('input_text.hpvc_all_in_price_sensor') %} {% set
                    market = states(market_entity) | float(none) %} {% set
                    all_in = states(all_in_entity) | float(none) %} {% set model
                    = states('input_text.hpvc_hbc_price_model_json') |
                    from_json(default={}) %} {% set model_market_entity =
                    states('input_text.hpvc_hbc_price_model_market_entity') %}
                    {% set model_all_in_entity =
                    states('input_text.hpvc_hbc_price_model_all_in_entity') %}
                    {% set model_slope = model.get('a', none) | float(none) %}
                    {% set model_intercept = model.get('b', none) | float(none)
                    %} {% set model_ready =
                      model.get('r', false)
                      and model_market_entity == market_entity
                      and model_all_in_entity == all_in_entity
                      and model_slope is not none
                      and model_intercept is not none
                    %} {% set now_ts = as_timestamp(now()) %} {% set ns =
                    namespace(current=none, points=[]) %}

                    {% macro point_time(item) -%}
                      {{ item.start | default(item.time, true) | default(item.from, true) | default(item.start_time, true) | default(item.datetime, true) }}
                    {%- endmacro %} {% macro point_end(item) -%}
                      {{ item.end | default(item.to, true) | default(item.end_time, true) }}
                    {%- endmacro %} {% macro point_price(item) -%}
                      {%- if item.price is defined and item.price is not none -%}
                        {{ item.price }}
                      {%- elif item.value is defined and item.value is not none -%}
                        {{ item.value }}
                      {%- elif item.total is defined and item.total is not none -%}
                        {{ item.total }}
                      {%- elif item.per_kwh is defined and item.per_kwh is not none -%}
                        {{ item.per_kwh }}
                      {%- elif item.electricity_price is defined and item.electricity_price is not none -%}
                        {{ item.electricity_price }}
                      {%- endif -%}
                    {%- endmacro %}

                    {% set mark_list = marks if marks is sequence and marks is
                    not string else [] %} {% for item in mark_list if item is
                    mapping %}
                      {% set st = as_timestamp(point_time(item), none) %}
                      {% set en = as_timestamp(point_end(item), none) %}
                      {% set pr = point_price(item) | float(none) %}
                      {% if st is not none and pr is not none %}
                        {% set ns.points = ns.points + [dict(start=st, explicit_end=en, price=pr)] %}
                      {% endif %}
                    {% endfor %} {% set ordered = ns.points |
                    sort(attribute='start') %} {% for item in ordered if
                    ns.current is none %}
                      {% set next_item = ordered[loop.index0 + 1] if loop.index0 + 1 < ordered | count else none %}
                      {% set next_start = next_item.start if next_item is not none else none %}
                      {% set end_ts = item.explicit_end if item.explicit_end is not none and item.explicit_end > item.start else (next_start if next_start is not none and next_start > item.start else item.start + fallback_seconds) %}
                      {% if now_ts >= item.start and now_ts < end_ts %}
                        {% set ns.current = item.price %}
                      {% endif %}
                    {% endfor %}

                    {% if ns.current is none and prices is sequence and prices
                    is not string and start %}
                      {% set prices_start_ts = as_timestamp(start, none) %}
                      {% if prices_start_ts is not none and now_ts >= prices_start_ts %}
                        {% set index = ((now_ts - prices_start_ts) / fallback_seconds) | int %}
                        {% if index >= 0 and index < prices | count %}
                          {% set point = prices[index] %}
                          {% set ns.current = (point_price(point) if point is mapping else point) | float(none) %}
                        {% endif %}
                      {% endif %}
                    {% endif %}

                    {% if ns.current is none %}
                      {% set today_list = today_prices if today_prices is sequence and today_prices is not string else [] %}
                      {% set tomorrow_list = tomorrow_prices if tomorrow_prices is sequence and tomorrow_prices is not string else [] %}
                      {% set forecast_list = forecast if forecast is sequence and forecast is not string else [] %}
                      {% set ns.points = [] %}
                      {% for item in today_list + tomorrow_list + forecast_list if item is mapping %}
                        {% set st = as_timestamp(point_time(item), none) %}
                        {% set en = as_timestamp(point_end(item), none) %}
                        {% set pr = point_price(item) | float(none) %}
                        {% if st is not none and pr is not none %}
                          {% set ns.points = ns.points + [dict(start=st, explicit_end=en, price=pr)] %}
                        {% endif %}
                      {% endfor %}
                      {% set ordered = ns.points | sort(attribute='start') %}
                      {% for item in ordered if ns.current is none %}
                        {% set next_item = ordered[loop.index0 + 1] if loop.index0 + 1 < ordered | count else none %}
                        {% set next_start = next_item.start if next_item is not none else none %}
                        {% set end_ts = item.explicit_end if item.explicit_end is not none and item.explicit_end > item.start else (next_start if next_start is not none and next_start > item.start else item.start + fallback_seconds) %}
                        {% if now_ts >= item.start and now_ts < end_ts %}
                          {% set ns.current = item.price %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}

                    {% set hbc_raw = ns.current | float(none) %} {% set
                    hbc_price = (hbc_raw / 100 if hbc_raw | abs > 5 else
                    hbc_raw) if hbc_raw is not none else none %} {% set
                    price_type = 'Price type uncertain' %} {% if hbc_price is
                    not none and market is not none and all_in is not none and
                    all_in >= market %}
                      {% set md = (hbc_price - market) | abs %}
                      {% set ad = (hbc_price - all_in) | abs %}
                      {% if (md - ad) | abs < 0.01 %}
                        {% set price_type = 'Price type uncertain' %}
                      {% elif md < ad %}
                        {% if model_ready %}
                          {% set price_type = 'Market → all-in · learned' %}
                        {% else %}
                          {% set price_type = 'Market → all-in · +€' ~ ((all_in - market) | round(3)) %}
                        {% endif %}
                      {% else %}
                        {% set price_type = 'All-in prices' %}
                      {% endif %}
                    {% endif %}

                    <b>💰 HBC Price Zones</b> · {{ price_type }}
                - type: custom:apexcharts-card
                  header:
                    show: false
                    show_states: false
                  graph_span: 48h
                  update_interval: 1min
                  span:
                    start: day
                  apex_config:
                    annotations:
                      xaxis:
                        - x: EVAL:new Date().getTime()
                          borderColor: "#009ac7"
                          strokeDashArray: 0
                          label:
                            text: Now
                            orientation: horizontal
                            offsetY: -12
                            style:
                              background: "#009ac7"
                              color: "#ffffff"
                    plotOptions:
                      bar:
                        borderRadius: 2
                        columnWidth: 90%
                    legend:
                      show: false
                    xaxis:
                      type: datetime
                      labels:
                        datetimeUTC: false
                        format: HH:mm
                        rotate: -45
                        rotateAlways: true
                    yaxis:
                      decimalsInFloat: 3
                      title:
                        text: €/kWh
                    tooltip:
                      custom: >
                        EVAL:function({ series, seriesIndex, dataPointIndex, w
                        }) {
                          const point =
                            w.config.series?.[seriesIndex]?.data?.[dataPointIndex] || {};
                          const timestamp =
                            w.globals.seriesX?.[seriesIndex]?.[dataPointIndex];
                          const value = series?.[seriesIndex]?.[dataPointIndex];
                          const markerColor = point.fillColor ||
                            w.globals.colors?.[seriesIndex] || '#ff9800';
                          const date = new Date(timestamp);
                          const dateText = Number.isFinite(date.getTime())
                            ? date.toLocaleString(undefined, {
                                weekday: 'short',
                                day: '2-digit',
                                month: 'short',
                                hour: '2-digit',
                                minute: '2-digit',
                                hour12: false
                              })
                            : '';
                          const valueText = Number.isFinite(Number(value))
                            ? Number(value).toFixed(3) + ' €/kWh'
                            : '—';

                          return `
                            <div class="apexcharts-tooltip-title">${dateText}</div>
                            <div class="apexcharts-tooltip-series-group apexcharts-active"
                                 style="display:flex;">
                              <span class="apexcharts-tooltip-marker"
                                    style="background:${markerColor};width:12px;height:12px;border-radius:50%;display:inline-block;"></span>
                              <div class="apexcharts-tooltip-text">
                                <div class="apexcharts-tooltip-y-group">
                                  <span class="apexcharts-tooltip-text-y-label">Price: </span>
                                  <span class="apexcharts-tooltip-text-y-value">${valueText}</span>
                                </div>
                              </div>
                            </div>`;
                        }
                  series:
                    - entity: sensor.hbc_energy_prices_data
                      name: Price
                      type: column
                      float_precision: 3
                      show:
                        legend_value: false
                      data_generator: >
                        const attrs = entity.attributes || {};

                        const charge = parseFloat(
                          hass.states['input_number.hpvc_battery_charge_price']?.state
                        );

                        const expensive = parseFloat(
                          hass.states['input_number.hpvc_battery_expensive_price']?.state
                        );

                        const chargePrice = Number.isFinite(charge) ? charge :
                        0.10;

                        const expensivePrice = Number.isFinite(expensive)
                          ? expensive : 0.35;

                        const now = Date.now();

                        const today = new Date();

                        today.setHours(0, 0, 0, 0);

                        const tomorrow = new Date(today);

                        tomorrow.setDate(tomorrow.getDate() + 1);


                        const valueOf = item => {
                          if (typeof item === 'number') return item;
                          if (!item || typeof item !== 'object') return Number(item);
                          return Number(
                            item.price ?? item.value ?? item.total ??
                            item.per_kwh ?? item.electricity_price
                          );
                        };


                        const timeOf = item =>
                          item?.start ?? item?.time ?? item?.from ??
                          item?.start_time ?? item?.datetime;

                        const explicitEndOf = item =>
                          item?.end ?? item?.to ?? item?.end_time;

                        const pph = Number(attrs.datapoints_per_hour);

                        const fallbackIntervalMs = Number.isFinite(pph) && pph >
                        0
                          ? 60 * 60 * 1000 / pph
                          : 15 * 60 * 1000;

                        const normalizePrice = value => {
                          const raw = Number(value);
                          if (!Number.isFinite(raw)) return NaN;
                          return Math.abs(raw) > 5 ? raw / 100 : raw;
                        };


                        const normalizeTimestamped = source => {
                          const sorted = source
                            .filter(item => item && timeOf(item) != null)
                            .map(item => ({
                              start: Date.parse(timeOf(item)),
                              explicitEnd: Date.parse(explicitEndOf(item)),
                              price: valueOf(item),
                              is_now: Boolean(item.is_now)
                            }))
                            .filter(item =>
                              Number.isFinite(item.start) &&
                              Number.isFinite(Number(item.price))
                            )
                            .sort((a, b) => a.start - b.start);

                          return sorted.map((item, index) => {
                            const nextStart = sorted[index + 1]?.start;
                            const end = Number.isFinite(item.explicitEnd) &&
                              item.explicitEnd > item.start
                              ? item.explicitEnd
                              : (Number.isFinite(nextStart) && nextStart > item.start
                                ? nextStart
                                : item.start + fallbackIntervalMs);
                            return { ...item, end };
                          });
                        };


                        const markIntervals = Array.isArray(attrs.marks)
                          ? normalizeTimestamped(attrs.marks)
                          : [];

                        let priceIntervals = [];

                        if (Array.isArray(attrs.prices) && attrs.prices.length)
                        {
                          const start = Date.parse(attrs.start);
                          if (Number.isFinite(start)) {
                            priceIntervals = attrs.prices
                              .map((value, index) => ({
                                start: start + index * fallbackIntervalMs,
                                end: start + (index + 1) * fallbackIntervalMs,
                                price: valueOf(value),
                                is_now: false
                              }))
                              .filter(iv => Number.isFinite(Number(iv.price)));
                          }
                        }


                        const combined = [
                          ...(Array.isArray(attrs.today) ? attrs.today : []),
                          ...(Array.isArray(attrs.tomorrow) ? attrs.tomorrow : []),
                          ...(Array.isArray(attrs.forecast) ? attrs.forecast : [])
                        ];

                        const combinedIntervals =
                        normalizeTimestamped(combined);


                        const candidates = [
                          markIntervals,
                          priceIntervals,
                          combinedIntervals
                        ].filter(list => list.length > 0);


                        const containsNow = list => list.some(iv =>
                          now >= iv.start && now < iv.end
                        );

                        const intervals = candidates.find(containsNow) ??
                          candidates[0] ?? [];

                        const marketEntity =
                          hass.states['input_text.hpvc_market_price_sensor']?.state;
                        const allInEntity =
                          hass.states['input_text.hpvc_all_in_price_sensor']?.state;
                        const marketNow =
                        parseFloat(hass.states[marketEntity]?.state);

                        const allInNow =
                        parseFloat(hass.states[allInEntity]?.state);


                        let learnedModel = {};

                        try {
                          learnedModel = JSON.parse(
                            hass.states['input_text.hpvc_hbc_price_model_json']?.state || '{}'
                          );
                        } catch (error) {
                          learnedModel = {};
                        }


                        const modelMarketEntity =
                          hass.states['input_text.hpvc_hbc_price_model_market_entity']?.state || '';
                        const modelAllInEntity =
                          hass.states['input_text.hpvc_hbc_price_model_all_in_entity']?.state || '';
                        const modelEntitiesMatch =
                          modelMarketEntity === marketEntity &&
                          modelAllInEntity === allInEntity;
                        const modelSlope = Number(learnedModel.a);

                        const modelIntercept = Number(learnedModel.b);

                        const learnedFormulaValid = learnedModel.r === true &&
                          modelEntitiesMatch &&
                          Number.isFinite(modelSlope) &&
                          Number.isFinite(modelIntercept);

                        const currentInterval = intervals.find(iv =>
                          now >= iv.start && now < iv.end
                        );

                        const hbcCurrent = currentInterval
                          ? normalizePrice(currentInterval.price)
                          : NaN;

                        let priceType = 'uncertain';

                        let conversion = 0;

                        if (Number.isFinite(hbcCurrent) &&
                        Number.isFinite(marketNow) &&
                            Number.isFinite(allInNow) && allInNow >= marketNow) {
                          const marketDiff = Math.abs(hbcCurrent - marketNow);
                          const allInDiff = Math.abs(hbcCurrent - allInNow);
                          if (Math.abs(marketDiff - allInDiff) >= 0.01) {
                            if (marketDiff < allInDiff) {
                              priceType = 'market';
                              conversion = allInNow - marketNow;
                            } else {
                              priceType = 'all_in';
                            }
                          }
                        }


                        const colorForPrice = (price, isNow) => {
                          if (isNow) return '#009ac7';
                          if (price <= chargePrice) return '#4caf50';
                          if (price < expensivePrice) return '#ffc107';
                          return '#f44336';
                        };


                        return intervals.map(iv => {
                          const rawPrice = normalizePrice(iv.price);
                          const price = priceType === 'market'
                            ? (learnedFormulaValid
                              ? rawPrice * modelSlope + modelIntercept
                              : rawPrice + conversion)
                            : rawPrice;
                          const isNow = Boolean(iv.is_now) ||
                            (now >= iv.start && now < iv.end);
                          let color = colorForPrice(price, isNow);
                          if (iv.start >= tomorrow.getTime()) color += '60';

                          return {
                            x: iv.start,
                            y: price,
                            fillColor: color
                          };
                        }).filter(point =>
                          Number.isFinite(point.x) && Number.isFinite(point.y)
                        );
                - type: markdown
                  content: >
                    | Zone | All-in price |

                    |:---|---:|

