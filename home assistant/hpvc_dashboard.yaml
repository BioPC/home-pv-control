      - type: grid
        cards:
          - type: markdown
            title: 📋 Insights
            content: >-
              <ha-alert alert-type="info">
                For complete current-day history, press <b>Generate report</b>
                in <b>PV Master Control</b>.
              </ha-alert>

              <br>

              {% set entities = [
                'input_text.hpvc_insight_1',
                'input_text.hpvc_insight_2',
                'input_text.hpvc_insight_3',
                'input_text.hpvc_insight_4',
                'input_text.hpvc_insight_5',
                'input_text.hpvc_insight_6',
                'input_text.hpvc_insight_7',
                'input_text.hpvc_insight_8',
                'input_text.hpvc_insight_9',
                'input_text.hpvc_insight_10',
                'input_text.hpvc_insight_11',
                'input_text.hpvc_insight_12',
                'input_text.hpvc_insight_13',
                'input_text.hpvc_insight_14',
                'input_text.hpvc_insight_15',
                'input_text.hpvc_insight_16',
                'input_text.hpvc_insight_17',
                'input_text.hpvc_insight_18',
                'input_text.hpvc_insight_19',
                'input_text.hpvc_insight_20'
              ] %} {% set ns = namespace(items=[]) %} {% for entity in entities
              %}
                {% set value = states(entity) %}
                {% if value not in ['unknown', 'unavailable', '', none] %}
                  {% set parts = value.split('|') %}
                  {% if parts | length >= 7 and parts[0] | trim == 'v2' %}
                    {% set severity_code = parts[3] | trim %}
                    {% set item = {
                      'time': parts[2] | trim,
                      'severity': 'critical' if severity_code == 'c' else ('warning' if severity_code == 'w' else 'info'),
                      'count': parts[4] | trim | int(1),
                      'node': parts[5] | trim,
                      'explanation': parts[6:] | join('|') | trim
                    } %}
                  {% elif parts | length >= 6 and parts[1] | trim in ['critical', 'warning', 'info'] %}
                    {% set item = {
                      'time': parts[0] | trim,
                      'severity': parts[1] | trim,
                      'count': parts[2] | trim | int(1),
                      'node': parts[4] | trim,
                      'explanation': parts[5:] | join('|') | trim
                    } %}
                  {% elif parts | length >= 4 %}
                    {% set explanation = parts[3:] | join('|') | trim %}
                    {% set lower = (parts[2] ~ ' ' ~ explanation) | lower %}
                    {% set critical =
                      'control paused' in lower or 'no inverter writes' in lower or
                      'invalid configuration' in lower or ('core ' in lower and ' unavailable' in lower) or
                      ('command' in lower and 'fail' in lower) or ('report' in lower and 'fail' in lower) or
                      'all battery telemetry' in lower or 'runtime unavailable' in lower %}
                    {% set warning = not critical and (
                      'warning' in lower or 'unavailable' in lower or 'stale' in lower or
                      'excluded' in lower or 'blocked' in lower or 'ineffective' in lower or
                      'not confirmed' in lower or 'fault' in lower) %}
                    {% set item = {
                      'time': parts[0] | trim,
                      'severity': 'critical' if critical else ('warning' if warning else 'info'),
                      'count': 1,
                      'node': parts[2] | trim,
                      'explanation': explanation
                    } %}
                  {% else %}
                    {% set item = none %}
                  {% endif %}
                  {% if item %}{% set ns.items = ns.items + [item] %}{% endif %}
                {% endif %}
              {% endfor %}

              {% if ns.items | length == 0 %} <p><em>No Insights recorded yet
              today.</em></p> {% else %}
                {# Node-RED publishes helpers 1..20 already normalized and newest-first. #}
                {% for item in ns.items %}
                  {% set node = (item.node | lower) %}
                  {% set explanation = (item.explanation | lower) %}
                  {% set insight_text = node ~ ' ' ~ explanation %}
                  {# Dashboard-only colour policy: red is reserved for an actual fault,
                     failed action, safety pause, or control-blocking condition. #}
                  {% set red_fault =
                    ('hbc safety' in node and ('paused' in explanation or 'fault' in explanation or 'failed' in explanation)) or
                    ('sensor health' in node and ('control paused' in explanation or 'invalid' in explanation or 'unavailable' in explanation)) or
                    (('configuration' in node or node == 'inputs') and
                      ('control paused' in explanation or 'configuration error' in explanation or 'invalid' in explanation or 'unavailable' in explanation or 'no valid pv inverter' in explanation)) or
                    ('inverter group' in node and ('paused' in explanation or 'fault' in explanation or 'failed' in explanation or 'unavailable' in explanation)) or
                    ('write warning' in node and ('failed' in explanation or 'failure' in explanation or 'error' in explanation or 'could not' in explanation)) or
                    ('runtime warning' in node and ('error' in explanation or 'exception' in explanation or 'failed' in explanation or 'failure' in explanation)) or
                    ('support report' in node and ('failed' in explanation or 'failure' in explanation or 'error' in explanation)) %}
                  {% if 'battery' in node or 'charge priority' in node or 'taper' in node %}
                  {% set icon = '🟣' %}
                  {% elif red_fault or item.severity == 'critical' %}
                  {% set icon = '🔴' %}
                  {% elif 'pv' in node or 'inverter' in node or 'limit' in node or 'restore' in node %}
                  {% set icon = '🟡' %}
                  {% elif 'price' in node %}
                  {% set icon = '🟢' %}
                  {% else %}
                  {% set icon = '⚪' %}
                  {% endif %}
              <div style="padding:8px 0; border-bottom:1px solid
              rgba(128,128,128,.24); overflow:hidden;">
                <div style="display:flex; align-items:flex-start; gap:6px; min-width:0;">
                  <span style="flex:0 0 auto;">{{ icon }}</span>
                  <strong style="min-width:0; overflow-wrap:anywhere; word-break:break-word; white-space:normal;">{{ item.time }} · {{ item.node }}{% if item.count > 1 %} · ×{{ item.count }}{% endif %}</strong>
                </div>
                <div style="margin-top:5px; overflow-wrap:anywhere; word-break:break-word; white-space:normal; line-height:1.45;">{{ item.explanation }}</div>
              </div>
                {% endfor %}
              {% endif %}
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: 'on'
      - type: custom:apexcharts-card
        section_mode: true
        visibility:
          - condition: state
            entity: input_boolean.hpvc_onboarding_complete
            state: 'on'
          - condition: state
            entity: input_boolean.hpvc_control_hbc_strategy
            state: 'on'
          - condition: state
            entity: binary_sensor.hpvc_hbc_available
            state: 'on'
        header:
          show: true
          show_states: true
          colorize_states: true
          title: 💰 HBC Price Intervals
        graph_span: 48h
        update_interval: 1min
        span:
          start: day
        apex_config:
          chart:
            height: 210px
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
            pan:
              enabled: false
          annotations:
            xaxis:
              - x: EVAL:new Date().getTime()
                borderColor: '#009ac7'
                strokeDashArray: 0
                label:
                  text: Now
                  orientation: horizontal
                  offsetY: -12
                  style:
                    background: '#009ac7'
                    color: '#ffffff'
          plotOptions:
            bar:
              borderRadius: 2
              columnWidth: 100%
          grid:
            borderColor: var(--divider-color)
            strokeDashArray: 2
            xaxis:
              lines:
                show: true
            yaxis:
              lines:
                show: true
          legend:
            show: false
          xaxis:
            type: datetime
            labels:
              datetimeUTC: false
              format: HH:mm
              rotate: -45
              rotateAlways: true
              maxHeight: 70
              offsetY: -3
            tooltip:
              enabled: true
              formatter: |
                EVAL:function(value) {
                  const date = new Date(value);

                  const pad = number =>
                    String(number).padStart(2, '0');

                  return (
                    pad(date.getHours()) +
                    ':' +
                    pad(date.getMinutes())
                  );
                }
            crosshairs:
              show: true
              stroke:
                width: 1
                dashArray: 3
          yaxis:
            decimalsInFloat: 0
            title:
              text: cent / kWh
          tooltip:
            enabled: true
            shared: true
            intersect: false
            followCursor: true
            theme: false
            custom: |
              EVAL:function({ series, seriesIndex, dataPointIndex, w }) {

                const priceSeriesIndex =
                  w &&
                  w.config &&
                  w.config.series
                    ? w.config.series.findIndex(s => s.name === 'Price')
                    : -1;

                const index =
                  priceSeriesIndex >= 0
                    ? priceSeriesIndex
                    : seriesIndex;

                const value =
                  series[index] &&
                  dataPointIndex >= 0 &&
                  dataPointIndex < series[index].length
                    ? Number(series[index][dataPointIndex])
                    : NaN;

                const point =
                  w &&
                  w.config &&
                  w.config.series &&
                  w.config.series[index] &&
                  w.config.series[index].data &&
                  dataPointIndex >= 0
                    ? w.config.series[index].data[dataPointIndex]
                    : null;

                const colour =
                  point && point.fillColor
                    ? point.fillColor
                    : '#9e9e9e';

                const display =
                  Number.isFinite(value)
                    ? value.toFixed(1) + ' ct/kWh'
                    : '—';

                return (
                  '<div style="display:flex;align-items:center;gap:7px;padding:7px 9px;font-size:10px;width:max-content;box-sizing:border-box;background:color-mix(in srgb,var(--ha-card-background,var(--card-background-color)) 35%,transparent);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);border-radius:6px;border:1px solid var(--divider-color);color:var(--primary-text-color);font-family:inherit;box-shadow:none;font-weight:700;">' +
                    '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' +
                    colour +
                    ';flex-shrink:0;"></span>' +
                    '<span style="color:var(--secondary-text-color);">Price</span>' +
                    '<span>' +
                    display +
                    '</span>' +
                  '</div>'
                );
              }
        series:
          - entity: sensor.hbc_energy_prices_data
            name: Current high price
            color: '#ff9800'
            unit: ' ct/kWh'
            float_precision: 1
            extend_to: false
            show:
              in_chart: false
              in_header: true
              name_in_header: false
              null_in_header: false
              legend_value: false
            data_generator: |
              const marks = entity.attributes.marks || [];
              const now = Date.now();

              const current =
                marks.find(interval => interval.is_now) ||
                marks.find((interval, index) => {
                  const start =
                    new Date(interval.start).getTime();

                  const nextStart =
                    index < marks.length - 1
                      ? new Date(marks[index + 1].start).getTime()
                      : start + (15 * 60 * 1000);

                  return now >= start && now < nextStart;
                });

              if (
                !current ||
                current.mark !== 'high' ||
                !Number.isFinite(Number(current.price))
              ) {
                return [];
              }

              return [[now, Number(current.price)]];
          - entity: sensor.hbc_energy_prices_data
            name: Current low price
            color: '#4caf50'
            unit: ' ct/kWh'
            float_precision: 1
            extend_to: false
            show:
              in_chart: false
              in_header: true
              name_in_header: false
              null_in_header: false
              legend_value: false
            data_generator: |
              const marks = entity.attributes.marks || [];
              const now = Date.now();

              const current =
                marks.find(interval => interval.is_now) ||
                marks.find((interval, index) => {
                  const start =
                    new Date(interval.start).getTime();

                  const nextStart =
                    index < marks.length - 1
                      ? new Date(marks[index + 1].start).getTime()
                      : start + (15 * 60 * 1000);

                  return now >= start && now < nextStart;
                });

              if (
                !current ||
                current.mark !== 'low' ||
                !Number.isFinite(Number(current.price))
              ) {
                return [];
              }

              return [[now, Number(current.price)]];
          - entity: sensor.hbc_energy_prices_data
            name: Current normal price
            color: '#9e9e9e'
            unit: ' ct/kWh'
            float_precision: 1
            extend_to: false
            show:
              in_chart: false
              in_header: true
              name_in_header: false
              null_in_header: false
              legend_value: false
            data_generator: |
              const marks = entity.attributes.marks || [];
              const now = Date.now();

              const current =
                marks.find(interval => interval.is_now) ||
                marks.find((interval, index) => {
                  const start =
                    new Date(interval.start).getTime();

                  const nextStart =
                    index < marks.length - 1
                      ? new Date(marks[index + 1].start).getTime()
                      : start + (15 * 60 * 1000);

                  return now >= start && now < nextStart;
                });

              if (
                !current ||
                current.mark === 'high' ||
                current.mark === 'low' ||
                !Number.isFinite(Number(current.price))
              ) {
                return [];
              }

              return [[now, Number(current.price)]];
          - entity: sensor.hbc_energy_prices_data
            name: Price
            type: column
            float_precision: 1
            show:
              in_header: false
              legend_value: false
            data_generator: |
              const marks = entity.attributes.marks || [];

              const colours = {
                high: '#ff9800',
                low: '#4caf50'
              };

              const startOfTomorrow = new Date();
              startOfTomorrow.setHours(24, 0, 0, 0);

              const tomorrowTimestamp =
                startOfTomorrow.getTime();

              const withOpacity = (hex, opacity) => {
                const value = hex.replace('#', '');

                const red =
                  parseInt(value.slice(0, 2), 16);

                const green =
                  parseInt(value.slice(2, 4), 16);

                const blue =
                  parseInt(value.slice(4, 6), 16);

                return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
              };

              return marks.map(interval => {
                const timestamp =
                  new Date(interval.start).getTime();

                const colour =
                  interval.is_now
                    ? '#009ac7'
                    : (colours[interval.mark] || '#9e9e9e');

                return {
                  x: timestamp,
                  y: Number(interval.price),
                  fillColor:
                    timestamp >= tomorrowTimestamp &&
                    !interval.is_now
                      ? withOpacity(colour, 0.55)
                      : colour
                };
              });
