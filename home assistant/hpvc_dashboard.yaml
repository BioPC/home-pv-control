                state: "on"
              - condition: state
                entity: binary_sensor.hpvc_hbc_available
                state: "on"
            card:
              type: markdown
              text_only: true
              content: >
                **Charge price**: HBC enters Charge at or below this all-in
                price.



                **Expensive price**: HBC enters the expensive strategy at or
                above this all-in price.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.hpvc_config
                state: "on"
            card:
              type: markdown
              text_only: true
              content: >-
                **Price hysteresis**: prevents rapid switching when exiting the
                price zones. Not used for negative-price mode.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.hpvc_config
                state: "on"
              - entity: input_boolean.hpvc_enabled
                state: "on"
              - entity: input_boolean.hpvc_control_hbc_strategy
