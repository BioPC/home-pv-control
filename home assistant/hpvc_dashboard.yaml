    apex_config:
      chart:
        height: 210px
        animations:
          enabled: false
        toolbar:
          show: false
        zoom:
          enabled: false
        pan:
          enabled: false
      annotations:
        xaxis:
        - x: EVAL:new Date().getTime()
          borderColor: '#009ac7'
          strokeDashArray: 0
          label:
            text: Now
            orientation: horizontal
            offsetY: -12
            style:
              background: '#009ac7'
              color: '#ffffff'
      plotOptions:
        bar:
          borderRadius: 2
          columnWidth: 100%
      grid:
        borderColor: var(--divider-color)
        strokeDashArray: 2
        xaxis:
