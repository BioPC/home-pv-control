- trigger:
  - platform: time_pattern
    seconds: "/30"
  - platform: homeassistant
    event: start
  sensor:
  - name: HPVC Source Freshness
    default_entity_id: sensor.hpvc_source_freshness
    unique_id: hpvc_source_freshness
    icon: mdi:timer-sync-outline
    state: "{{ now().isoformat() }}"
    attributes:
      snapshot_epoch_ms: >-
        {{ (as_timestamp(now(), 0) * 1000) | int }}
      freshness_transport: "ha_template_last_reported_snapshot"
      grid_last_reported_ms: >-
        {% set e = states('input_text.hpvc_grid_power_sensor') | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      market_last_reported_ms: >-
        {% set e = states('input_text.hpvc_market_price_sensor') | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      all_in_last_reported_ms: >-
        {% set e = states('input_text.hpvc_all_in_price_sensor') | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
