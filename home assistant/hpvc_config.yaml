- binary_sensor:
  - name: HPVC Configuration Valid
    unique_id: hpvc_configuration_valid
    icon: mdi:check-decagram-outline
    state: >-
      {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
      {% set core = [
        states('input_text.hpvc_grid_power_sensor'),
        states('input_text.hpvc_market_price_sensor'),
        states('input_text.hpvc_all_in_price_sensor'),
        states('input_text.hpvc_pv_power_sensor')
      ] %}
      {% set ns = namespace(valid=true) %}
      {% for ent in core %}
        {% if ent in bad or '.' not in ent or states(ent) in bad %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}
      {% set count = states('input_number.hpvc_inverter_count') | int(0) %}
      {% if count < 1 %}{% set ns.valid = false %}{% endif %}
      {% for i in range(1, count + 1) %}
        {% set limit_ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') %}
        {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit') | float(0) %}
        {% set low = states('input_number.hpvc_pv' ~ i ~ '_low_limit') | float(-1) %}
        {% if limit_ent in bad or '.' not in limit_ent or states(limit_ent) in bad %}
          {% set ns.valid = false %}
        {% endif %}
        {% if full <= 0 or low < 0 or low >= full %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}
      {{ ns.valid }}
  - name: HPVC HBC Available
    unique_id: hpvc_hbc_available
    icon: mdi:battery-check
    state: >-
      {% set status = states('input_text.hpvc_hbc_status') %}
      {% set strategy = states('input_text.hpvc_battery_strategy_entity') %}
      {% set options = state_attr(strategy, 'options') %}
      {{ status.startswith('HBC detected') and strategy not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and '.' in strategy and states(strategy) not in ['unknown', 'unavailable', 'none', ''] and options is sequence and options is not string and options | count > 0 }}
  - name: HPVC PV Limited
    unique_id: hpvc_pv_limited
    icon: mdi:solar-power-variant
    state: "{% set bad = ['unknown','unavailable','select_entity_first',''] %}\n{% set count = states('input_number.hpvc_inverter_count')|int(1) %}\n{% set db = states('input_number.hpvc_pv_adjust_deadband')|float(25) %}\n{% set ns = namespace(limited=false) %}\n{% for i in range(1, count + 1) %}\n  {% set ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') %}\n  {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit')|float(0) %}\n  {% if ent not in bad and full > 0 and states(ent)|float(full) < (full - db) %}{% set ns.limited = true %}{% endif %}\n{% endfor %}\n{{ ns.limited }}"
  - name: HPVC PV Reveal Active
    unique_id: hpvc_pv_reveal_active
    icon: mdi:solar-power-variant-outline
    state: >-
      {{
        is_state('input_boolean.hpvc_control_hbc_strategy', 'on')
        and states('sensor.hpvc_reveal_request') | float(0) > 0
      }}
  - name: HPVC Cooldown Active
    unique_id: hpvc_cooldown_active
    icon: mdi:timer-sand
    state: '{% set data = states(''input_text.hpvc_last_targets_json'') | from_json(default={}) %} {{ data.get(''cd'', false) }}

      '
  - name: HPVC Negative Price Mode
    unique_id: hpvc_negative_price_mode
    icon: mdi:cash-minus
    state: '{% set ent = states(''input_text.hpvc_all_in_price_sensor'') %}

      {% if ent in [''unknown'',''unavailable'',''select_entity_first'',''''] %}false{% else %}{{ states(ent)|float(999) <= 0 }}{% endif %}'
  - name: HPVC At Minimum PV
    unique_id: hpvc_at_minimum_pv
    icon: mdi:solar-power-variant-outline
    state: "{% set bad = ['unknown','unavailable','select_entity_first',''] %}\n{% set count = states('input_number.hpvc_inverter_count')|int(1) %}\n{% set db = states('input_number.hpvc_pv_adjust_deadband')|float(25) %}\n{% set ns = namespace(any=false, all_min=true) %}\n{% for i in range(1, count + 1) %}\n  {% set ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') %}\n  {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit')|float(0) %}\n  {% set low = states('input_number.hpvc_pv' ~ i ~ '_low_limit')|float(0) %}\n  {% if ent not in bad and full > 0 %}\n    {% set ns.any = true %}\n    {% if states(ent)|float(full) > (low + db) %}{% set ns.all_min = false %}{% endif %}\n  {% endif %}\n{% endfor %}\n{{ ns.any and ns.all_min }}"
script:
  hpvc_sync_hbc_strategy_options:
    alias: Sync HBC strategy options
    mode: restart
    fields:
      prefer_defaults:
        description: Prefer the shipped zone defaults when they are available.
        example: true
    sequence:
    - variables:
        strategy_entity: "{{ states('input_text.hpvc_battery_strategy_entity') }}"
        live_options: >-
          {% set options = state_attr(strategy_entity, 'options') %}
          {{ options if options is sequence and options is not string else [] }}
        hbc_current: "{{ states(strategy_entity) }}"
        prefer_defaults_value: "{{ prefer_defaults | default(false) | bool }}"
        charge_current: "{{ states('input_select.hpvc_charge_strategy') }}"
        balanced_current: "{{ states('input_select.hpvc_balanced_strategy') }}"
        expensive_current: "{{ states('input_select.hpvc_expensive_strategy') }}"
        charge_target: >-
          {% set options = live_options %}
          {% if 'Charge' in options %}Charge
          {% elif charge_current in options %}{{ charge_current }}
          {% elif hbc_current in options %}{{ hbc_current }}
          {% elif options | count > 0 %}{{ options[0] }}
          {% else %}{{ charge_current }}{% endif %}
        balanced_target: >-
          {% set options = live_options %}
          {% if prefer_defaults_value and 'Dynamic' in options %}Dynamic
          {% elif balanced_current in options %}{{ balanced_current }}
          {% elif 'Dynamic' in options %}Dynamic
          {% elif hbc_current in options %}{{ hbc_current }}
          {% elif options | count > 0 %}{{ options[0] }}
          {% else %}{{ balanced_current }}{% endif %}
        expensive_target: >-
          {% set options = live_options %}
          {% if prefer_defaults_value and 'Self-consumption' in options %}Self-consumption
          {% elif expensive_current in options %}{{ expensive_current }}
          {% elif 'Self-consumption' in options %}Self-consumption
          {% elif hbc_current in options %}{{ hbc_current }}
          {% elif options | count > 0 %}{{ options[0] }}
          {% else %}{{ expensive_current }}{% endif %}
    - choose:
      - conditions: "{{ live_options | count > 0 }}"
        sequence:
        - service: input_select.set_options
          target:
            entity_id:
            - input_select.hpvc_charge_strategy
            - input_select.hpvc_balanced_strategy
            - input_select.hpvc_expensive_strategy
          data:
            options: "{{ live_options }}"
        - service: input_select.select_option
          target:
            entity_id: input_select.hpvc_charge_strategy
          data:
            option: "{{ charge_target }}"
        - service: input_select.select_option
          target:
            entity_id: input_select.hpvc_balanced_strategy
          data:
            option: "{{ balanced_target }}"
        - service: input_select.select_option
          target:
            entity_id: input_select.hpvc_expensive_strategy
          data:
            option: "{{ expensive_target }}"
      default: []

  hpvc_restore_defaults:
    alias: Restore defaults
    mode: single
    sequence:
    - service: script.hpvc_sync_hbc_strategy_options
      data:
        prefer_defaults: true
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_limiting_price
      data:
        value: 0.0
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_battery_charge_price
      data:
        value: 0.1
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_battery_expensive_price
      data:
        value: 0.35
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_battery_price_hysteresis
      data:
        value: 0.02
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_export_start_threshold
      data:
        value: -150
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_export_stop_threshold
      data:
        value: -25
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_import_restore_threshold
      data:
        value: 150
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_min_power_for_control
      data:
        value: 100
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_night_restore_power
      data:
        value: 10
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_cooldown_seconds
      data:
        value: 60
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_adjust_deadband
      data:
        value: 25
    - service: input_button.press
      target:
        entity_id: input_button.hpvc_defaults_restored_event

automation:
- id: hpvc_sync_hbc_strategy_options
  alias: HPVC - Sync HBC strategy options
  mode: restart
  trigger:
  - platform: homeassistant
    event: start
    id: startup
  - platform: state
    entity_id: input_text.hpvc_battery_strategy_entity
    id: configured_entity
  - platform: time_pattern
    minutes: /1
    id: periodic_sync
  condition: []
  action:
  - choose:
    - conditions: "{{ trigger.id == 'startup' }}"
      sequence:
      - delay: 00:00:12
  - variables:
      strategy_entity: "{{ states('input_text.hpvc_battery_strategy_entity') }}"
      live_options: >-
        {% set options = state_attr(strategy_entity, 'options') %}
        {{ options if options is sequence and options is not string else [] }}
      hbc_enabled: "{{ is_state('input_boolean.hpvc_control_hbc_strategy', 'on') }}"
  - choose:
    - conditions: "{{ hbc_enabled or live_options | count > 0 }}"
      sequence:
      - service: script.hpvc_sync_hbc_strategy_options
        data:
          prefer_defaults: false
    default: []

- id: hpvc_apply_recommended_defaults_on_first_install
  alias: HPVC - Apply recommended defaults on first install
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'off'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_config
  - delay: 00:00:10
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_notifications
  - service: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.hpvc_enabled
      - input_boolean.hpvc_control_hbc_strategy
      - input_boolean.hpvc_onboarding_complete
  - service: input_text.set_value
    target:
      entity_id: input_text.hpvc_battery_strategy_entity
    data:
      value: input_select.house_battery_strategy
  - service: input_text.set_value
    target:
      entity_id: input_text.hpvc_hbc_status
    data:
      value: HBC not detected
  - service: script.hpvc_sync_hbc_strategy_options
    data:
      prefer_defaults: true
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_limiting_price
    data:
      value: 0.0
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_battery_charge_price
    data:
      value: 0.1
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_battery_expensive_price
    data:
      value: 0.35
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_battery_price_hysteresis
    data:
      value: 0.02
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_export_start_threshold
    data:
      value: -150
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_export_stop_threshold
    data:
      value: -25
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_import_restore_threshold
    data:
      value: 150
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_min_power_for_control
    data:
      value: 100
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_night_restore_power
    data:
      value: 10
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_cooldown_seconds
    data:
      value: 60
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_adjust_deadband
    data:
      value: 25
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_defaults_applied

- id: hpvc_complete_first_install_configuration
  alias: HPVC - Complete first-install configuration
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: binary_sensor.hpvc_configuration_valid
    to: 'on'
  - platform: state
    entity_id: input_boolean.hpvc_defaults_applied
    to: 'on'
  condition:
  - condition: state
    entity_id: binary_sensor.hpvc_configuration_valid
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_onboarding_complete
    state: 'off'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_notifications
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_config
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_onboarding_complete

- id: hpvc_reset_report_after_view
  alias: HPVC - Reset report after viewing
  description: Resets the report tile to Generate report when the generated HTML report is opened.
  mode: restart
  trigger:
  - platform: webhook
    webhook_id: hpvc_report_viewed_130
    allowed_methods:
    - POST
    local_only: false
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_report_ready

