  - name: HPVC Inverter Limit Validation
    default_entity_id: sensor.hpvc_inverter_limit_validation
    unique_id: hpvc_inverter_limit_validation
    icon: mdi:check-decagram-outline
    state: >-
      {% set tracked_limits = [
        states('input_number.hpvc_pv1_full_limit'),
        states('input_number.hpvc_pv1_low_limit'),
        states('input_number.hpvc_pv2_full_limit'),
        states('input_number.hpvc_pv2_low_limit'),
        states('input_number.hpvc_pv3_full_limit'),
        states('input_number.hpvc_pv3_low_limit'),
        states('input_number.hpvc_pv4_full_limit'),
        states('input_number.hpvc_pv4_low_limit'),
        states('input_number.hpvc_pv5_full_limit'),
        states('input_number.hpvc_pv5_low_limit'),
        states('input_number.hpvc_pv6_full_limit'),
        states('input_number.hpvc_pv6_low_limit'),
        states('input_number.hpvc_pv7_full_limit'),
        states('input_number.hpvc_pv7_low_limit'),
        states('input_number.hpvc_pv8_full_limit'),
        states('input_number.hpvc_pv8_low_limit'),
        states('input_number.hpvc_pv9_full_limit'),
        states('input_number.hpvc_pv9_low_limit'),
        states('input_number.hpvc_pv10_full_limit'),
        states('input_number.hpvc_pv10_low_limit')
      ] %}
      {% set ns = namespace(invalid=0) %}
      {% for i in range(1, 11) %}
        {% set full_raw = states('input_number.hpvc_pv' ~ i ~ '_full_limit') %}
        {% set low_raw = states('input_number.hpvc_pv' ~ i ~ '_low_limit') %}
        {% if not is_number(full_raw) or not is_number(low_raw) or low_raw | float(0) > full_raw | float(0) %}
          {% set ns.invalid = ns.invalid + 1 %}
        {% endif %}
      {% endfor %}
      {{ ns.invalid }}
    attributes:
      validation_json: >-
        {% set ns = namespace(rows=[]) %}
        {% for i in range(1, 11) %}
          {% set full_raw = states('input_number.hpvc_pv' ~ i ~ '_full_limit') %}
          {% set low_raw = states('input_number.hpvc_pv' ~ i ~ '_low_limit') %}
          {% set numeric = is_number(full_raw) and is_number(low_raw) %}
          {% set full = full_raw | float(0) %}
          {% set low = low_raw | float(0) %}
          {% set status = 'unknown' if not numeric else 'min_above_max' if low > full else 'min_equal_max' if low == full else 'valid' %}
          {% set effective = low if numeric else 0 %}
          {% set ns.rows = ns.rows + [dict(slot=i, status=status, configured_max=full, configured_min=low, effective_min=effective, valid=(status in ['valid', 'min_equal_max']))] %}
        {% endfor %}
        {{ ns.rows | to_json }}

