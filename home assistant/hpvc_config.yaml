template:
- switch:
  - name: PV1 HPVC Control
    default_entity_id: switch.hpvc_pv1_control
    unique_id: hpvc_pv1_control
    availability: >-
      {% set raw = state_attr('sensor.hpvc_effective_inverter_runtime', 'controller_ui_json') %}
      {% set rows = raw if raw is sequence and raw is not string and raw is not mapping else raw | from_json([]) %}
      {{ rows is sequence and rows is not string and rows | count >= 1 and rows[0].valid | default(false) }}
    icon: mdi:solar-power
    state: "{{ not is_state('input_boolean.hpvc_pv1_control_disabled', 'on') }}"
    turn_on:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.hpvc_pv1_control_disabled
    turn_off:
