script:
  hpvc_previous_inverter:
    alias: HPVC Previous Inverter
    mode: restart
    sequence:
      - variables:
          current: >-
            {{ states('input_select.hpvc_selected_inverter') | replace('PV', '') | int(1) }}
          count: >-
            {% set effective = states('sensor.hpvc_effective_inverter_runtime') | int(1) %} {{ 1 if effective < 1 else 10 if effective > 10 else effective }}
          target: >-
            {{ count if current <= 1 or current > count else current - 1 }}
      - service: input_select.select_option
        target:
          entity_id: input_select.hpvc_selected_inverter
        data:
          option: "PV{{ target }}"

  hpvc_next_inverter:
    alias: HPVC Next Inverter
    mode: restart
    sequence:
      - variables:
          current: >-
            {{ states('input_select.hpvc_selected_inverter') | replace('PV', '') | int(1) }}
          count: >-
            {% set effective = states('sensor.hpvc_effective_inverter_runtime') | int(1) %} {{ 1 if effective < 1 else 10 if effective > 10 else effective }}
          target: >-
            {{ 1 if current < 1 or current >= count else current + 1 }}
      - service: input_select.select_option
        target:
          entity_id: input_select.hpvc_selected_inverter
        data:
          option: "PV{{ target }}"

  hpvc_restore_defaults:
    alias: Restore defaults
    mode: single
    sequence:
    - service: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.hpvc_pv1_control_disabled
        - input_boolean.hpvc_pv2_control_disabled
        - input_boolean.hpvc_pv3_control_disabled
        - input_boolean.hpvc_pv4_control_disabled
        - input_boolean.hpvc_pv5_control_disabled
        - input_boolean.hpvc_pv6_control_disabled
        - input_boolean.hpvc_pv7_control_disabled
        - input_boolean.hpvc_pv8_control_disabled
        - input_boolean.hpvc_pv9_control_disabled
        - input_boolean.hpvc_pv10_control_disabled
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_limiting_price
      data:
        value: 0.0
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_battery_price_hysteresis
      data:
        value: 0.02
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_export_start_threshold
      data:
        value: -150
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_export_stop_threshold
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_import_restore_threshold
      data:
        value: 150
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_min_power_for_control
      data:
        value: 100
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_night_restore_power
      data:
        value: 10
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_cooldown_seconds
      data:
        value: 30
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_adjust_deadband
      data:
        value: 25
    - service: input_boolean.turn_on
      target:
        entity_id:
        - input_boolean.hpvc_negative_price_hbc_charge
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hpvc_insights_enabled
    - service: input_button.press
      target:
        entity_id: input_button.hpvc_defaults_restored_event

automation:
- id: hpvc_external_release_lease_watchdog
  alias: HPVC External Release Lease Watchdog
  mode: restart
  trigger:
    - platform: time_pattern
      seconds: '/15'
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.hpvc_external_release_lease_valid
      state: 'on'
    - condition: template
      value_template: >-
        {% set now_s = as_timestamp(now()) | float(0) %}
        {% set hb = states('input_number.hpvc_engine_heartbeat_epoch') | float(0) %}
        {% set verified = states('input_number.hpvc_external_release_verified_epoch') | float(0) %}
        {{ hb <= 0 or verified <= 0 or (now_s - hb) > 45 or (now_s - verified) > 45 }}
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hpvc_external_release_lease_valid
- id: hpvc_collapse_legacy_empty_inverter_placeholder
  alias: HPVC - Collapse legacy empty inverter placeholder
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  action:
  - delay: 00:00:05
  - condition: template
    value_template: >-
      {{ states('input_number.hpvc_inverter_count') | int(0) == 1
         and states('input_text.hpvc_pv1_limit_number') | trim == ''
         and states('input_text.hpvc_pv1_readback_entity') | trim == ''
         and states('input_text.hpvc_pv1_action') | trim == '' }}
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_inverter_count
    data:
      value: 0

- id: hpvc_keep_selected_inverter_in_range
  alias: HPVC - Keep selected inverter in range
  mode: restart
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id:
    - input_number.hpvc_inverter_count
    - sensor.hpvc_effective_inverter_runtime
    - input_select.hpvc_selected_inverter
  condition:
  - condition: template
    value_template: >-
      {{ states('input_number.hpvc_inverter_count') not in ['unknown', 'unavailable', 'none', '']
         and states('input_select.hpvc_selected_inverter') not in ['unknown', 'unavailable', 'none', ''] }}
  action:
  - variables:
      count: >-
        {% set effective = states('sensor.hpvc_effective_inverter_runtime') | int(0) %}
        {{ 0 if effective < 0 else 10 if effective > 10 else effective }}
      current: >-
        {{ states('input_select.hpvc_selected_inverter') | replace('PV', '') | int(1) }}
  - condition: template
    value_template: "{{ count > 0 and (current < 1 or current > count) }}"
  - service: input_select.select_option
    target:
      entity_id: input_select.hpvc_selected_inverter
    data:
      option: "PV{{ count }}"

- id: hpvc_disable_inverter_on_invalid_limit_range
  alias: HPVC - Disable inverter when Min power exceeds Max power
  mode: restart
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: sensor.hpvc_inverter_limit_validation
  action:
  - delay: 00:00:00.25
  - variables:
      validation_rows: >-
        {% set raw = state_attr('sensor.hpvc_inverter_limit_validation', 'validation_json') %}
        {{ raw | from_json([]) if raw is string else (raw if raw is sequence and raw is not string else []) }}
  - repeat:
      count: 10
      sequence:
      - variables:
          slot: "{{ repeat.index }}"
          row: "{{ validation_rows[(repeat.index | int) - 1] if validation_rows is sequence and validation_rows is not string and validation_rows | count >= (repeat.index | int) else dict(status='unknown') }}"
      - if:
        - condition: template
          value_template: "{{ row.status | default('unknown') == 'min_above_max' }}"
        then:
        - service: input_boolean.turn_on
          target:
            entity_id: "input_boolean.hpvc_pv{{ slot }}_control_disabled"

- id: hpvc_sync_auto_detected_controller_helpers
  alias: HPVC - Mirror auto-detected controller values into slot fields
  mode: single
  max_exceeded: silent
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: sensor.hpvc_effective_inverter_runtime
  - platform: time_pattern
    minutes: /1
  action:
  - delay: 00:00:02
  - repeat:
      count: 10
      sequence:
      - variables:
          slot: "{{ repeat.index }}"
          runtime_raw: "{{ state_attr('sensor.hpvc_effective_inverter_runtime', 'runtime_json') }}"
      - variables:
          runtime_rows: >-
            {% set raw = state_attr('sensor.hpvc_effective_inverter_runtime', 'runtime_json') %}
            {{ raw if raw is sequence and raw is not string and raw is not mapping else raw | from_json([]) }}
      - variables:
          runtime_entry: >-
            {{ runtime_rows[(slot | int) - 1] if runtime_rows is sequence and runtime_rows is not string and (runtime_rows | count) >= (slot | int) else '' }}
      - variables:
          runtime_parts: >-
            {{ runtime_entry.split('|') if runtime_entry is string else [] }}
          is_auto: >-
            {{ runtime_entry is string and (runtime_entry.split('|') | count) >= 7 and runtime_entry.split('|')[6] | trim == 'auto' and runtime_entry.split('|')[0] | trim != '' }}
      - condition: template
        value_template: "{{ is_auto }}"
      - if:
        - condition: template
          value_template: "{{ not is_state('input_boolean.hpvc_pv' ~ slot ~ '_auto_managed', 'on') }}"
        then:
        - service: input_boolean.turn_on
          target:
            entity_id: "input_boolean.hpvc_pv{{ slot }}_auto_managed"
      - variables:
          auto_kind: "{{ runtime_parts[4] | trim }}"
          auto_entity: "{{ runtime_parts[0] | trim | lower }}"
          stored_identity: >-
            {% set raw = states('input_text.hpvc_pv' ~ slot ~ '_auto_identity') | trim | lower %}
            {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
          desired_identity: "{{ auto_kind ~ '|' ~ auto_entity }}"
      - if:
        - condition: template
          value_template: "{{ auto_kind == 'enphase' and stored_identity not in ['', desired_identity] }}"
        then:
        - service: input_number.set_value
          target:
            entity_id: "input_number.hpvc_pv{{ slot }}_full_limit"
          data:
            value: 0
        - service: input_number.set_value
          target:
            entity_id: "input_number.hpvc_pv{{ slot }}_low_limit"
          data:
            value: 0
      - if:
        - condition: template
          value_template: "{{ stored_identity != desired_identity }}"
        then:
        - service: input_text.set_value
          target:
            entity_id: "input_text.hpvc_pv{{ slot }}_auto_identity"
          data:
            value: "{{ desired_identity }}"
      - if:
        - condition: template
          value_template: "{{ states('input_select.hpvc_pv' ~ slot ~ '_control_method') != (runtime_parts[5] | string) }}"
        then:
        - service: input_select.select_option
          target:
            entity_id: "input_select.hpvc_pv{{ slot }}_control_method"
          data:
            option: "{{ runtime_parts[5] }}"
      - if:
        - condition: template
          value_template: "{{ states('input_text.hpvc_pv' ~ slot ~ '_limit_number') | trim | lower != runtime_parts[0] | trim | lower }}"
        then:
        - service: input_text.set_value
          target:
            entity_id: "input_text.hpvc_pv{{ slot }}_limit_number"
          data:
            value: "{{ runtime_parts[0] }}"
      - if:
        - condition: template
          value_template: "{{ states('input_select.hpvc_pv' ~ slot ~ '_limit_unit') != (runtime_parts[1] | string) }}"
        then:
        - service: input_select.select_option
          target:
            entity_id: "input_select.hpvc_pv{{ slot }}_limit_unit"
          data:
            option: "{{ runtime_parts[1] }}"
      - if:
        - condition: template
          value_template: "{{ runtime_parts[4] | trim != 'enphase' and (states('input_number.hpvc_pv' ~ slot ~ '_full_limit') | float(0) - (runtime_parts[2] | float(0))) | abs > 0.5 }}"
        then:
        - service: input_number.set_value
          target:
            entity_id: "input_number.hpvc_pv{{ slot }}_full_limit"
          data:
            value: "{{ runtime_parts[2] | float(0) }}"
      - if:
        - condition: template
          value_template: "{{ runtime_parts[4] | trim != 'enphase' and (states('input_number.hpvc_pv' ~ slot ~ '_low_limit') | float(0) - (runtime_parts[3] | float(0))) | abs > 0.5 }}"
        then:
        - service: input_number.set_value
          target:
            entity_id: "input_number.hpvc_pv{{ slot }}_low_limit"
          data:
            value: "{{ runtime_parts[3] | float(0) }}"
  - repeat:
      count: 10
      sequence:
      - variables:
          slot: "{{ repeat.index }}"
          runtime_rows: >-
            {% set raw = state_attr('sensor.hpvc_effective_inverter_runtime', 'runtime_json') %}
            {{ raw if raw is sequence and raw is not string and raw is not mapping else raw | from_json([]) }}
          current_entry: >-
            {{ runtime_rows[(repeat.index | int) - 1] if runtime_rows is sequence and runtime_rows is not string and (runtime_rows | count) >= (repeat.index | int) else '' }}
      - variables:
          current_parts: "{{ current_entry.split('|') if current_entry is string else [] }}"
          currently_auto: >-
            {{ current_entry is string and (current_entry.split('|') | count) >= 7 and current_entry.split('|')[6] | trim == 'auto' }}
      - variables:
          previous_limit: "{{ states('input_text.hpvc_pv' ~ slot ~ '_limit_number') | trim | lower }}"
          previous_identity: >-
            {% set raw = states('input_text.hpvc_pv' ~ slot ~ '_auto_identity') | trim | lower %}
            {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
          preserve_enphase_range: "{{ previous_identity != '' and previous_identity == ('enphase|' ~ previous_limit) }}"
      - if:
        - condition: template
          value_template: "{{ is_state('input_boolean.hpvc_pv' ~ slot ~ '_auto_managed', 'on') and not currently_auto }}"
        then:
        - service: input_text.set_value
          target:
            entity_id: "input_text.hpvc_pv{{ slot }}_limit_number"
          data:
            value: ""
        - service: input_text.set_value
          target:
            entity_id: "input_text.hpvc_pv{{ slot }}_readback_entity"
          data:
            value: ""
        - service: input_text.set_value
          target:
            entity_id: "input_text.hpvc_pv{{ slot }}_action"
          data:
            value: ""
        - if:
          - condition: template
            value_template: "{{ not preserve_enphase_range }}"
          then:
          - service: input_number.set_value
            target:
              entity_id: "input_number.hpvc_pv{{ slot }}_full_limit"
            data:
              value: 0
  - variables:
      configured_count: "{{ states('input_number.hpvc_inverter_count') | int(0) }}"
      trimmed_count: >-
        {% set ns = namespace(value=states('input_number.hpvc_inverter_count') | int(0), trimming=true) %}
        {% for i in range(10, 0, -1) %}
          {% if i <= ns.value and ns.trimming %}
            {% set cleaned_auto = is_state('input_boolean.hpvc_pv' ~ i ~ '_auto_managed', 'on') and states('input_text.hpvc_pv' ~ i ~ '_limit_number') | trim == '' and states('input_text.hpvc_pv' ~ i ~ '_readback_entity') | trim == '' and states('input_text.hpvc_pv' ~ i ~ '_action') | trim == '' %}
            {% if cleaned_auto %}{% set ns.value = i - 1 %}{% else %}{% set ns.trimming = false %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.value }}
  - if:
    - condition: template
      value_template: "{{ trimmed_count | int(0) < configured_count | int(0) }}"
    then:
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_inverter_count
      data:
        value: "{{ trimmed_count | int(0) }}"
  - repeat:
      count: 10
      sequence:
      - variables:
          slot: "{{ repeat.index }}"
          runtime_rows: >-
            {% set raw = state_attr('sensor.hpvc_effective_inverter_runtime', 'runtime_json') %}
            {{ raw if raw is sequence and raw is not string and raw is not mapping else raw | from_json([]) }}
          current_entry: >-
            {{ runtime_rows[(repeat.index | int) - 1] if runtime_rows is sequence and runtime_rows is not string and (runtime_rows | count) >= (repeat.index | int) else '' }}
      - variables:
          currently_auto: >-
            {{ current_entry is string and (current_entry.split('|') | count) >= 7 and current_entry.split('|')[6] | trim == 'auto' }}
      - if:
        - condition: template
          value_template: "{{ is_state('input_boolean.hpvc_pv' ~ slot ~ '_auto_managed', 'on') and not currently_auto }}"
        then:
        - service: input_boolean.turn_off
          target:
            entity_id: "input_boolean.hpvc_pv{{ slot }}_auto_managed"

- id: hpvc_seed_negative_price_hbc_charge_default
  alias: HPVC - Seed negative-price HBC charging default
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  - platform: time_pattern
    minutes: /1
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_negative_price_hbc_charge_default_applied
    state: 'off'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_negative_price_hbc_charge
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_negative_price_hbc_charge_default_applied

- id: hpvc_apply_recommended_defaults_on_first_install
  alias: HPVC - Apply recommended defaults on first install
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: input_boolean.hpvc_defaults_applied
    to: 'off'
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'off'
  action:
  - delay: 00:00:10
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'off'
  - service: input_boolean.turn_on
    target:
      entity_id:
      - input_boolean.hpvc_notifications
      - input_boolean.hpvc_negative_price_hbc_charge
  - service: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.hpvc_enabled
      - input_boolean.hpvc_control_hbc_strategy
      - input_boolean.hpvc_insights_enabled
      - input_boolean.hpvc_onboarding_complete
      - input_boolean.hpvc_auto_resume_pending
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_limiting_price
    data:
      value: 0.0
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_battery_price_hysteresis
    data:
      value: 0.02
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_export_start_threshold
    data:
      value: -150
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_export_stop_threshold
    data:
      value: 0
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_import_restore_threshold
    data:
      value: 150
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_min_power_for_control
    data:
      value: 100
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_night_restore_power
    data:
      value: 10
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_cooldown_seconds
    data:
      value: 30
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_adjust_deadband
    data:
      value: 25
  - service: input_boolean.turn_on
    target:
      entity_id:
      - input_boolean.hpvc_negative_price_hbc_charge_default_applied
      - input_boolean.hpvc_defaults_applied


- id: hpvc_complete_first_install_configuration
  alias: HPVC - Complete first-install configuration
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: binary_sensor.hpvc_configuration_valid
    to: 'on'
  - platform: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    to: 'on'
  - platform: state
    entity_id: input_boolean.hpvc_defaults_applied
    to: 'on'
  - platform: state
    entity_id: input_boolean.hpvc_onboarding_complete
    to: 'off'
  condition:
  - condition: state
    entity_id: binary_sensor.hpvc_configuration_valid
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_onboarding_complete
    state: 'off'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_notifications
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_onboarding_complete
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_auto_resume_pending
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_enabled

- id: hpvc_disable_when_required_inputs_invalid
  alias: HPVC - Disable when required inputs are invalid
  description: Turns off the HPVC master control when a required live input or configuration value is invalid and remembers whether HPVC should resume.
  mode: restart
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    to: 'off'
  - platform: state
    entity_id: input_boolean.hpvc_enabled
    to: 'on'
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_onboarding_complete
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    state: 'off'
  - condition: state
    entity_id: input_boolean.hpvc_enabled
    state: 'on'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_auto_resume_pending
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_enabled

- id: hpvc_resume_when_required_inputs_recover
  alias: HPVC - Resume when required inputs recover
  description: Re-enables HPVC only after configuration and all required live inputs have remained valid for 5 continuous seconds, and only when HPVC was automatically disabled by a fault.
  mode: restart
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id:
    - binary_sensor.hpvc_configuration_valid
    - binary_sensor.hpvc_required_inputs_ready
  - platform: state
    entity_id: input_boolean.hpvc_auto_resume_pending
    to: 'on'
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_onboarding_complete
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_auto_resume_pending
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_configuration_valid
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    state: 'on'
  action:
  - delay: 00:00:05
  - condition: state
    entity_id: binary_sensor.hpvc_configuration_valid
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_auto_resume_pending
    state: 'on'
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_enabled
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_auto_resume_pending

- id: hpvc_cancel_auto_resume_on_manual_disable
  alias: HPVC - Cancel automatic resume after manual switch-off
  description: Clears the automatic-resume latch only for a direct user switch-off, not for an automatic safety shutdown that inherited a user context.
  mode: restart
  trigger:
  - platform: state
    entity_id: input_boolean.hpvc_enabled
    to: 'off'
  condition:
  - condition: template
    value_template: >-
      {{ trigger.to_state.context.user_id is not none
         and trigger.to_state.context.parent_id is none }}
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_auto_resume_pending

- id: hpvc_reset_report_after_view
  alias: HPVC - Reset report after viewing
  description: Resets the report tile to Generate report when the generated HTML report is opened.
  mode: restart
  trigger:
  - platform: webhook
    webhook_id: hpvc_report_viewed_141
    allowed_methods:
    - POST
    local_only: true
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_report_ready

- id: hpvc_reset_report_ready_timeout
  alias: HPVC - Reset report ready after timeout
  description: Resets the report tile after 60 seconds as a safe fallback for remote access paths such as Tailscale, while keeping the report-view webhook local-only.
  mode: restart
  trigger:
  - platform: state
    entity_id: input_boolean.hpvc_report_ready
    to: 'on'
    for: '00:01:00'
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_report_ready
