input_button:
  hpvc_defaults_restored_event:
    name: HPVC Defaults Restored Event
    icon: mdi:restore
  hpvc_export_report:
    name: HPVC Generate Report
    icon: mdi:file-document-plus-outline
template:
- sensor:
  - name: HPVC Diag Market/Export Price
    default_entity_id: sensor.hpvc_diag_market_export_price
    unique_id: hpvc_diag_market_export_price
    unit_of_measurement: €/kWh
    icon: mdi:cash
    availability: >-
      {% set ent = states('input_text.hpvc_market_price_sensor') %}
      {{ ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(ent)) }}
    state: >-
      {% set ent = states('input_text.hpvc_market_price_sensor') %}
      {{ states(ent) | float }}
  - name: HPVC Diag All In Price
    unique_id: hpvc_diag_all_in_price
    unit_of_measurement: €/kWh
    icon: mdi:cash-multiple
    availability: >-
      {% set ent = states('input_text.hpvc_all_in_price_sensor') %}
      {{ ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(ent)) }}
    state: >-
      {% set ent = states('input_text.hpvc_all_in_price_sensor') %}
      {{ states(ent) | float }}
  - name: HPVC Diag Grid Power
    unique_id: hpvc_diag_grid_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:transmission-tower
    availability: >-
      {% set ent = states('input_text.hpvc_grid_power_sensor') %}
      {{ ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(ent)) }}
    state: >-
      {% set ent = states('input_text.hpvc_grid_power_sensor') %}
      {{ states(ent) | float | round(0) }}
  - name: HPVC Diag PV Power
    unique_id: hpvc_diag_pv_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:solar-power
    availability: >-
      {% set ent = states('input_text.hpvc_pv_power_sensor') %}
      {{ ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(ent)) }}
    state: >-
      {% set ent = states('input_text.hpvc_pv_power_sensor') %}
      {{ states(ent) | float | round(0) }}
  - name: HPVC Diag HBC Strategy
    unique_id: hpvc_diag_hbc_strategy
    icon: mdi:battery-sync
    state: '{{ states(''input_select.house_battery_strategy'') }}'
  - name: HPVC Total HBC Charging Power
    unique_id: hpvc_total_hbc_charging_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:battery-arrow-down
    state: >-
      {% set count = states('input_number.house_battery_count') | int(0) %}
      {% set ns = namespace(total=0) %}
      {% for i in range(1, [count, 6] | min + 1) %}
        {% set ent = 'sensor.marstek_m' ~ i ~ '_ac_power' %}
        {% if has_value(ent) %}
          {% set power = states(ent) | float(0) %}
          {% if power < 0 %}
            {% set ns.total = ns.total + (power * -1) %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.total | round(0) }}
  - name: HPVC Daily Target Accuracy
    unique_id: hpvc_daily_target_accuracy
    unit_of_measurement: "%"
    icon: mdi:target
    availability: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={})
      %}
      {{ data.get('da', none) is not none }}
    state: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={})
      %}
      {% set value = data.get('da', 0) %}
      {{ [[value | float(0), 0] | max, 100] | min | round(1) }}
  - name: HPVC Daily Target Accuracy Samples
    unique_id: hpvc_daily_target_accuracy_samples
    icon: mdi:counter
    availability: >-
      {% set raw = states('input_text.hpvc_accuracy_diagnostics_json') %}
      {% set data = raw | from_json(default={}) %}
      {{ raw not in ['unknown', 'unavailable', 'none', ''] and data.get('tc', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tc',
      0) | int(0) }}
  - name: HPVC Daily Band Excursions
    unique_id: hpvc_daily_band_excursions
    icon: mdi:chart-scatter-plot
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('tbx', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tbx', 0) | int(0) }}
  - name: HPVC Daily RMS Control Error
    unique_id: hpvc_daily_rms_control_error
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:chart-bell-curve-cumulative
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('trms', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('trms', 0) | float(0) | round(1) }}
  - name: HPVC Daily MAE Control Error
    unique_id: hpvc_daily_mae_control_error
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:chart-line
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('tmae', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tmae', 0) | float(0) | round(1) }}
  - name: HPVC Daily Time Outside Target Deadband
    unique_id: hpvc_daily_time_outside_target_deadband
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:timer-alert-outline
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('toutp', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('toutp', 0) | float(0) | round(1) }}
  - name: HPVC Deadband Exceedance RMS MAE Ratio
    unique_id: hpvc_deadband_exceedance_rms_mae_ratio
    icon: mdi:division
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('tratio', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tratio', 0) | float(0) | round(2) }}
  - name: HPVC Tracking Error Attribution Coverage
    unique_id: hpvc_tracking_error_attribution_coverage
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:percent-box-outline
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('tcoverp', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tcoverp', 0) | float(0) | round(1) }}
  - name: HPVC Tracking Error No Action Excluded
    unique_id: hpvc_tracking_error_no_action_excluded
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:pause-circle-outline
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('tpolicyx', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tpolicyx', 0) | float(0) | round(1) }}
  - name: HPVC Tracking Error Continuity Gap Excluded
    unique_id: hpvc_tracking_error_continuity_gap_excluded
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:timeline-alert-outline
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('tgapx', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tgapx', 0) | float(0) | round(1) }}
  - name: HPVC Tracking Error Factor State
    unique_id: hpvc_tracking_error_factor_state
    icon: mdi:state-machine
    availability: >-
      {% set data = states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={}) %}
      {{ data.get('tfs', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tfs', 'no_error') }}
  # Compatibility entity IDs retained. These four values are estimated percentage
  # contributions to the Daily Control Accuracy headline loss (100 - accuracy), not raw
  # schema-11 attribution shares. Raw shares remain in the compact diagnostics JSON/report.
  - name: HPVC Target Control Response Impact
    unique_id: hpvc_target_control_response_impact
    unit_of_measurement: "%"
    icon: mdi:swap-horizontal-bold
    availability: >-
      {% set raw = states('input_text.hpvc_accuracy_diagnostics_json') %}
      {% set data = raw | from_json(default={}) %}
      {{ raw not in ['unknown', 'unavailable', 'none', ''] and data.get('tctrlp', none) is not none }}
