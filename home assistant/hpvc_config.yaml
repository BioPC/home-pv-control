            {% set ns.auto_i = ns.auto_i + 1 %}
          {% elif method == 'Number entity' and limit in ns.discovered %}
            {% set auto_kind = 'opendtu' if limit in od.limits else 'enphase' %}
            {% set auto_identity_raw = states('input_text.hpvc_pv' ~ i ~ '_auto_identity') | trim | lower %}
            {% set auto_identity = '' if auto_identity_raw in ['unknown', 'unavailable', 'none'] else auto_identity_raw %}
            {% set slot_auto_managed = is_state('input_boolean.hpvc_pv' ~ i ~ '_auto_managed', 'on') %}
            {% set enphase_range_ok = auto_kind != 'enphase' or not slot_auto_managed or auto_identity == '' or auto_identity == ('enphase|' ~ limit) %}
            {% set native_full_ns = namespace(value=(full if enphase_range_ok else 0)) %}
            {% for controller in od.candidates if controller.limit_entity == limit %}
              {% if controller.max_power is defined and controller.max_power | float(0) > 0 %}{% set native_full_ns.value = controller.max_power | float(0) %}{% endif %}
            {% endfor %}
            {% set native_full = native_full_ns.value %}
            {% set native_low = state_attr(limit, 'min') | float(0) %}
            {% set effective_low = (low if enphase_range_ok else 0) if auto_kind == 'enphase' else [native_low, low] | max %}
            {% set ns.slots = ns.slots + [limit ~ '|Watts|' ~ native_full ~ '|' ~ effective_low ~ '|' ~ auto_kind ~ '|Number entity|auto'] %}
          {% elif method == 'Number entity' %}
            {% set ns.slots = ns.slots + [limit ~ '|' ~ unit ~ '|' ~ full ~ '|' ~ low ~ '|manual-number|Number entity|manual'] %}
          {% elif method == 'Action/service' %}
            {% set ns.slots = ns.slots + [readback ~ '|' ~ unit ~ '|' ~ full ~ '|' ~ low ~ '|manual-action|Action/service|manual'] %}
          {% else %}
            {% set ns.slots = ns.slots + ['||||manual-invalid|' ~ method ~ '|manual'] %}
          {% endif %}
        {% endfor %}
        {% for ent in ns.auto[ns.auto_i:] %}
          {% if ns.slots | count < 10 %}
            {% set slot = (ns.slots | count) + 1 %}
            {% set auto_kind = 'opendtu' if ent in od.limits else 'enphase' %}
            {% set slot_full = states('input_number.hpvc_pv' ~ slot ~ '_full_limit') | float(0) %}
            {% set auto_identity_raw = states('input_text.hpvc_pv' ~ slot ~ '_auto_identity') | trim | lower %}
            {% set auto_identity = '' if auto_identity_raw in ['unknown', 'unavailable', 'none'] else auto_identity_raw %}
            {% set enphase_range_ok = auto_kind != 'enphase' or auto_identity == '' or auto_identity == ('enphase|' ~ ent) %}
            {% set native_full_ns = namespace(value=(slot_full if enphase_range_ok else 0)) %}
            {% for controller in od.candidates if controller.limit_entity == ent %}
              {% if controller.max_power is defined and controller.max_power | float(0) > 0 %}{% set native_full_ns.value = controller.max_power | float(0) %}{% endif %}
            {% endfor %}
            {% set native_full = native_full_ns.value %}
            {% set native_low = state_attr(ent, 'min') | float(0) %}
            {% set slot_low = states('input_number.hpvc_pv' ~ slot ~ '_low_limit') | float(0) %}
            {% set effective_low = (slot_low if enphase_range_ok else 0) if auto_kind == 'enphase' else [native_low, slot_low] | max %}
            {% set ns.slots = ns.slots + [ent ~ '|Watts|' ~ native_full ~ '|' ~ effective_low ~ '|' ~ auto_kind ~ '|Number entity|auto'] %}
          {% endif %}
        {% endfor %}
        {% set ui = namespace(rows=[]) %}
        {% for raw in ns.slots %}
          {% set i = loop.index %}
          {% set p = 'input_text.hpvc_pv' ~ i ~ '_' %}
          {% set parts = raw.split('|') %}
          {% set ent = parts[0] %}
          {% set unit = parts[1] %}
          {% set full = parts[2] | float(0) %}
          {% set low = parts[3] | float(0) %}
          {% set kind = parts[4] %}
          {% set method = parts[5] %}
          {% set source = parts[6] if parts | count >= 7 else 'manual' %}
          {% set max_lock = namespace(value=false) %}
          {% if source == 'auto' and kind == 'opendtu' %}
            {% for controller in od.candidates if controller.limit_entity == ent %}
              {% if controller.max_power is defined and controller.max_power | float(0) > 0 %}{% set max_lock.value = true %}{% endif %}
            {% endfor %}
          {% endif %}
          {% set action = states(p ~ 'action') | trim | lower %}
          {% set rb = states(p ~ 'readback_entity') | trim | lower %}
          {% set empty = kind not in ['enphase','opendtu'] and ent == '' and action == '' and rb == '' %}
          {% set v = namespace(valid=unit in ['Watts','Percent'] and full > 0 and low >= 0 and low <= full, live=true) %}
          {% set exists = states | selectattr('entity_id', 'eq', ent) | list | count > 0 %}
          {% if method == 'Number entity' %}
            {% set v.valid = v.valid and ent | regex_match('^number[.][a-z0-9_]+$') and exists %}
            {% set v.live = is_number(states(ent)) %}
            {% set native_min = state_attr(ent, 'min') | float(0) %}
            {% set native_max = state_attr(ent, 'max') | float(full if unit == 'Watts' else 100) %}
            {% set required_min = low if unit == 'Watts' else low / full * 100 if full > 0 else 0 %}
            {% set required_max = full if unit == 'Watts' else 100 %}
            {% set v.valid = v.valid and native_min <= required_min and native_max >= required_max %}
            {% if kind == 'enphase' %}
              {% set pair = namespace(found=false) %}
              {% for controller in dp.candidates if controller.limit_entity == ent %}
                {% set enable = controller.enable_entity %}
                {% set mode = controller.mode_entity %}
                {% set options = state_attr(mode, 'options') or [] %}
                {% set pair.found = 'Production' in options and 'Export' in options and (states | selectattr('entity_id', 'eq', enable) | list | count > 0) and (states | selectattr('entity_id', 'eq', mode) | list | count > 0) %}
                {% set v.live = v.live and states(enable) in ['on','off'] and states(mode) not in ['unknown','unavailable','none',''] %}
              {% endfor %}
              {% set v.valid = v.valid and pair.found %}
            {% elif ent | regex_match('^number[.].+_dpel_limit$') %}
              {# A partial native triplet must not be presented as a generic number. #}
              {% set v.valid = false %}
            {% endif %}
          {% elif method == 'Action/service' %}
            {% set fixed = states(p ~ 'fixed_data_json') | from_json(none) %}
            {% set target = states(p ~ 'target_json') | from_json(none) %}
            {% set pre = states(p ~ 'pre_actions_json') | from_json(none) %}
            {% set post = states(p ~ 'post_actions_json') | from_json(none) %}
            {% set step = states('input_number.hpvc_pv' ~ i ~ '_action_step') | float(-1) %}
            {% set refresh = states('input_number.hpvc_pv' ~ i ~ '_refresh_seconds') | float(-1) %}
            {% set v.valid = v.valid and action | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') and states(p ~ 'value_field') | trim not in ['','unknown','unavailable'] and fixed is mapping and target is mapping and pre is sequence and pre is not string and pre is not mapping and post is sequence and post is not string and post is not mapping and step >= 0 and step <= (100 if unit == 'Percent' else full) and refresh >= 0 %}
            {% if v.valid %}
              {% for item in pre + post %}
                {% if item is not mapping or item.action is not defined or not item.action | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') %}{% set v.valid = false %}{% endif %}
              {% endfor %}
            {% endif %}
            {% if rb != '' %}
              {% set v.valid = v.valid and rb | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') and exists %}
              {% set v.live = is_number(states(rb)) %}
            {% endif %}
          {% else %}
            {% set v.valid = false %}
          {% endif %}
          {% if unit == 'Percent' and is_number(states(ent)) and (states(ent) | float < 0 or states(ent) | float > 100) %}{% set v.valid = false %}{% endif %}
          {# Keep the earliest assignment as owner; only later assignments conflict. #}
          {% set own_helpers = states | selectattr('entity_id', 'eq', p ~ 'limit_number') | list %}
          {% set own_time = (own_helpers[0].last_changed | default('') | string) if own_helpers else '' %}
          {% set owner = namespace(slot=i, changed=own_time) %}
          {% if method == 'Number entity' and ent != '' %}
            {% for other in ns.slots %}
              {% set other_i = loop.index %}
              {% set other_parts = other.split('|') %}
              {% if other_parts | count >= 6 and other_parts[5] == 'Number entity' and other_parts[0] == ent %}
                {% set helpers = states | selectattr('entity_id', 'eq', 'input_text.hpvc_pv' ~ other_i ~ '_limit_number') | list %}
                {% set changed = (helpers[0].last_changed | default('') | string) if helpers else '' %}
                {% if changed < owner.changed or (changed == owner.changed and other_i < owner.slot) %}
                  {% set owner.slot = other_i %}
                  {% set owner.changed = changed %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% set duplicate = method == 'Number entity' and ent != '' and owner.slot != i %}
          {% if duplicate %}{% set v.valid = false %}{% endif %}
          {% set status = 'Not configured' if empty else 'Incomplete' if not v.valid else 'Unavailable' if not v.live else 'Configured' if method == 'Action/service' else 'Detected' %}
          {% if duplicate %}
            {% set ui.rows = ui.rows + [dict(status=status, valid=false, source=source, kind=kind, control_method=method, limit_entity=ent, limit_unit=unit, max_power=full, min_power=low, max_power_locked=max_lock.value, reason='Limit entity already assigned to PV' ~ owner.slot)] %}
          {% else %}
            {% set ui.rows = ui.rows + [dict(status=status, valid=v.valid and not empty, source=source, kind=kind, control_method=method, limit_entity=ent, limit_unit=unit, max_power=full, min_power=low, max_power_locked=max_lock.value)] %}
          {% endif %}
        {% endfor %}
        {{ ui.rows | to_json }}
