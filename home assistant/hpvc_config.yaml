      {% set runtime = (runtime_raw | from_json(default=[])) if runtime_raw is string else (runtime_raw if runtime_raw is sequence else []) %}
      {% set ns = namespace(any=false, all_min=true, missing=false) %}
      {% for entry in runtime %}
        {% set parts = entry.split('|') %}
        {% if parts | count >= 6 and parts[0] != '' and is_number(states(parts[0])) %}
          {% set ns.any = true %}
          {% set raw = states(parts[0]) | float(0) %}
          {% set full = parts[2] | float(0) %}
          {% set low = parts[3] | float(0) %}
          {% set current = (raw / 100 * full) if parts[1] == 'Percent' else raw %}
          {% if ((current - low) | abs) >= min_tol %}{% set ns.all_min = false %}{% endif %}
        {% else %}
          {% set ns.missing = true %}
        {% endif %}
      {% endfor %}
      {% if ns.missing %}
