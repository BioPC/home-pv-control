- binary_sensor:
  - name: HPVC Configuration Valid
    unique_id: hpvc_configuration_valid
    icon: mdi:check-decagram-outline
    state: >-
      {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
      {% set core = [
        states('input_text.hpvc_grid_power_sensor') | trim | lower,
        states('input_text.hpvc_market_price_sensor') | trim | lower,
        states('input_text.hpvc_all_in_price_sensor') | trim | lower,
        states('input_text.hpvc_pv_power_sensor') | trim | lower
      ] %}
      {% set ns = namespace(valid=true, inverter_entities=[]) %}
      {% for ent in core %}
        {% if ent in bad or not (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}

      {% set numeric_helpers = [
        'input_number.hpvc_pv_limiting_price',
        'input_number.hpvc_battery_price_hysteresis',
        'input_number.hpvc_export_start_threshold',
        'input_number.hpvc_export_stop_threshold',
        'input_number.hpvc_import_restore_threshold',
        'input_number.hpvc_pv_min_power_for_control',
        'input_number.hpvc_pv_night_restore_power',
        'input_number.hpvc_cooldown_seconds',
        'input_number.hpvc_pv_adjust_deadband',
        'input_number.hpvc_inverter_count'
      ] %}
      {% for helper in numeric_helpers %}
        {% if not is_number(states(helper)) %}{% set ns.valid = false %}{% endif %}
      {% endfor %}

      {% set limiting_price = states('input_number.hpvc_pv_limiting_price') | float(999999) %}
      {% set export_start = states('input_number.hpvc_export_start_threshold') | float(999999) %}
      {% set target_export = states('input_number.hpvc_export_stop_threshold') | float(999999) %}
      {% set import_restore = states('input_number.hpvc_import_restore_threshold') | float(-1) %}
      {% set hysteresis = states('input_number.hpvc_battery_price_hysteresis') | float(-1) %}
      {% set minimum_pv = states('input_number.hpvc_pv_min_power_for_control') | float(-1) %}
      {% set night_pv = states('input_number.hpvc_pv_night_restore_power') | float(-1) %}
      {% set cooldown = states('input_number.hpvc_cooldown_seconds') | float(-1) %}
      {% set deadband = states('input_number.hpvc_pv_adjust_deadband') | float(-1) %}
      {% if not (
        -0.50 <= limiting_price <= 0.20
        and 0 <= hysteresis <= 0.10
        and -5000 <= export_start <= 0
        and -5000 <= target_export <= 500
        and 0 <= import_restore <= 5000
        and export_start < target_export < import_restore
        and 0 <= minimum_pv <= 5000
        and 0 <= night_pv <= 1000
        and 10 <= cooldown <= 60
        and 1 <= deadband <= 500
      ) %}
        {% set ns.valid = false %}
      {% endif %}

      {% set count_raw = states('input_number.hpvc_inverter_count') | float(0) %}
      {% set count = states('input_number.hpvc_inverter_count') | int(0) %}
      {% if count_raw != count or count < 1 or count > 10 %}{% set ns.valid = false %}{% endif %}
      {% for i in range(1, count + 1) %}
        {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') | trim %}
        {% set unit = states('input_select.hpvc_pv' ~ i ~ '_limit_unit') | trim %}
        {% set limit_ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') | trim | lower %}
        {% set readback_ent = states('input_text.hpvc_pv' ~ i ~ '_readback_entity') | trim | lower %}
        {% set action = states('input_text.hpvc_pv' ~ i ~ '_action') | trim | lower %}
        {% set value_field = states('input_text.hpvc_pv' ~ i ~ '_value_field') | trim %}
        {% set fixed_data = states('input_text.hpvc_pv' ~ i ~ '_fixed_data_json') | from_json(default=none) %}
        {% set target_data = states('input_text.hpvc_pv' ~ i ~ '_target_json') | from_json(default=none) %}
        {% set pre_actions = states('input_text.hpvc_pv' ~ i ~ '_pre_actions_json') | from_json(default=none) %}
        {% set post_actions = states('input_text.hpvc_pv' ~ i ~ '_post_actions_json') | from_json(default=none) %}
        {% set action_step = states('input_number.hpvc_pv' ~ i ~ '_action_step') | float(-1) %}
        {% set refresh_seconds = states('input_number.hpvc_pv' ~ i ~ '_refresh_seconds') | float(-1) %}
        {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit') | float(0) %}
        {% set low = states('input_number.hpvc_pv' ~ i ~ '_low_limit') | float(-1) %}

        {% if method not in ['Number entity', 'Action/service'] or unit not in ['Watts', 'Percent'] %}
          {% set ns.valid = false %}
        {% endif %}

        {% if method == 'Number entity' %}
          {% if limit_ent in bad or not (limit_ent | regex_match('^number[.][a-z0-9_]+$')) %}
            {% set ns.valid = false %}
          {% elif limit_ent in ns.inverter_entities %}
            {% set ns.valid = false %}
          {% else %}
            {% set ns.inverter_entities = ns.inverter_entities + [limit_ent] %}
          {% endif %}
        {% elif method == 'Action/service' %}
          {% if not (action | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or value_field == '' %}
            {% set ns.valid = false %}
          {% endif %}
          {% if fixed_data is not mapping or target_data is not mapping %}
            {% set ns.valid = false %}
          {% endif %}
          {% if pre_actions is not sequence or pre_actions is string or post_actions is not sequence or post_actions is string %}
            {% set ns.valid = false %}
          {% else %}
            {% for step in pre_actions %}
              {% if step is not mapping or step.get('action', '') is not string or not (step.get('action', '') | trim | lower | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) %}
                {% set ns.valid = false %}
              {% endif %}
            {% endfor %}
            {% for step in post_actions %}
              {% if step is not mapping or step.get('action', '') is not string or not (step.get('action', '') | trim | lower | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) %}
                {% set ns.valid = false %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if readback_ent not in bad and not (readback_ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) %}
            {% set ns.valid = false %}
          {% endif %}
          {% if action_step < 0 or refresh_seconds < 0 %}
            {% set ns.valid = false %}
          {% endif %}
          {% if unit == 'Percent' and action_step > 100 %}
            {% set ns.valid = false %}
          {% elif unit == 'Watts' and full > 0 and action_step > full %}
            {% set ns.valid = false %}
          {% endif %}
        {% endif %}

        {% if full <= 0 or full > 10000 or low < 0 or low > 10000 or low >= full %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}
      {{ ns.valid }}
  - name: HPVC Required Inputs Ready
    unique_id: hpvc_required_inputs_ready
    icon: mdi:check-network-outline
    state: >-
      {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
      {% set ns = namespace(ready=is_state('binary_sensor.hpvc_configuration_valid', 'on'), usable=0) %}
      {% set night_restore = states('input_text.hpvc_status') in ['Night Restore', 'Night Restore pending'] %}
      {% set core = [
        states('input_text.hpvc_grid_power_sensor'),
        states('input_text.hpvc_market_price_sensor'),
        states('input_text.hpvc_all_in_price_sensor')
      ] %}
      {% for ent in core %}
        {% if ent in bad or not (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or not is_number(states(ent)) %}
          {% set ns.ready = false %}
        {% endif %}
      {% endfor %}
      {% if not night_restore %}
        {% set ent = states('input_text.hpvc_pv_power_sensor') | trim %}
        {% if ent in bad or not (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or not is_number(states(ent)) %}
          {% set ns.ready = false %}
        {% endif %}
      {% endif %}
      {% set count = states('input_number.hpvc_inverter_count') | int(0) %}
      {% if count < 1 or count > 10 %}{% set ns.ready = false %}{% endif %}
      {% if not night_restore %}
        {% for i in range(1, count + 1) %}
          {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') | trim %}
          {% set limit_ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') | trim | lower %}
          {% set readback_ent = states('input_text.hpvc_pv' ~ i ~ '_readback_entity') | trim | lower %}
          {% if method == 'Number entity' %}
            {% if limit_ent not in bad and (limit_ent | regex_match('^number[.][a-z0-9_]+$')) and is_number(states(limit_ent)) %}
              {% set ns.usable = ns.usable + 1 %}
            {% endif %}
          {% elif method == 'Action/service' %}
            {% if readback_ent in ['', 'select_entity_first'] or ((readback_ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(readback_ent))) %}
              {% set ns.usable = ns.usable + 1 %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if ns.usable == 0 %}{% set ns.ready = false %}{% endif %}
      {% endif %}
      {{ ns.ready }}
    attributes:
      unavailable_entities: >-
        {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
        {% set ns = namespace(items=[]) %}
        {% if not is_state('binary_sensor.hpvc_configuration_valid', 'on') %}
          {% set ns.items = ns.items + ['configuration'] %}
        {% endif %}
        {% set night_restore = states('input_text.hpvc_status') in ['Night Restore', 'Night Restore pending'] %}
        {% set core = [
          states('input_text.hpvc_grid_power_sensor'),
          states('input_text.hpvc_market_price_sensor'),
          states('input_text.hpvc_all_in_price_sensor')
        ] %}
        {% for ent in core %}
          {% if ent in bad or not (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or not is_number(states(ent)) %}
            {% set ns.items = ns.items + [ent if ent not in bad else 'unconfigured core sensor'] %}
          {% endif %}
        {% endfor %}
        {% if not night_restore %}
          {% set ent = states('input_text.hpvc_pv_power_sensor') | trim %}
          {% if ent in bad or not (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or not is_number(states(ent)) %}
            {% set ns.items = ns.items + [ent if ent not in bad else 'unconfigured PV sensor'] %}
          {% endif %}
        {% endif %}
        {% set count = states('input_number.hpvc_inverter_count') | int(0) %}
        {% if not night_restore %}
          {% for i in range(1, count + 1) %}
            {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') | trim %}
            {% set limit_ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') | trim | lower %}
            {% set readback_ent = states('input_text.hpvc_pv' ~ i ~ '_readback_entity') | trim | lower %}
            {% if method == 'Number entity' %}
              {% if limit_ent in bad or not (limit_ent | regex_match('^number[.][a-z0-9_]+$')) or not is_number(states(limit_ent)) %}
                {% set ns.items = ns.items + [limit_ent if limit_ent not in bad else 'PV' ~ i ~ ' limit'] %}
              {% endif %}
            {% elif method == 'Action/service' and readback_ent not in bad %}
              {% if not (readback_ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or not is_number(states(readback_ent)) %}
                {% set ns.items = ns.items + [readback_ent] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.items | unique | join(', ') }}
  - name: HPVC HBC Available
    unique_id: hpvc_hbc_available
    icon: mdi:battery-check
    state: >-
      {% set strategy = 'input_select.house_battery_strategy' %}
      {% set executing = 'input_text.house_battery_strategy_active_sub_strategy' %}
      {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
      {% set options = state_attr(strategy, 'options') %}
      {{ states(strategy) not in bad and options is sequence and options is not string
      and options | count > 0 and states(executing) not in bad }}
  - name: HPVC External Release Active
    unique_id: hpvc_external_release_active
    icon: mdi:solar-power-variant
    state: >-
      {{ is_state('input_boolean.hpvc_external_release_request', 'on')
         and is_state('input_text.hpvc_status', 'External PV release active')
         and is_state('input_boolean.hpvc_enabled', 'on')
         and is_state('input_boolean.hpvc_external_release_lease_valid', 'on')
         and is_state('binary_sensor.hpvc_required_inputs_ready', 'on')
         and is_state('input_boolean.hpvc_auto_resume_pending', 'off') }}
  - name: HPVC PV Limited
    unique_id: hpvc_pv_limited
    icon: mdi:solar-power-variant
    state: >-
      {% set bad = ['unknown','unavailable','none','select_entity_first',''] %}
      {% set count = states('input_number.hpvc_inverter_count') | int(1) %}
      {% set db = states('input_number.hpvc_pv_adjust_deadband') | float(25) %}
      {% set debug = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {% set ns = namespace(limited=debug.get('lim', false)) %}
      {% for i in range(1, count + 1) %}
        {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') %}
        {% set unit = states('input_select.hpvc_pv' ~ i ~ '_limit_unit') %}
        {% set ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv' ~ i ~ '_readback_entity') %}
        {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit') | float(0) %}
        {% if ent not in bad and full > 0 and is_number(states(ent)) %}
          {% set raw = states(ent) | float(0) %}
          {% set current = (raw / 100 * full) if unit == 'Percent' else raw %}
          {% if current < (full - db) %}{% set ns.limited = true %}{% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.limited }}
  - name: HPVC Charge Priority Active
    unique_id: hpvc_charge_priority_active
    icon: mdi:battery-charging-high
    state: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {{ data.get('cps', 'a' if data.get('cp', false) else 'o') == 'a' }}
  - name: HPVC Cooldown Active
    unique_id: hpvc_cooldown_active
    icon: mdi:timer-sand
    state: '{% set data = states(''input_text.hpvc_last_targets_json'') | from_json(default={})
      %} {{ data.get(''cd'', false) }}

      '
  - name: HPVC Negative Price Mode
    unique_id: hpvc_negative_price_mode
    icon: mdi:cash-minus
    state: >-
      {% set ent = states('input_text.hpvc_all_in_price_sensor') | trim %}
      {% set enabled = is_state('input_boolean.hpvc_enabled', 'on') %}
      {% set valid = is_state('binary_sensor.hpvc_configuration_valid', 'on') %}
      {% if not enabled or not valid or ent in ['unknown', 'unavailable', 'select_entity_first', ''] %}
        false
      {% else %}
        {{ states(ent) | float(999) <= 0 }}
      {% endif %}
  - name: HPVC At Minimum PV
    unique_id: hpvc_at_minimum_pv
    icon: mdi:solar-power-variant-outline
    state: >-
      {% set bad = ['unknown','unavailable','none','select_entity_first',''] %}
      {% set count = states('input_number.hpvc_inverter_count') | int(1) %}
      {% set min_tol = 1 %}
      {% set debug = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {% set ns = namespace(any=false, all_min=true, missing=false) %}
      {% for i in range(1, count + 1) %}
        {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') %}
        {% set unit = states('input_select.hpvc_pv' ~ i ~ '_limit_unit') %}
        {% set ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv' ~ i ~ '_readback_entity') %}
        {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit') | float(0) %}
        {% set low = states('input_number.hpvc_pv' ~ i ~ '_low_limit') | float(0) %}
        {% if ent not in bad and full > 0 and is_number(states(ent)) %}
          {% set ns.any = true %}
          {% set raw = states(ent) | float(0) %}
          {% set current = (raw / 100 * full) if unit == 'Percent' else raw %}
          {% if ((current - low) | abs) >= min_tol %}{% set ns.all_min = false %}{% endif %}
        {% elif method == 'Action/service' %}
          {% set ns.missing = true %}
        {% endif %}
      {% endfor %}
      {% if ns.missing %}
        {{ debug.get('am', false) and ns.all_min }}
      {% else %}
        {{ ns.any and ns.all_min }}
      {% endif %}
- sensor:
  - name: HPVC Charge Priority State
    unique_id: hpvc_charge_priority_state
    icon: mdi:battery-sync-outline
    state: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {% set code = data.get('cps', 'a' if data.get('cp', false) else 'o') %}
      {{ {'a':'Active', 'w':'Waiting', 'r':'Requested', 'o':'Off'}.get(code, 'Off') }}
    attributes:
      requested: >-
        {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
        {{ data.get('cps', 'a' if data.get('cp', false) else 'o') in ['a','w','r'] }}
      operational: >-
        {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
        {{ data.get('cps', 'a' if data.get('cp', false) else 'o') == 'a' }}
script:
  hpvc_previous_inverter:
    alias: HPVC Previous Inverter
    mode: restart
    sequence:
      - variables:
          current: >-
            {{ states('input_select.hpvc_selected_inverter') | replace('PV', '') | int(1) }}
          count: >-
            {% set configured = states('input_number.hpvc_inverter_count') | int(1) %} {{ 1 if configured < 1 else 10 if configured > 10 else configured }}
          target: >-
            {{ count if current <= 1 or current > count else current - 1 }}
      - service: input_select.select_option
        target:
          entity_id: input_select.hpvc_selected_inverter
        data:
          option: "PV{{ target }}"

  hpvc_next_inverter:
    alias: HPVC Next Inverter
    mode: restart
    sequence:
      - variables:
          current: >-
            {{ states('input_select.hpvc_selected_inverter') | replace('PV', '') | int(1) }}
          count: >-
            {% set configured = states('input_number.hpvc_inverter_count') | int(1) %} {{ 1 if configured < 1 else 10 if configured > 10 else configured }}
          target: >-
            {{ 1 if current < 1 or current >= count else current + 1 }}
      - service: input_select.select_option
        target:
          entity_id: input_select.hpvc_selected_inverter
        data:
          option: "PV{{ target }}"

  hpvc_restore_defaults:
    alias: Restore defaults
    mode: single
    sequence:
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_limiting_price
      data:
        value: 0.0
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_battery_price_hysteresis
      data:
        value: 0.02
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_export_start_threshold
      data:
        value: -150
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_export_stop_threshold
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_import_restore_threshold
      data:
        value: 150
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_min_power_for_control
      data:
        value: 100
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_night_restore_power
      data:
        value: 10
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_cooldown_seconds
      data:
        value: 30
    - service: input_number.set_value
      target:
        entity_id: input_number.hpvc_pv_adjust_deadband
      data:
        value: 25
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.hpvc_negative_price_hbc_charge
    - service: input_button.press
      target:
        entity_id: input_button.hpvc_defaults_restored_event

automation:
- id: hpvc_external_release_lease_watchdog
  alias: HPVC External Release Lease Watchdog
  mode: restart
  trigger:
    - platform: time_pattern
      seconds: '/15'
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.hpvc_external_release_lease_valid
      state: 'on'
    - condition: template
      value_template: >-
        {% set now_s = as_timestamp(now()) | float(0) %}
        {% set hb = states('input_number.hpvc_engine_heartbeat_epoch') | float(0) %}
        {% set verified = states('input_number.hpvc_external_release_verified_epoch') | float(0) %}
        {{ hb <= 0 or verified <= 0 or (now_s - hb) > 45 or (now_s - verified) > 45 }}
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hpvc_external_release_lease_valid
- id: hpvc_keep_selected_inverter_in_range
  alias: HPVC - Keep selected inverter in range
  mode: restart
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id:
    - input_number.hpvc_inverter_count
    - input_select.hpvc_selected_inverter
  condition:
  - condition: template
    value_template: >-
      {{ states('input_number.hpvc_inverter_count') not in ['unknown', 'unavailable', 'none', '']
         and states('input_select.hpvc_selected_inverter') not in ['unknown', 'unavailable', 'none', ''] }}
  action:
  - variables:
      count: >-
        {% set configured = states('input_number.hpvc_inverter_count') | int(1) %}
        {{ 1 if configured < 1 else 10 if configured > 10 else configured }}
      current: >-
        {{ states('input_select.hpvc_selected_inverter') | replace('PV', '') | int(1) }}
  - condition: template
    value_template: "{{ current < 1 or current > count }}"
  - service: input_select.select_option
    target:
      entity_id: input_select.hpvc_selected_inverter
    data:
      option: "PV{{ count }}"

- id: hpvc_seed_negative_price_hbc_charge_default
  alias: HPVC - Seed negative-price HBC charging default
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  - platform: time_pattern
    minutes: /1
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_negative_price_hbc_charge_default_applied
    state: 'off'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_negative_price_hbc_charge
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_negative_price_hbc_charge_default_applied

- id: hpvc_apply_recommended_defaults_on_first_install
  alias: HPVC - Apply recommended defaults on first install
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: input_boolean.hpvc_defaults_applied
    to: 'off'
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'off'
  action:
  - delay: 00:00:10
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'off'
  - service: input_boolean.turn_on
    target:
      entity_id:
      - input_boolean.hpvc_notifications
      - input_boolean.hpvc_negative_price_hbc_charge
  - service: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.hpvc_enabled
      - input_boolean.hpvc_control_hbc_strategy
      - input_boolean.hpvc_onboarding_complete
      - input_boolean.hpvc_auto_resume_pending
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_limiting_price
    data:
      value: 0.0
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_battery_price_hysteresis
    data:
      value: 0.02
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_export_start_threshold
    data:
      value: -150
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_export_stop_threshold
    data:
      value: 0
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_import_restore_threshold
    data:
      value: 150
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_min_power_for_control
    data:
      value: 100
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_night_restore_power
    data:
      value: 10
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_cooldown_seconds
    data:
      value: 30
  - service: input_number.set_value
    target:
      entity_id: input_number.hpvc_pv_adjust_deadband
    data:
      value: 25
  - service: input_boolean.turn_on
    target:
      entity_id:
      - input_boolean.hpvc_negative_price_hbc_charge_default_applied
      - input_boolean.hpvc_defaults_applied


- id: hpvc_complete_first_install_configuration
  alias: HPVC - Complete first-install configuration
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: binary_sensor.hpvc_configuration_valid
    to: 'on'
  - platform: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    to: 'on'
  - platform: state
    entity_id: input_boolean.hpvc_defaults_applied
    to: 'on'
  - platform: state
    entity_id: input_boolean.hpvc_onboarding_complete
    to: 'off'
  condition:
  - condition: state
    entity_id: binary_sensor.hpvc_configuration_valid
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_onboarding_complete
    state: 'off'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_notifications
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_onboarding_complete
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_auto_resume_pending
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_enabled

- id: hpvc_disable_when_required_inputs_invalid
  alias: HPVC - Disable when required inputs are invalid
  description: Turns off the HPVC master control when a required live input or configuration value is invalid and remembers whether HPVC should resume.
  mode: restart
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    to: 'off'
  - platform: state
    entity_id: input_boolean.hpvc_enabled
    to: 'on'
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_onboarding_complete
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    state: 'off'
  - condition: state
    entity_id: input_boolean.hpvc_enabled
    state: 'on'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_auto_resume_pending
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_enabled

- id: hpvc_resume_when_required_inputs_recover
  alias: HPVC - Resume when required inputs recover
  description: Re-enables HPVC only after configuration and all required live inputs have remained valid for 5 continuous seconds, and only when HPVC was automatically disabled by a fault.
  mode: restart
  trigger:
  - platform: homeassistant
    event: start
  - platform: state
    entity_id:
    - binary_sensor.hpvc_configuration_valid
    - binary_sensor.hpvc_required_inputs_ready
  - platform: state
    entity_id: input_boolean.hpvc_auto_resume_pending
    to: 'on'
  condition:
  - condition: state
    entity_id: input_boolean.hpvc_defaults_applied
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_onboarding_complete
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_auto_resume_pending
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_configuration_valid
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    state: 'on'
  action:
  - delay: 00:00:05
  - condition: state
    entity_id: binary_sensor.hpvc_configuration_valid
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hpvc_required_inputs_ready
    state: 'on'
  - condition: state
    entity_id: input_boolean.hpvc_auto_resume_pending
    state: 'on'
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.hpvc_enabled
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_auto_resume_pending

- id: hpvc_cancel_auto_resume_on_manual_disable
  alias: HPVC - Cancel automatic resume after manual switch-off
  description: Clears the automatic-resume latch when a user manually switches HPVC off.
  mode: restart
  trigger:
  - platform: state
    entity_id: input_boolean.hpvc_enabled
    to: 'off'
  condition:
  - condition: template
    value_template: "{{ trigger.to_state.context.user_id is not none }}"
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_auto_resume_pending

- id: hpvc_reset_report_after_view
  alias: HPVC - Reset report after viewing
  description: Resets the report tile to Generate report when the generated HTML report is opened.
  mode: restart
  trigger:
  - platform: webhook
    webhook_id: hpvc_report_viewed_141
    allowed_methods:
    - POST
    local_only: true
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.hpvc_report_ready
