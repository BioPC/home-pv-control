- binary_sensor:
  - name: HPVC Configuration Valid
    default_entity_id: binary_sensor.hpvc_configuration_valid
    unique_id: hpvc_configuration_valid
    icon: mdi:check-decagram-outline
    state: >-
      {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
      {% set core = [
        states('input_text.hpvc_grid_power_sensor') | trim | lower,
        states('input_text.hpvc_market_price_sensor') | trim | lower,
        states('input_text.hpvc_all_in_price_sensor') | trim | lower,
        states('input_text.hpvc_pv_power_sensor') | trim | lower
      ] %}
      {% set ns = namespace(valid=true, inverter_entities=[]) %}
      {% for ent in core %}
        {% if ent in bad or not (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}

      {% set numeric_helpers = [
        'input_number.hpvc_pv_limiting_price',
        'input_number.hpvc_battery_price_hysteresis',
        'input_number.hpvc_export_start_threshold',
        'input_number.hpvc_export_stop_threshold',
        'input_number.hpvc_import_restore_threshold',
        'input_number.hpvc_pv_min_power_for_control',
        'input_number.hpvc_pv_night_restore_power',
        'input_number.hpvc_cooldown_seconds',
        'input_number.hpvc_pv_adjust_deadband',
        'input_number.hpvc_inverter_count'
      ] %}
      {% for helper in numeric_helpers %}
        {% if not is_number(states(helper)) %}{% set ns.valid = false %}{% endif %}
      {% endfor %}

      {% set limiting_price = states('input_number.hpvc_pv_limiting_price') | float(999999) %}
      {% set export_start = states('input_number.hpvc_export_start_threshold') | float(999999) %}
      {% set target_export = states('input_number.hpvc_export_stop_threshold') | float(999999) %}
      {% set import_restore = states('input_number.hpvc_import_restore_threshold') | float(-1) %}
      {% set hysteresis = states('input_number.hpvc_battery_price_hysteresis') | float(-1) %}
      {% set minimum_pv = states('input_number.hpvc_pv_min_power_for_control') | float(-1) %}
      {% set night_pv = states('input_number.hpvc_pv_night_restore_power') | float(-1) %}
      {% set cooldown = states('input_number.hpvc_cooldown_seconds') | float(-1) %}
      {% set deadband = states('input_number.hpvc_pv_adjust_deadband') | float(-1) %}
      {% if not (
        -0.50 <= limiting_price <= 0.20
        and 0 <= hysteresis <= 0.10
        and -5000 <= export_start <= 0
        and -5000 <= target_export <= 500
        and 0 <= import_restore <= 5000
        and export_start < target_export < import_restore
        and 0 <= minimum_pv <= 5000
        and 0 <= night_pv <= 1000
        and 10 <= cooldown <= 60
        and 1 <= deadband <= 500
      ) %}
        {% set ns.valid = false %}
      {% endif %}

      {% set count_raw = states('input_number.hpvc_inverter_count') | float(0) %}
      {% set count = states('input_number.hpvc_inverter_count') | int(0) %}
      {% set inv = namespace(valid_paths=0, number_entities=[]) %}
      {% if count < 0 or count > 10 %}
        {% set ns.valid = false %}
      {% else %}
        {% for i in range(1, count + 1) %}
          {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') | trim %}
          {% set unit = states('input_select.hpvc_pv' ~ i ~ '_limit_unit') | trim %}
          {% set full = states('input_number.hpvc_pv' ~ i ~ '_full_limit') | float(0) %}
          {% set low = states('input_number.hpvc_pv' ~ i ~ '_low_limit') | float(-1) %}
          {% set base_valid = method in ['Number entity', 'Action/service']
            and unit in ['Watts', 'Percent']
            and full > 0 and full <= 10000
            and low >= 0 and low <= 10000
            and low < full %}
          {% if method == 'Number entity' %}
            {% set ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') | trim | lower %}
            {% set ent_exists = states | selectattr('entity_id', 'eq', ent) | list | count > 0 %}
            {% set path_valid = base_valid
              and ent not in bad
              and (ent | regex_match('^number[.][a-z0-9_]+$'))
              and ent_exists
              and ent not in inv.number_entities %}
            {% if path_valid %}
              {% set inv.valid_paths = inv.valid_paths + 1 %}
              {% set inv.number_entities = inv.number_entities + [ent] %}
            {% endif %}
          {% elif method == 'Action/service' %}
            {% set action = states('input_text.hpvc_pv' ~ i ~ '_action') | trim | lower %}
            {% set value_field = states('input_text.hpvc_pv' ~ i ~ '_value_field') | trim %}
            {% set readback = states('input_text.hpvc_pv' ~ i ~ '_readback_entity') | trim | lower %}
            {% set readback_exists = readback not in ['', 'select_entity_first']
              and (states | selectattr('entity_id', 'eq', readback) | list | count > 0) %}
            {% set path_valid = base_valid
              and (action | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$'))
              and value_field != ''
              and (readback in ['', 'select_entity_first']
                or ((readback | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and readback_exists)) %}
            {% if path_valid %}
              {% set inv.valid_paths = inv.valid_paths + 1 %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {# Safety-critical validation discovers native DPEL directly instead of depending on another template entity's startup order. #}
        {% set enphase = namespace(count=0) %}
        {# Registry pairs are shared by the independent Node-RED registry refresh. #}
        {% set dp = namespace(candidates=state_attr('sensor.hpvc_enphase_registry', 'controllers') or [], seen=[]) %}
        {% set registry_entities = state_attr('sensor.hpvc_enphase_registry', 'registry_entities') or [] %}
        {% for ent in states.number | map(attribute='entity_id') | list | sort %}
          {% if ent | regex_match('^number[.].+_dpel_limit$') and ent not in registry_entities %}
            {% set stem = ent | replace('number.', '') | replace('_dpel_limit', '') %}
            {% set enable = 'switch.' ~ stem ~ '_dpel_enabled' %}
            {% set mode = 'select.' ~ stem ~ '_dpel_mode' %}
            {% if enable not in registry_entities and mode not in registry_entities %}
              {% set dp.candidates = dp.candidates + [dict(limit_entity=ent, enable_entity=enable, mode_entity=mode)] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% for controller in dp.candidates %}
          {% set ent = controller.limit_entity %}
          {% set enable = controller.enable_entity %}
          {% set mode = controller.mode_entity %}
          {% set opts = state_attr(mode, 'options') or [] %}
          {% if ent not in dp.seen and (states | selectattr('entity_id', 'eq', ent) | list | count > 0)
              and (states | selectattr('entity_id', 'eq', enable) | list | count > 0)
              and (states | selectattr('entity_id', 'eq', mode) | list | count > 0)
              and 'Production' in opts and 'Export' in opts %}
            {% set dp.seen = dp.seen + [ent] %}
            {% set enphase.count = enphase.count + 1 %}
          {% endif %}
        {% endfor %}
        {% set opendtu = namespace(count=0, seen=[]) %}
        {% set registry_entities = state_attr('sensor.hpvc_enphase_registry', 'registry_entities') or [] %}
        {% set od_candidates = state_attr('sensor.hpvc_enphase_registry', 'opendtu_controllers') or [] %}
        {% for controller in od_candidates %}
          {% set ent = controller.limit_entity %}
          {% set unit = state_attr(ent, 'unit_of_measurement') | default('', true) | lower %}
          {% if ent not in opendtu.seen and is_number(states(ent)) and unit in ['w','watt','watts'] and state_attr(ent, 'max') | float(0) > 0 %}
            {% set opendtu.seen = opendtu.seen + [ent] %}{% set opendtu.count = opendtu.count + 1 %}
          {% endif %}
        {% endfor %}
        {% for ent in states.number | map(attribute='entity_id') | list | sort %}
          {% if ent | regex_match('^number[.].+_limit_nonpersistent_absolute$') and ent not in registry_entities and ent not in opendtu.seen %}
            {% set unit = state_attr(ent, 'unit_of_measurement') | default('', true) | lower %}
            {% if unit in ['w','watt','watts'] and state_attr(ent, 'max') | float(0) > 0 %}
              {% set opendtu.seen = opendtu.seen + [ent] %}{% set opendtu.count = opendtu.count + 1 %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if count > 0 and inv.valid_paths == 0 and enphase.count == 0 and opendtu.count == 0 %}
          {% set ns.valid = false %}
        {% endif %}
      {% endif %}

      {{ ns.valid }}
  - name: HPVC Core Inputs Ready
    default_entity_id: binary_sensor.hpvc_core_inputs_ready
    unique_id: hpvc_core_inputs_ready
    icon: mdi:check-network-outline
    state: >-
      {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
      {% set ns = namespace(ready=is_state('binary_sensor.hpvc_configuration_valid', 'on')) %}
      {% set core = [
        states('input_text.hpvc_grid_power_sensor') | trim | lower,
        states('input_text.hpvc_market_price_sensor') | trim | lower,
        states('input_text.hpvc_all_in_price_sensor') | trim | lower,
        states('input_text.hpvc_pv_power_sensor') | trim | lower
      ] %}
      {% for ent in core %}
        {% set exists = ent not in bad
          and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$'))
          and (states | selectattr('entity_id', 'eq', ent) | list | count > 0) %}
        {% if not exists or not is_number(states(ent)) %}{% set ns.ready = false %}{% endif %}
      {% endfor %}
      {{ ns.ready }}
  - name: HPVC Required Inputs Ready
    default_entity_id: binary_sensor.hpvc_required_inputs_ready
    unique_id: hpvc_required_inputs_ready
    icon: mdi:check-network-outline
    state: >-
      {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
      {% set ns = namespace(ready=is_state('binary_sensor.hpvc_configuration_valid', 'on'), usable=0, configured_usable=0) %}
      {% set night_restore = states('input_text.hpvc_status') in ['Night Restore', 'Night Restore pending'] %}
      {% set core = [
        states('input_text.hpvc_grid_power_sensor'),
        states('input_text.hpvc_market_price_sensor'),
        states('input_text.hpvc_all_in_price_sensor')
      ] %}
      {% for ent in core %}
        {% if ent in bad or not (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or not is_number(states(ent)) %}
          {% set ns.ready = false %}
        {% endif %}
      {% endfor %}

      {# The configured solar entity must always exist, even during Night Restore. #}
      {# Night Restore relaxes live numeric telemetry only; it must not hide a mistyped entity ID. #}
      {% set pv_ent = states('input_text.hpvc_pv_power_sensor') | trim | lower %}
      {% set pv_exists = states | selectattr('entity_id', 'eq', pv_ent) | list | count > 0 %}
      {% set pv_configured = pv_ent not in bad
        and (pv_ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$'))
        and pv_exists %}
      {% if not pv_configured %}
        {% set ns.ready = false %}
      {% elif not night_restore and not is_number(states(pv_ent)) %}
        {% set ns.ready = false %}
      {% endif %}

      {% set count = states('input_number.hpvc_inverter_count') | int(0) %}
      {% if count < 0 or count > 10 %}{% set ns.ready = false %}{% endif %}
      {% for i in range(1, count + 1) %}
        {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') | trim %}
        {% set limit_ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') | trim | lower %}
        {% set readback_ent = states('input_text.hpvc_pv' ~ i ~ '_readback_entity') | trim | lower %}
        {% if method == 'Number entity' %}
          {% set limit_exists = states | selectattr('entity_id', 'eq', limit_ent) | list | count > 0 %}
          {% set configured_path = limit_ent not in bad
            and (limit_ent | regex_match('^number[.][a-z0-9_]+$'))
            and limit_exists %}
          {% if configured_path %}
            {% set ns.configured_usable = ns.configured_usable + 1 %}
            {% if is_number(states(limit_ent)) %}
              {% set ns.usable = ns.usable + 1 %}
            {% endif %}
          {% endif %}
        {% elif method == 'Action/service' %}
          {% set readback_exists = readback_ent not in ['', 'select_entity_first']
            and (states | selectattr('entity_id', 'eq', readback_ent) | list | count > 0) %}
          {% set configured_path = readback_ent in ['', 'select_entity_first']
            or ((readback_ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and readback_exists) %}
          {% if configured_path %}
            {% set ns.configured_usable = ns.configured_usable + 1 %}
            {% if readback_ent in ['', 'select_entity_first'] or is_number(states(readback_ent)) %}
              {% set ns.usable = ns.usable + 1 %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}

      {# Native Enphase DPEL controllers are valid runtime paths even when no manual hpvc_pvN helper is populated. #}
      {# Discover them directly here so startup ordering of template entities cannot falsely disable HPVC. #}
      {# Registry pairs are shared by the independent Node-RED registry refresh. #}
      {% set dp = namespace(candidates=state_attr('sensor.hpvc_enphase_registry', 'controllers') or [], seen=[]) %}
      {% set registry_entities = state_attr('sensor.hpvc_enphase_registry', 'registry_entities') or [] %}
      {% for ent in states.number | map(attribute='entity_id') | list | sort %}
        {% if ent | regex_match('^number[.].+_dpel_limit$') and ent not in registry_entities %}
          {% set stem = ent | replace('number.', '') | replace('_dpel_limit', '') %}
          {% set enable = 'switch.' ~ stem ~ '_dpel_enabled' %}
          {% set mode = 'select.' ~ stem ~ '_dpel_mode' %}
          {% if enable not in registry_entities and mode not in registry_entities %}
            {% set dp.candidates = dp.candidates + [dict(limit_entity=ent, enable_entity=enable, mode_entity=mode)] %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% for controller in dp.candidates %}
        {% set ent = controller.limit_entity %}
        {% set enable = controller.enable_entity %}
        {% set mode = controller.mode_entity %}
        {% set opts = state_attr(mode, 'options') or [] %}
        {% if ent not in dp.seen and (states | selectattr('entity_id', 'eq', ent) | list | count > 0)
            and (states | selectattr('entity_id', 'eq', enable) | list | count > 0)
            and (states | selectattr('entity_id', 'eq', mode) | list | count > 0)
            and 'Production' in opts and 'Export' in opts %}
          {% set dp.seen = dp.seen + [ent] %}
          {% set ns.configured_usable = ns.configured_usable + 1 %}
          {% if is_number(states(ent)) %}{% set ns.usable = ns.usable + 1 %}{% endif %}
        {% endif %}
      {% endfor %}

      {# Native OpenDTU/Hoymiles controllers are also valid runtime paths without manual hpvc_pvN helpers. #}
      {% set registry_entities = state_attr('sensor.hpvc_enphase_registry', 'registry_entities') or [] %}
      {% set od = namespace(candidates=state_attr('sensor.hpvc_enphase_registry', 'opendtu_controllers') or [], seen=[]) %}
      {% for ent in states.number | map(attribute='entity_id') | list | sort %}
        {% if ent | regex_match('^number[.].+_limit_nonpersistent_absolute$') and ent not in registry_entities %}
          {% set unit = state_attr(ent, 'unit_of_measurement') | default('', true) | lower %}
          {% if unit in ['w','watt','watts'] and state_attr(ent, 'max') | float(0) > 0 %}{% set od.candidates = od.candidates + [dict(limit_entity=ent)] %}{% endif %}
        {% endif %}
      {% endfor %}
      {% for controller in od.candidates %}
        {% set ent = controller.limit_entity %}
        {% set unit = state_attr(ent, 'unit_of_measurement') | default('', true) | lower %}
        {% if ent not in od.seen and (states | selectattr('entity_id','eq',ent) | list | count > 0) and unit in ['w','watt','watts'] and state_attr(ent,'max') | float(0) > 0 %}
          {% set od.seen = od.seen + [ent] %}
          {% set ns.configured_usable = ns.configured_usable + 1 %}
          {% if is_number(states(ent)) %}{% set ns.usable = ns.usable + 1 %}{% endif %}
        {% endif %}
      {% endfor %}

      {# At least one effective inverter path must really exist at all times. #}
      {# During Night Restore, existing-but-unavailable PV telemetry remains tolerated. #}
      {% if ns.configured_usable == 0 %}{% set ns.ready = false %}{% endif %}
      {% if not night_restore and ns.usable == 0 %}{% set ns.ready = false %}{% endif %}
      {{ ns.ready }}
    attributes:
      unavailable_entities: >-
        {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
        {% set ns = namespace(items=[]) %}
        {% if not is_state('binary_sensor.hpvc_configuration_valid', 'on') %}
          {% set ns.items = ns.items + ['configuration'] %}
        {% endif %}
        {% set night_restore = states('input_text.hpvc_status') in ['Night Restore', 'Night Restore pending'] %}
        {% set core = [
          states('input_text.hpvc_grid_power_sensor'),
          states('input_text.hpvc_market_price_sensor'),
          states('input_text.hpvc_all_in_price_sensor')
        ] %}
        {% for ent in core %}
          {% if ent in bad or not (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or not is_number(states(ent)) %}
            {% set ns.items = ns.items + [ent if ent not in bad else 'unconfigured core sensor'] %}
          {% endif %}
        {% endfor %}

        {% set pv_ent = states('input_text.hpvc_pv_power_sensor') | trim | lower %}
        {% set pv_exists = states | selectattr('entity_id', 'eq', pv_ent) | list | count > 0 %}
        {% set pv_configured = pv_ent not in bad
          and (pv_ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$'))
          and pv_exists %}
        {% if not pv_configured %}
          {% set ns.items = ns.items + [pv_ent if pv_ent not in bad else 'unconfigured PV sensor'] %}
        {% elif not night_restore and not is_number(states(pv_ent)) %}
          {% set ns.items = ns.items + [pv_ent] %}
        {% endif %}

        {% set count = states('input_number.hpvc_inverter_count') | int(0) %}
        {% set inv = namespace(configured_usable=0) %}
        {% for i in range(1, count + 1) %}
          {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') | trim %}
          {% set limit_ent = states('input_text.hpvc_pv' ~ i ~ '_limit_number') | trim | lower %}
          {% set readback_ent = states('input_text.hpvc_pv' ~ i ~ '_readback_entity') | trim | lower %}
          {% if method == 'Number entity' %}
            {% set limit_exists = states | selectattr('entity_id', 'eq', limit_ent) | list | count > 0 %}
            {% set configured_path = limit_ent not in bad
              and (limit_ent | regex_match('^number[.][a-z0-9_]+$'))
              and limit_exists %}
            {% if configured_path %}
              {% set inv.configured_usable = inv.configured_usable + 1 %}
              {% if not night_restore and not is_number(states(limit_ent)) %}
                {% set ns.items = ns.items + [limit_ent] %}
              {% endif %}
            {% else %}
              {% set ns.items = ns.items + [limit_ent if limit_ent not in bad else 'PV' ~ i ~ ' limit'] %}
            {% endif %}
          {% elif method == 'Action/service' %}
            {% set readback_exists = readback_ent not in ['', 'select_entity_first']
              and (states | selectattr('entity_id', 'eq', readback_ent) | list | count > 0) %}
            {% set configured_path = readback_ent in ['', 'select_entity_first']
              or ((readback_ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and readback_exists) %}
            {% if configured_path %}
              {% set inv.configured_usable = inv.configured_usable + 1 %}
              {% if not night_restore and readback_ent not in bad and not is_number(states(readback_ent)) %}
                {% set ns.items = ns.items + [readback_ent] %}
              {% endif %}
            {% else %}
              {% set ns.items = ns.items + [readback_ent if readback_ent not in bad else 'PV' ~ i ~ ' readback'] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% set rt = namespace(configured=0) %}
        {# Registry pairs are shared by the independent Node-RED registry refresh. #}
        {% set dp = namespace(candidates=state_attr('sensor.hpvc_enphase_registry', 'controllers') or [], seen=[]) %}
        {% set registry_entities = state_attr('sensor.hpvc_enphase_registry', 'registry_entities') or [] %}
        {% for ent in states.number | map(attribute='entity_id') | list | sort %}
          {% if ent | regex_match('^number[.].+_dpel_limit$') and ent not in registry_entities %}
            {% set stem = ent | replace('number.', '') | replace('_dpel_limit', '') %}
            {% set enable = 'switch.' ~ stem ~ '_dpel_enabled' %}
            {% set mode = 'select.' ~ stem ~ '_dpel_mode' %}
            {% if enable not in registry_entities and mode not in registry_entities %}
              {% set dp.candidates = dp.candidates + [dict(limit_entity=ent, enable_entity=enable, mode_entity=mode)] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% for controller in dp.candidates %}
          {% set ent = controller.limit_entity %}
          {% set enable = controller.enable_entity %}
          {% set mode = controller.mode_entity %}
          {% set opts = state_attr(mode, 'options') or [] %}
          {% if ent not in dp.seen and (states | selectattr('entity_id', 'eq', ent) | list | count > 0)
              and (states | selectattr('entity_id', 'eq', enable) | list | count > 0)
              and (states | selectattr('entity_id', 'eq', mode) | list | count > 0)
              and 'Production' in opts and 'Export' in opts %}
            {% set dp.seen = dp.seen + [ent] %}
            {% set rt.configured = rt.configured + 1 %}
            {% if not night_restore and not is_number(states(ent)) %}{% set ns.items = ns.items + [ent] %}{% endif %}
          {% endif %}
        {% endfor %}
        {% set odrt = namespace(configured=0, seen=[]) %}
        {% set od_candidates = state_attr('sensor.hpvc_enphase_registry', 'opendtu_controllers') or [] %}
        {% set registry_entities = state_attr('sensor.hpvc_enphase_registry', 'registry_entities') or [] %}
        {% for controller in od_candidates %}
          {% set ent = controller.limit_entity %}
          {% set unit = state_attr(ent, 'unit_of_measurement') | default('', true) | lower %}
          {% if ent not in odrt.seen and (states | selectattr('entity_id','eq',ent) | list | count > 0) and unit in ['w','watt','watts'] and state_attr(ent,'max') | float(0) > 0 %}
            {% set odrt.seen = odrt.seen + [ent] %}{% set odrt.configured = odrt.configured + 1 %}
            {% if not night_restore and not is_number(states(ent)) %}{% set ns.items = ns.items + [ent] %}{% endif %}
          {% endif %}
        {% endfor %}
        {% for ent in states.number | map(attribute='entity_id') | list | sort %}
          {% if ent | regex_match('^number[.].+_limit_nonpersistent_absolute$') and ent not in registry_entities and ent not in odrt.seen %}
            {% set unit = state_attr(ent, 'unit_of_measurement') | default('', true) | lower %}
            {% if unit in ['w','watt','watts'] and state_attr(ent,'max') | float(0) > 0 %}
              {% set odrt.seen = odrt.seen + [ent] %}{% set odrt.configured = odrt.configured + 1 %}
              {% if not night_restore and not is_number(states(ent)) %}{% set ns.items = ns.items + [ent] %}{% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if inv.configured_usable == 0 and rt.configured == 0 and odrt.configured == 0 %}
          {% set ns.items = ns.items + ['no configured inverter control path exists'] %}
        {% endif %}
        {{ ns.items | unique | join(', ') }}
  - name: HPVC Maintenance Inverter Warning
    default_entity_id: binary_sensor.hpvc_maintenance_inverter_warning
    unique_id: hpvc_maintenance_inverter_warning
    icon: mdi:solar-power-variant-outline
    state: >-
      {% set runtime_raw = state_attr('sensor.hpvc_effective_inverter_runtime', 'runtime_json') %}
      {% set runtime = (runtime_raw | from_json(default=[])) if runtime_raw is string else (runtime_raw if runtime_raw is sequence else []) %}
      {% set ns = namespace(missing=0) %}
      {% for entry in runtime %}
        {% set parts = entry.split('|') %}
        {% if parts | count < 6 or parts[4] == 'manual-invalid' %}
          {% set ns.missing = ns.missing + 1 %}
        {% elif parts[4] == 'enphase' %}
          {% if parts[0] == '' or not is_number(states(parts[0])) %}{% set ns.missing = ns.missing + 1 %}{% endif %}
        {% elif parts[4] in ['manual-number','opendtu'] %}
          {% set ent = parts[0] %}
          {% if ent == '' or not (ent | regex_match('^number[.][a-z0-9_]+$')) or not is_number(states(ent)) %}{% set ns.missing = ns.missing + 1 %}{% endif %}
        {% elif parts[4] == 'manual-action' %}
          {% set slot = loop.index %}
          {% set action = states('input_text.hpvc_pv' ~ slot ~ '_action') | trim | lower %}
          {% set value_field = states('input_text.hpvc_pv' ~ slot ~ '_value_field') | trim %}
          {% set readback = parts[0] %}
          {% if not (action | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or value_field == '' or readback == '' or not is_number(states(readback)) %}
            {% set ns.missing = ns.missing + 1 %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ runtime | count > 0 and ns.missing > 0 }}
    attributes:
      affected_inverters: >-
        {% set runtime_raw = state_attr('sensor.hpvc_effective_inverter_runtime', 'runtime_json') %}
        {% set runtime = (runtime_raw | from_json(default=[])) if runtime_raw is string else (runtime_raw if runtime_raw is sequence else []) %}
        {% set ns = namespace(items=[]) %}
        {% for entry in runtime %}
          {% set parts = entry.split('|') %}
          {% set bad = false %}
          {% if parts | count < 6 or parts[4] == 'manual-invalid' %}
            {% set bad = true %}
          {% elif parts[4] in ['enphase', 'manual-number'] %}
            {% set bad = parts[0] == '' or not is_number(states(parts[0])) %}
          {% elif parts[4] == 'manual-action' %}
            {% set slot = loop.index %}
            {% set action = states('input_text.hpvc_pv' ~ slot ~ '_action') | trim | lower %}
            {% set value_field = states('input_text.hpvc_pv' ~ slot ~ '_value_field') | trim %}
            {% set bad = not (action | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) or value_field == '' or parts[0] == '' or not is_number(states(parts[0])) %}
          {% endif %}
          {% if bad %}{% set ns.items = ns.items + ['PV' ~ loop.index] %}{% endif %}
        {% endfor %}
        {{ ns.items | join(', ') }}
      verification_unavailable_inverters: >-
        {% set bad = ['unknown', 'unavailable', 'none', 'select_entity_first', ''] %}
        {% set count = states('input_number.hpvc_inverter_count') | int(0) %}
        {% set ns = namespace(items=[]) %}
        {% for i in range(1, count + 1) %}
          {% set method = states('input_select.hpvc_pv' ~ i ~ '_control_method') | trim %}
          {% if method == 'Action/service' %}
            {% set readback = states('input_text.hpvc_pv' ~ i ~ '_readback_entity') | trim | lower %}
            {% set readback_exists = readback not in bad
              and (states | selectattr('entity_id', 'eq', readback) | list | count > 0) %}
            {% set readable = readback not in bad
              and (readback | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$'))
              and readback_exists
              and is_number(states(readback)) %}
            {% if not readable %}{% set ns.items = ns.items + ['PV' ~ i] %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items | join(', ') }}

