template:
- trigger:
  - platform: time_pattern
    seconds: "/30"
  - platform: homeassistant
    event: start
  sensor:
  - name: HPVC Source Freshness
    default_entity_id: sensor.hpvc_source_freshness
    unique_id: hpvc_source_freshness
    icon: mdi:timer-sync-outline
    state: "{{ now().isoformat() }}"
    attributes:
      snapshot_epoch_ms: >-
        {{ (as_timestamp(now(), 0) * 1000) | int }}
      freshness_transport: "ha_template_last_reported_snapshot"
      grid_last_reported_ms: >-
        {% set e = states('input_text.hpvc_grid_power_sensor') | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      market_last_reported_ms: >-
        {% set e = states('input_text.hpvc_market_price_sensor') | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      all_in_last_reported_ms: >-
        {% set e = states('input_text.hpvc_all_in_price_sensor') | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv_last_reported_ms: >-
        {% set e = states('input_text.hpvc_pv_power_sensor') | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv1_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv1_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv1_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv1_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv2_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv2_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv2_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv2_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv3_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv3_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv3_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv3_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv4_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv4_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv4_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv4_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv5_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv5_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv5_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv5_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv6_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv6_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv6_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv6_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv7_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv7_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv7_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv7_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv8_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv8_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv8_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv8_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv9_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv9_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv9_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv9_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
      pv10_last_reported_ms: >-
        {% set method = states('input_select.hpvc_pv10_control_method') | trim %}
        {% set e = (states('input_text.hpvc_pv10_limit_number') if method == 'Number entity' else states('input_text.hpvc_pv10_readback_entity')) | trim | lower %}
        {% set st = states[e] if e | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
        {{ ((as_timestamp(st.last_reported, 0) if st is not none else 0) * 1000) | int }}
- sensor:
  - name: HPVC Installed Version
    default_entity_id: sensor.hpvc_installed_version
    unique_id: hpvc_installed_version
    icon: mdi:tag
    state: "1.5.4"
  # Explicit default_entity_id is intentional for this renamed v1.3.0 sensor so
  # fresh installs use the documented entity ID; other template sensors can derive theirs.
  - name: HPVC Diag Market/Export Price
    default_entity_id: sensor.hpvc_diag_market_export_price
    unique_id: hpvc_diag_market_export_price
    unit_of_measurement: €/kWh
    icon: mdi:cash
    availability: >-
      {% set ent = states('input_text.hpvc_market_price_sensor') %}
      {{ ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(ent)) }}
    state: >-
      {% set ent = states('input_text.hpvc_market_price_sensor') %}
      {{ states(ent) | float }}
  - name: HPVC Diag All In Price
    unique_id: hpvc_diag_all_in_price
    unit_of_measurement: €/kWh
    icon: mdi:cash-multiple
    availability: >-
      {% set ent = states('input_text.hpvc_all_in_price_sensor') %}
      {{ ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(ent)) }}
    state: >-
      {% set ent = states('input_text.hpvc_all_in_price_sensor') %}
      {{ states(ent) | float }}
  - name: HPVC Diag Grid Power
    unique_id: hpvc_diag_grid_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:transmission-tower
    availability: >-
      {% set ent = states('input_text.hpvc_grid_power_sensor') %}
      {{ ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(ent)) }}
    state: >-
      {% set ent = states('input_text.hpvc_grid_power_sensor') %}
      {{ states(ent) | float | round(0) }}
  - name: HPVC Diag PV Power
    unique_id: hpvc_diag_pv_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:solar-power
    availability: >-
      {% set ent = states('input_text.hpvc_pv_power_sensor') %}
      {{ ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', ''] and (ent | regex_match('^[a-z0-9_]+[.][a-z0-9_]+$')) and is_number(states(ent)) }}
    state: >-
      {% set ent = states('input_text.hpvc_pv_power_sensor') %}
      {{ states(ent) | float | round(0) }}
  - name: HPVC Diag HBC Strategy
    unique_id: hpvc_diag_hbc_strategy
    icon: mdi:battery-sync
    state: '{{ states(''input_select.house_battery_strategy'') }}'
  - name: HPVC Total HBC Charging Power
    unique_id: hpvc_total_hbc_charging_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:battery-arrow-down
    state: >-
      {% set count = states('input_number.house_battery_count') | int(0) %}
      {% set ns = namespace(total=0) %}
      {% for i in range(1, [count, 6] | min + 1) %}
        {% set ent = 'sensor.marstek_m' ~ i ~ '_ac_power' %}
        {% if has_value(ent) %}
          {% set power = states(ent) | float(0) %}
          {% if power < 0 %}
            {% set ns.total = ns.total + (power * -1) %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.total | round(0) }}
  - name: HPVC Daily Target Accuracy
    unique_id: hpvc_daily_target_accuracy
    unit_of_measurement: "%"
    icon: mdi:target
    availability: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={})
      %}
      {{ data.get('da', none) is not none }}
    state: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={})
      %}
      {% set value = data.get('da', 0) %}
      {{ [[value | float(0), 0] | max, 100] | min | round(1) }}
  - name: HPVC Daily Target Accuracy Samples
    unique_id: hpvc_daily_target_accuracy_samples
    icon: mdi:counter
    availability: >-
      {% set raw = states('input_text.hpvc_accuracy_diagnostics_json') %}
      {% set data = raw | from_json(default={}) %}
      {{ raw not in ['unknown', 'unavailable', 'none', ''] and data.get('tc', none) is not none }}
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tc',
