      {% set entry = runtime[0] if runtime | count >= 1 else '' %}
      {% set parts = entry.split('|') if entry else [] %}
      {{ parts | count >= 6 and parts[0] != '' and parts[1] in ['Watts', 'Percent'] and is_number(states(parts[0])) }}
    state: >-
      {% set runtime_raw = state_attr('sensor.hpvc_effective_inverter_runtime', 'runtime_json') %}
