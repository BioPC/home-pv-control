input_select:
  hpvc_charge_strategy:
    name: Charge Strategy
    icon: mdi:battery-charging
    options:
    - Charge
    - Full stop
    - Self-consumption
    - Timed
    - Dynamic
    - Charge PV
    - Sell
    - Zero import
    - Standby / peak shave
  hpvc_balanced_strategy:
    name: Balanced Strategy
    icon: mdi:battery-sync
    options:
    - Dynamic
    - Full stop
    - Self-consumption
    - Timed
    - Charge
    - Charge PV
    - Sell
    - Zero import
    - Standby / peak shave
  hpvc_expensive_strategy:
    name: Expensive Strategy
