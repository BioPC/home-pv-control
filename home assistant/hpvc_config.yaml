input_button:
  hpvc_defaults_restored_event:
    name: HPVC Defaults Restored Event
    icon: mdi:restore
  hpvc_export_report:
    name: HPVC Generate Report
    icon: mdi:file-document-plus-outline
template:
- sensor:
  - name: HPVC Diag Market/Export Price
    default_entity_id: sensor.hpvc_diag_market_export_price
    unique_id: hpvc_diag_market_export_price
    unit_of_measurement: €/kWh
    icon: mdi:cash
    state: '{{ states(states(''input_text.hpvc_market_price_sensor'')) | float(0) }}'
  - name: HPVC Diag All In Price
    unique_id: hpvc_diag_all_in_price
    unit_of_measurement: €/kWh
    icon: mdi:cash-multiple
    state: '{{ states(states(''input_text.hpvc_all_in_price_sensor'')) | float(0) }}'
  - name: HPVC Diag Grid Power
    unique_id: hpvc_diag_grid_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:transmission-tower
    state: '{{ states(states(''input_text.hpvc_grid_power_sensor'')) | float(0) | round(0) }}'
  - name: HPVC Diag PV Power
    unique_id: hpvc_diag_pv_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:solar-power
    state: '{{ states(states(''input_text.hpvc_pv_power_sensor'')) | float(0) | round(0) }}'
  - name: HPVC Diag HBC Strategy
    unique_id: hpvc_diag_hbc_strategy
    icon: mdi:battery-sync
    state: '{{ states(states(''input_text.hpvc_battery_strategy_entity'')) }}'
  - name: HPVC Total HBC Charging Power
    unique_id: hpvc_total_hbc_charging_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:battery-arrow-down
    state: >-
      {% set count = states('input_number.house_battery_count') | int(0) %}
      {% set ns = namespace(total=0) %}
      {% for i in range(1, [count, 10] | min + 1) %}
        {% set ent = 'sensor.marstek_m' ~ i ~ '_ac_power' %}
        {% if has_value(ent) %}
          {% set power = states(ent) | float(0) %}
          {% if power < 0 %}
            {% set ns.total = ns.total + (power * -1) %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.total | round(0) }}
  - name: HPVC Daily Target Accuracy
    unique_id: hpvc_daily_target_accuracy
    unit_of_measurement: "%"
    icon: mdi:target
    availability: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {{ data.get('da', none) is not none }}
    state: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {% set value = data.get('da', 0) %}
      {{ [[value | float(0), 0] | max, 100] | min | round(0) }}
  - name: HPVC Daily Reveal Accuracy
    unique_id: hpvc_daily_reveal_accuracy
    unit_of_measurement: "%"
    icon: mdi:battery-sync-outline
    availability: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {{ data.get('ra', none) is not none }}
    state: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {% set value = data.get('ra', 0) %}
      {{ [[value | float(0), 0] | max, 100] | min | round(0) }}
  - name: HPVC Target Control Response Impact
    unique_id: hpvc_target_control_response_impact
    unit_of_measurement: "%"
    icon: mdi:swap-horizontal-bold
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tctrlp', 0) | float(0) | round(1) }}
  - name: HPVC Target Other Impact
    unique_id: hpvc_target_other_impact
    unit_of_measurement: "%"
    icon: mdi:arrow-oscillating
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('totherp', 0) | float(0) | round(1) }}
  - name: HPVC Target PV Availability Impact
    unique_id: hpvc_target_pv_availability_impact
    unit_of_measurement: "%"
    icon: mdi:weather-cloudy
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('tpvavailp', 0) | float(0) | round(1) }}
  - name: HPVC Target House Load Changes Impact
    unique_id: hpvc_target_house_load_changes_impact
    unit_of_measurement: "%"
    icon: mdi:home-lightning-bolt-outline
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('thloadp', 0) | float(0) | round(1) }}
  - name: HPVC Reveal Interrupted Impact
    unique_id: hpvc_reveal_interrupted_impact
    unit_of_measurement: "%"
    icon: mdi:solar-power-variant-outline
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('rintrp', 0) | float(0) | round(1) }}
  - name: HPVC Reveal Overshoot Impact
    unique_id: hpvc_reveal_overshoot_impact
    unit_of_measurement: "%"
    icon: mdi:trending-up
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('rovp', 0) | float(0) | round(1) }}
  - name: HPVC Reveal Limited PV Response Impact
    unique_id: hpvc_reveal_limited_pv_response_impact
    unit_of_measurement: "%"
    icon: mdi:weather-partly-cloudy
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('rlimp', 0) | float(0) | round(1) }}
  - name: HPVC Reveal Other Impact
    unique_id: hpvc_reveal_other_impact
    unit_of_measurement: "%"
    icon: mdi:chart-donut
    state: >-
      {{ (states('input_text.hpvc_accuracy_diagnostics_json') | from_json(default={})).get('rotherp', 0) | float(0) | round(1) }}
  - name: HPVC Reveal Request
    unique_id: hpvc_reveal_request
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:solar-power-variant-outline
    state: >-
      {% set data = states('input_text.hpvc_last_targets_json') | from_json(default={}) %}
      {% set value = data.get('rev', 0) %}
      {{ [value | float(0), 0] | max | round(0) }}
  - name: HPVC Last Calculation
    unique_id: hpvc_last_calculation
    icon: mdi:calculator-variant-outline
    state: '{% set grid = states(states(''input_text.hpvc_grid_power_sensor''))|float(0) %} {% set target = states(''input_number.hpvc_export_stop_threshold'')|float(-25) %} {% set error = (target - grid)|round(0) %} Grid={{ grid|round(0) }}W Target={{ target|round(0) }}W Error={{ error }}W'
  - name: HPVC PV1 Actual Limit
    unique_id: hpvc_pv1_actual_limit
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:solar-panel
    availability: >-
      {% set ent = states('input_text.hpvc_pv1_limit_number') %}
      {{
        states('input_number.hpvc_inverter_count') | int(0) >= 1
        and ent not in ['unknown', 'unavailable', 'none', 'select_entity_first', '']
        and '.' in ent
        and is_number(states(ent))
      }}
    state: >-
      {% set ent = states('input_text.hpvc_pv1_limit_number') %}
      {{ states(ent) | float(0) | round(0) }}
