name: Validate HPVC release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate release integrity
        run: python scripts/validate_release.py

      - name: Test activation recovery behavior
        run: python scripts/test_activation_recovery.py

      - name: Test optional Insights mode
        run: python scripts/test_insights_mode.py

      - name: Test issue #9 runtime-load behavior
        run: python scripts/test_control_runtime_load.py
