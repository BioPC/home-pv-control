name: Validate native HPVC dry-run stages
on:
  push:
    branches:
      - codex/hpvc-readonly-acceptance
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            ha: "2025.12.0"
            test_plugin: "0.13.298"
            requirements: "requirements-test-ha-minimum.txt"
          - python: "3.14"
            ha: "2026.10.4"
            test_plugin: "0.13.375"
            requirements: "requirements-test-ha.txt"
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Python failure propagates through tee
        run: |
          marker="$RUNNER_TEMP/hpvc-pipefail-unreachable"
          if bash -e -c 'set -o pipefail; python -c "raise SystemExit(23)" | tee "$RUNNER_TEMP/hpvc-pipefail-probe.log"; touch "$RUNNER_TEMP/hpvc-pipefail-unreachable"'; then
            echo "ERROR: Python pipeline failure was masked"
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 23
          test ! -e "$marker"
          echo "PIPEFAIL_PROBE_PASSED: Python exit 23 propagated; subsequent command did not run"
      - name: Validate v2 development metadata
        run: python scripts/validate_development.py
      - name: Site audit read-only export and scanner
        run: node scripts/test_site_audit_tools.cjs
      - name: Legacy migration bridge and contained fencing
        run: node scripts/test_migration_bridge.cjs
      - name: Original v1.6 dispatcher fake characterization
        run: node scripts/build_dispatch_characterization.cjs
      - name: Foundation behavior and no-actuation safety tests
        run: |
          set -o pipefail
          python -B scripts/test_foundation.py 2>&1 | tee foundation-results.log
      - name: Strict ownership and permanent transport veto
        run: |
          set -o pipefail
          python -B validation/ownership-hardening/strict-requirements-check.py --source-root . | tee strict-ownership-results.log
      - name: Dashboard data and parity regression suites
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests/foundation -p 'test_dashboard*.py' -v 2>&1 | tee dashboard-unit-results.log
      - name: Production-derived redacted fixture (local files only)
        run: |
          python -B audit_tools/site_audit.py --input tests/fixtures/site-audit-production-12-collisions-redacted.json --output-directory site-fixture-ci
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('site-fixture-ci/site-readiness.json').read_text())
          expected = {'number.hms_1000_2t_limit_nonpersistent_absolute', 'number.hms_2000_4t_limit_nonpersistent_absolute'}
          owned = {'binary_sensor.hpvc_required_inputs_ready', 'sensor.hpvc_installed_version'} | {f'switch.hpvc_pv{i}_control' for i in range(1, 11)}
          collisions = [x for x in r['registry_migration'] if x['collision']]
          assert not r['import_preview']['issues']
          assert {x['writable_entity'] for x in r['controllers']} == expected
          assert {x['intended_entity_id'] for x in collisions} == owned
          assert all(x['ownership_classification'] == 'proven_legacy_hpvc_owned' and not x['proposal'] for x in collisions)
          assert not r['production_transport_authorized'] and not r['import_preview']['committed']
          assert not r['handoff_projection']['production_state_advanced']
          assert r['authorization_design']['dev8_permanent_veto'] is True
          assert r['overall_verdict'] == 'UNKNOWN'
          print(json.dumps(dict(import_issues=0, controllers=sorted(expected), proven_collisions=len(collisions), registry_proposals=0, import_committed=False, ownership_advanced=False, production_transport_authorized=False, permanent_veto=True, historical_readiness=r['overall_verdict'])))
          PY
      - name: Install exact Home Assistant test environment
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Install matching frontend dependency for backend config acceptance
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          import homeassistant
          manifest = Path(homeassistant.__file__).parent / 'components/frontend/manifest.json'
          requirements = json.loads(manifest.read_text())['requirements']
          print('Exact installed HA frontend requirements:', requirements, flush=True)
          subprocess.run([sys.executable, '-m', 'pip', 'install', *requirements], check=True)
          PY
      - name: Dashboard frontend and chart execution
        run: |
          set -o pipefail
          node scripts/test_dashboard_frontend.cjs | tee dashboard-frontend-results.log
      - name: Dashboard template rendering
        run: |
          set -o pipefail
          python -B scripts/test_dashboard_templates.py | tee dashboard-template-results.log
      - name: Generated dashboard and native bindings
        run: |
          set -o pipefail
          python -B scripts/validate_dashboard_parity.py | tee dashboard-validation-results.log
      - name: Record installed environment
        run: python -m pip freeze
      - name: Real Home Assistant acceptance
        run: |
          set -o pipefail
          python -m pytest tests/ha -v -rA --junitxml=acceptance-results.xml 2>&1 | tee ha-acceptance-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-ha-${{ matrix.ha }}
          path: |
            acceptance-results.xml
            foundation-results.log
            dashboard-unit-results.log
            dashboard-frontend-results.log
            dashboard-template-results.log
            dashboard-validation-results.log
            ha-acceptance-results.log
            strict-ownership-results.log
            validation/ownership-hardening/strict-requirements-results.json
            site-fixture-ci/site-readiness.json
