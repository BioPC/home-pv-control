name: Native dashboard browser acceptance
on:
  push:
    branches: [codex/hpvc-readonly-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            ha: '2025.12.0'
            requirements: requirements-test-ha-minimum.txt
          - python: '3.14'
            ha: '2026.10.4'
            requirements: requirements-test-ha.txt
    name: Browser HA ${{ matrix.ha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact HA, frontend and browser
        run: |
          python -m pip install -r ${{ matrix.requirements }} playwright==1.64.1
          python - <<'PY'
          import homeassistant, json, subprocess, sys, urllib.request
          from pathlib import Path
          root=Path(homeassistant.__file__).parent
          requirements=[]
          for domain in ('frontend','http','recorder'):
              requirements.extend(json.loads((root/'components'/domain/'manifest.json').read_text()).get('requirements',[]))
          subprocess.run([sys.executable,'-m','pip','install',*requirements],check=True)
          Path('work').mkdir(exist_ok=True)
          urllib.request.urlretrieve('https://github.com/RomRider/apexcharts-card/releases/download/v2.2.3/apexcharts-card.js','work/apexcharts-card.js')
          PY
          python -m playwright install --with-deps chromium
      - name: Actual HA frontend acceptance and browser captures
        timeout-minutes: 14
        run: |
          set -o pipefail
          (while sleep 30; do date -u; free -m; ps -eo pid,comm,rss --sort=-rss | awk 'NR<=12'; done) > frontend-memory.log &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          python tests/frontend/run_browser_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-ha-${{ matrix.ha }}
          path: |
            frontend-results.xml
            frontend-browser.log
            frontend-memory.log
            frontend-runner-status.json
            frontend-evidence/
